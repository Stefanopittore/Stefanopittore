<title>Casting Claudia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Layout: a phone social app used as a test bench. Stories row, feed of carousels, explore grid, activity (finalists), Claudia's own profile; full-screen stories that follow the finger; sheets that slide in and swipe back */
:root{
  --bg:#FFFFFF; --fg:#0A0A0A; --muted:#737373; --line:#DBDBDB; --soft:#EFEFEF; --surface:#FFFFFF;
  --like:#FF3040; --link:#0095F6; --chip:#F2EDE6; --studio:#E7E7E4;
  --ig1:#F9CE34; --ig2:#EE2A7B; --ig3:#6228D7;
  --v-bg:#000000; --v-fg:#FFFFFF; --v-dim:rgba(255,255,255,.35);
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --fg:#F5F5F5; --muted:#A8A8A8; --line:#262626; --soft:#1C1C1C; --surface:#121212; --chip:#2A241E; --studio:#1E1E1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --fg:#F5F5F5; --muted:#A8A8A8; --line:#262626; --soft:#1C1C1C; --surface:#121212; --chip:#2A241E; --studio:#1E1E1E; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(64px + env(safe-area-inset-bottom,0px));
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.lock{overflow:hidden}
[hidden]{display:none!important}
h1,h2,h3,h4,p{margin:0}
img{display:block;max-width:100%;-webkit-user-drag:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{font:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.app{max-width:470px;margin:0 auto}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round;display:block}
[aria-pressed="true"] svg.heart{fill:var(--like);stroke:var(--like);animation:pop .35s var(--ease)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:16px;height:52px}
.logo{font-family:var(--display);font-weight:800;font-variation-settings:"wdth" 112;font-size:23px;letter-spacing:-.01em;flex:1;white-space:nowrap}
.icon-btn{position:relative;width:32px;height:32px;display:grid;place-items:center}
.icon-btn .dot{position:absolute;top:0;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--like);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}

/* Stories row */
.stories{display:flex;gap:14px;overflow-x:auto;padding-block:6px 12px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.stories::-webkit-scrollbar{display:none}
.st{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;width:70px}
.st span{font-size:12px;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{display:block;padding:2.5px;border-radius:50%;background:linear-gradient(45deg,var(--ig1),var(--ig2) 55%,var(--ig3));position:relative;flex:none}
.ring img{width:62px;height:62px;border-radius:50%;object-fit:cover;object-position:50% 28%;border:3px solid var(--bg);background:var(--soft)}
.ring.seen{background:var(--line)}
.ring.fin{background:var(--like)}
.ring .badge{position:absolute;right:-3px;bottom:-1px;min-width:20px;height:20px;border-radius:10px;background:var(--fg);color:var(--bg);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg);font-variant-numeric:tabular-nums}
.ring.sm{padding:2px}
.ring.sm img{width:30px;height:30px;border-width:2px}
.ring.xl img{width:82px;height:82px}
.ring.xs{padding:1.5px}
.ring.xs img{width:22px;height:22px;border-width:1.5px}

/* Feed */
.feed{display:flex;flex-direction:column}
.post{display:flex;flex-direction:column;padding-block:10px 18px;scroll-margin-top:60px;content-visibility:auto;contain-intrinsic-size:auto 720px}
.p-head{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.p-who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25;text-align:left}
.p-who b{font-size:14px}
.p-who span{font-size:12px;color:var(--muted)}
.more{width:32px;height:32px;display:grid;place-items:center}
.car-wrap{position:relative}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:4px;aspect-ratio:4/5;background:var(--studio);overscroll-behavior-x:contain;touch-action:pan-x pan-y}
.car::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;position:relative;overflow:hidden;background:var(--studio)}
.slide img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;pointer-events:none}
.slide.panel img{object-fit:contain}
.ctr{position:absolute;right:10px;top:10px;background:rgba(18,18,18,.7);color:#fff;font-size:12px;font-weight:600;padding:3px 9px;border-radius:12px;font-variant-numeric:tabular-nums;pointer-events:none;transition:opacity .3s}
.tag{position:absolute;left:10px;bottom:10px;background:rgba(18,18,18,.7);color:#fff;font-size:12px;font-weight:600;padding:4px 9px;border-radius:12px;pointer-events:none}
.arrow{position:absolute;top:50%;translate:0 -50%;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.85);color:#111;display:none;place-items:center;font-weight:800;font-size:18px;line-height:1}
.arrow.prev{left:8px}.arrow.next{right:8px}
@media (hover:hover){.car-wrap:hover .arrow{display:grid}}
.burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;z-index:2}
.burst svg{width:100px;height:100px;fill:#fff;stroke:none;filter:drop-shadow(0 2px 10px rgba(0,0,0,.35))}
.burst.go{animation:burst .9s var(--ease)}
@keyframes burst{0%{opacity:0;transform:scale(.3)}20%{opacity:1;transform:scale(1.15)}35%{transform:scale(.95)}50%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
.p-act{display:flex;align-items:center;gap:14px;padding-top:10px;position:relative}
.p-act .grow{flex:1}
.dots{position:absolute;left:50%;translate:-50% 0;display:flex;gap:4px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .2s}
.dots i.on{background:var(--link)}
.likes{font-weight:600;padding-top:8px}
.likes.muted{font-weight:400}
.cap{padding-top:4px}
.cap b{margin-right:5px}
.cap .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap.open .clamp{-webkit-line-clamp:unset}
.cap .moreb{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--chip);padding:3px 9px;border-radius:10px;font-size:12px;font-weight:600}
.saved-note{padding-top:4px}
.saved-note b{margin-right:5px}
.add-note{display:flex;align-items:center;gap:8px;padding-top:8px}
.add-note input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);padding:4px 0;font-size:14px;outline:none}
.add-note input::placeholder{color:var(--muted)}
.add-note button{color:var(--link);font-weight:600}
.when{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding-top:6px}

/* Grids */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:18px 0 8px}
.sec-h h2{font-size:16px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}
.tile{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--soft);touch-action:pan-x pan-y}
.tile img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.tile .lbl{position:absolute;left:5px;bottom:5px;max-width:calc(100% - 10px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(18,18,18,.65);color:#fff;font-size:11px;font-weight:600;padding:2px 7px;border-radius:9px;pointer-events:none}
.tile .mark{position:absolute;top:5px;right:5px;width:22px;height:22px;display:none;place-items:center;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.tile .mark svg{width:20px;height:20px;fill:var(--like);stroke:var(--like)}
.tile.fin .mark{display:grid}
.explore{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:calc((min(100vw - 32px, 470px) - 4px) / 3);grid-auto-flow:dense;gap:2px;padding-top:8px}
.explore .tile{aspect-ratio:auto}
.explore .tile.tall{grid-row:span 2}
.search{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:8px 12px;margin-top:6px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);outline:none}

/* Bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
  padding:0 max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.tabs div{max-width:470px;margin:0 auto;display:flex;justify-content:space-around;height:52px;align-items:center}
.tabs button{width:52px;height:44px;display:grid;place-items:center;position:relative;color:var(--fg)}
.tabs button[aria-current="page"] svg.i{stroke-width:2.6}
.tabs button[aria-current="page"] .ring.xs{background:var(--fg)!important}
.tabs .dot{position:absolute;top:6px;right:12px;width:6px;height:6px;border-radius:50%;background:var(--like)}

/* Sheets slide in from the right and swipe back */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;transform:translateX(100%);transition:transform .28s var(--ease);
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:-8px 0 24px rgba(0,0,0,.08)}
.sheet.in{transform:translateX(0)}
.sheet.drag{transition:none}
.s-in{max-width:470px;margin:0 auto}
.s-top{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:14px;height:50px}
.s-top b{font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-head{display:flex;align-items:center;gap:24px;padding-top:4px}
.pr-stats{flex:1;display:flex;justify-content:space-around;text-align:center}
.pr-stats b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.pr-stats span{font-size:13px}
.pr-bio{padding-top:10px;display:flex;flex-direction:column;gap:2px}
.pr-btns{display:flex;gap:6px;padding-top:12px}
.pr-btns button{flex:1;height:32px;border-radius:8px;font-weight:600;background:var(--soft);display:flex;justify-content:center;align-items:center;gap:6px}
.pr-btns button svg.i{width:16px;height:16px}
.pr-btns button.follow{background:var(--link);color:#fff}
.pr-btns button.follow[aria-pressed="true"]{background:var(--soft);color:var(--fg)}
.pr-tabs{display:flex;border-top:1px solid var(--line);margin-top:14px}
.pr-tabs span{flex:1;display:grid;place-items:center;height:44px;border-top:1px solid var(--fg);margin-top:-1px}
.high{display:flex;gap:16px;overflow-x:auto;padding-block:16px 4px;scrollbar-width:none}
.high::-webkit-scrollbar{display:none}
.hl{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;width:66px;font-size:12px;text-align:center}
.hl i{width:62px;height:62px;border-radius:50%;border:1px solid var(--line);padding:3px;display:block;font-style:normal}
.hl i span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-family:var(--display);font-weight:800;font-size:20px;overflow:hidden}
.hl i img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 25%}
.detail{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.detail h3{font-size:19px;line-height:1.25;font-family:var(--display);font-weight:800}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card h4{font-size:14px}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.copy{white-space:pre-line}
.tagsline{font-size:13px;color:var(--link)}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:6px;padding-block:8px;border-top:1px solid var(--line)}
.vrow b{min-width:0;overflow:hidden;text-overflow:ellipsis}
.pill{height:30px;padding:0 12px;border-radius:8px;background:var(--soft);font-weight:600;font-size:13px;display:flex;align-items:center;gap:5px}
.pill svg.i{width:15px;height:15px}
.pill.on{background:var(--fg);color:var(--bg)}
.vrow [data-voice]{width:36px;height:36px;display:grid;place-items:center}

/* Activity (finalists) */
.act{display:flex;align-items:center;gap:12px;padding-block:9px;width:100%;text-align:left}
.act div{flex:1;min-width:0}
.act p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act img.th{width:44px;height:44px;object-fit:cover;object-position:50% 25%;border-radius:4px}
.cmp-open{width:100%;height:36px;margin-top:12px;border-radius:8px;background:var(--link);color:#fff;font-weight:600}
.empty{padding:36px 0;color:var(--muted);text-align:center}
.seg{display:flex;gap:6px;overflow-x:auto;padding-block:4px 12px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;height:32px;padding:0 12px;border-radius:8px;background:var(--soft);font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.cmp{display:grid;grid-auto-flow:column;grid-auto-columns:var(--w,50%);gap:4px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.cmp::-webkit-scrollbar{display:none}
.cmp figure{margin:0;scroll-snap-align:start;display:flex;flex-direction:column;gap:5px;min-width:0}
.cmp figure button{display:block;border-radius:4px;overflow:hidden;background:var(--studio);aspect-ratio:3/5;width:100%;touch-action:pan-x pan-y}
.cmp img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.cmp figcaption{font-size:13px;font-weight:600;line-height:1.2}
.cmp-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px}
.cmp-nav button{height:32px;padding:0 14px;border-radius:8px;background:var(--soft);font-weight:600}

/* Story viewer */
.viewer{position:fixed;inset:0;z-index:50;background:var(--v-bg);color:var(--v-fg);display:flex;justify-content:center;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none;transition:background-color .2s,opacity .22s}
.v-stage{position:relative;width:100%;max-width:min(100vw,calc(100dvh * 9 / 16));height:100%;overflow:hidden;background:var(--v-bg);
  transition:transform .26s var(--ease),opacity .22s;will-change:transform}
@media (min-width:600px){.v-stage{height:calc(100% - 40px);border-radius:10px}}
.viewer.enter{opacity:0}
.viewer.enter .v-stage{transform:scale(.9)}
.viewer.drag .v-stage{transition:none}
.v-bg{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);max-width:none;object-fit:cover;filter:blur(26px) brightness(.55);pointer-events:none}
.v-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.v-top{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 26px;background:linear-gradient(rgba(0,0,0,.45),transparent);z-index:3;transition:opacity .15s}
.v-bars{display:flex;gap:2px}
.v-bars i{flex:1;height:2px;border-radius:2px;background:var(--v-dim);overflow:hidden}
.v-bars i b{display:block;height:100%;width:0;background:var(--v-fg)}
.v-head{display:flex;align-items:center;gap:8px;margin-top:10px;padding-left:4px}
.v-head img{width:32px;height:32px;border-radius:50%;object-fit:cover;object-position:50% 28%}
.v-head div{flex:1;min-width:0;line-height:1.2}
.v-head b{font-size:14px;font-weight:600}
.v-head b small{font-weight:400;opacity:.7;margin-left:6px;font-size:13px}
.v-head span{display:block;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-head button{width:40px;height:40px;display:grid;place-items:center;color:var(--v-fg)}
.v-cap{position:absolute;left:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:3;background:rgba(0,0,0,.45);padding:5px 10px;border-radius:14px;font-size:13px;font-weight:600;pointer-events:none;transition:opacity .15s}
.v-foot{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;gap:12px;align-items:center;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.5));transition:opacity .15s}
.v-foot input{flex:1;min-width:0;background:transparent;border:1px solid rgba(255,255,255,.55);color:var(--v-fg);border-radius:22px;padding:10px 16px;font-size:14px;outline:none}
.v-foot input::placeholder{color:rgba(255,255,255,.8)}
.v-foot button{color:var(--v-fg);width:36px;height:40px;display:grid;place-items:center}
.v-foot button svg.i{width:27px;height:27px}
#v-send{width:auto;font-weight:700;font-size:15px}
.v-hold .v-top,.v-hold .v-foot,.v-hold .v-cap{opacity:0}
.v-burst{z-index:4}

/* Pinch in place */
.pz-shade{position:fixed;inset:0;z-index:89;background:var(--v-bg);opacity:0;pointer-events:none}

.toast{position:fixed;left:50%;translate:-50% 0;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:60;background:rgba(38,38,38,.95);color:#fff;font-size:13px;font-weight:600;padding:9px 15px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:translateY(6px);max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateY(0)}

/* Account switcher: bottom sheet like Instagram's */
.acct{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,0);transition:background .24s}
.acct.in{background:rgba(0,0,0,.45)}
.acct-pane{position:absolute;left:0;right:0;bottom:0;max-width:470px;margin:0 auto;background:var(--surface);border-radius:16px 16px 0 0;
  padding:8px 16px calc(14px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .28s var(--ease)}
.acct.in .acct-pane{transform:none}
.acct-pane.drag{transition:none}
.grab{display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 12px}
.acct-t{display:block;text-align:center;font-size:16px;padding-bottom:10px}
.acct-row{display:flex;align-items:center;gap:12px;width:100%;padding:9px 0;text-align:left}
.acct-row .ring.sm img{width:52px;height:52px}
.acct-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.acct-txt span{font-size:13px}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.acct-row[aria-checked="true"] .chk{background:var(--link);border-color:var(--link)}
.acct-row[aria-checked="true"] .chk::after{content:"";width:9px;height:5px;border:solid #fff;border-width:0 0 2px 2px;rotate:-45deg;translate:0 -1px}
.acct-note{font-size:12px;text-align:center;padding-top:8px}
.acct-btn{display:flex;align-items:center;gap:2px;flex:1;min-width:0;font-size:18px}
.acct-btn b{flex:0 1 auto;font-size:20px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-btn svg.i{width:18px;height:18px;stroke-width:2.4}
.tabs button{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.acct-quick{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.acct-quick img{width:28px;height:28px;border-radius:50%;object-fit:cover;object-position:50% 28%}

/* First reel: pinned card in the feed and the brief */
.vcard{position:relative;display:block;width:100%;aspect-ratio:4/5;overflow:hidden;border-radius:4px;background:#111;color:#fff;text-align:left}
.vcard img{width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.vcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 50%,rgba(0,0,0,.75))}
.vc-top{position:absolute;z-index:1;left:12px;top:12px;font-size:12px;font-weight:700;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:4px 9px;border-radius:12px}
.vc-bot{position:absolute;z-index:1;left:14px;right:14px;bottom:14px;display:flex;flex-direction:column;gap:4px}
.vc-bot b{font-family:var(--display);font-size:24px;line-height:1.1;font-weight:800}
.vc-bot span{font-size:13px;opacity:.9}
.vc-play{position:absolute;z-index:1;right:12px;top:10px;width:28px;height:28px}
.vok{display:flex;gap:8px;padding-top:4px}
.vok button{flex:1;height:40px;border-radius:8px;background:var(--soft);font-weight:700}
.vok button[aria-pressed="true"]{background:var(--link);color:#fff}
.vstate{font-weight:600}
.vstate.ok{color:var(--link)}
.rhythm{display:flex;gap:2px;height:26px;margin-top:2px}
.rhythm i{display:block;border-radius:3px;background:var(--line);min-width:3px}
.rhythm i.her{background:var(--link)}
.r-legend{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.r-legend b{color:var(--link);font-weight:600}
.sb{display:flex;flex-direction:column}
.sb-row{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding-block:10px;border-top:1px solid var(--line)}
.sb-row:first-child{border-top:0}
.sb-t{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);padding-top:2px}
.sb-row p{font-size:14px}
.sb-row .say{font-weight:600}
.sb-row .os{font-size:12px;color:var(--muted)}
.alert{border-color:var(--like)}
.alert h4{color:var(--like)}
details summary{cursor:pointer;font-weight:600;font-size:14px;padding-block:4px}
details p{font-size:13px;padding-top:4px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:14px}
.kv dt{font-weight:600}
.kv dd{margin:0}
.linkish{color:var(--link);word-break:break-word}

.print-only{display:none}
@media print{
  @page{size:A4 landscape;margin:9mm}
  body{padding:0;background:#fff;color:#0A0A0A}
  body::before,.app,.tabs,.viewer,.sheet,.toast{display:none!important}
  .print-only{display:block;font-family:var(--ui)}
  .pp{break-inside:avoid;margin-bottom:6mm}
  .pp h2{font-family:var(--display);font-size:16px;margin:0 0 2mm}
  .pp .row{display:grid;grid-template-columns:repeat(8,1fr);gap:2mm}
  .pp img{width:100%;aspect-ratio:3/5;object-fit:cover;object-position:50% 30%}
  .pp p{font-size:10px;color:#556}
  .ph{font-family:var(--display);font-size:30px;font-weight:900;margin-bottom:4mm}
  .pposts{columns:2;column-gap:8mm;font-size:10.5px}
  .pposts div{break-inside:avoid;margin-bottom:4mm}
}
@media (prefers-reduced-motion:reduce){.sheet,.v-stage,.toast,.viewer{transition:none}.burst.go,[aria-pressed="true"] svg.heart{animation:none}}
