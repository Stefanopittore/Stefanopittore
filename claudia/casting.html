function post(s) {
  const car = el("div", { class: "car", tabindex: "0", "aria-label": `Fotos de la candidata ${s.n}` });
  s.frames.forEach(f => car.append(el("div", { class: PANEL.has(f.k) ? "slide panel" : "slide", "data-hd": f.hd },
    img(f.src, f.hd, { alt: `Candidata ${s.n}, ${f.cap.toLowerCase()}` }), el("span", { class: "tag", text: f.cap }))));
  const ctr = el("span", { class: "ctr", text: `1/${s.frames.length}` });
  const burst = el("div", { class: "burst", html: `<svg viewBox="0 0 24 24"><path d="${HEART_PATH}"/></svg>` });
  const prev = el("button", { type: "button", class: "arrow prev", "aria-label": "Foto anterior", text: "‹" });
  const next = el("button", { type: "button", class: "arrow next", "aria-label": "Foto siguiente", text: "›" });
  const dots = el("div", { class: "dots", "aria-hidden": "true" });
  s.frames.forEach((_, i) => dots.append(el("i", { class: i ? "" : "on" })));
  const here = () => Math.round(car.scrollLeft / car.clientWidth);
  const go = d => car.scrollTo({ left: (here() + d) * car.clientWidth, behavior: "smooth" });
  prev.addEventListener("click", () => go(-1));
  next.addEventListener("click", () => go(1));
  let ctrT, lastI = 0;
  car.addEventListener("scroll", () => {
    const i = here();
    ctr.style.opacity = "1"; clearTimeout(ctrT); ctrT = setTimeout(() => { ctr.style.opacity = "0"; }, 2500);
    if (i === lastI) return;
    lastI = i; ctr.textContent = `${i + 1}/${s.frames.length}`;
    [...dots.children].forEach((d, j) => d.classList.toggle("on", j === i));
  }, { passive: true });
  car.addEventListener("keydown", e => { if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); });
  attachPinch(car, () => car.children[here()]);
  // Double tap = like = finalist
  let last = 0, sx = 0, sy = 0, pinched = false;
  const touches = new Set();
  car.addEventListener("pointerdown", e => { if (!touches.size) pinched = false; touches.add(e.pointerId); sx = e.clientX; sy = e.clientY; if (touches.size > 1) pinched = true; });
  car.addEventListener("pointercancel", e => touches.delete(e.pointerId));
  car.addEventListener("pointerup", e => {
    touches.delete(e.pointerId);
    if (pinched || Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) return;
    const now = Date.now();
    if (now - last < 300) { last = 0; if (!picks[s.key]?.finalist) toggle(s.key); pop(burst); } else last = now;
  });

  const noteBtn = el("button", { type: "button", "aria-label": "Escribir nota", html: BUBBLE });
  const ni = noteInput(s.key, `Nota sobre la candidata ${s.n}`);

  const storyBtn = el("button", { type: "button", "aria-label": "Ver en historia", html: PLAY });

  const more = el("button", { type: "button", class: "more", "aria-label": "Ver perfil", html: DOTS });
  more.addEventListener("click", () => openProfile(s, more));
  const who = el("button", { type: "button", class: "p-who", "aria-label": `Perfil de la candidata ${s.n}` }, el("b", { text: s.handle }), el("span", { text: `${s.title} · ${s.age} años` }));

  av.addEventListener("click", () => openStory(SETS.indexOf(s), 0, av));

  const chips = el("div", { class: "chips" });
  for (const c of s.chips) chips.append(el("span", { class: "chip", text: c }));
  const clamp = el("div", { class: "clamp" }, el("b", { text: s.handle }),
    document.createTextNode(`${s.title}, ${s.age} años. ${s.inspired ? "Rasgos de " + s.inspired + ". " : ""}8 fotos: seria, sonrisa, perfil, cuerpo, bikini elegante y atrevido, puerta y look de presentadora.`));
  const moreB = el("button", { type: "button", class: "moreb", text: "más" });
  const cap = el("div", { class: "cap" }, clamp, moreB, chips);
  moreB.addEventListener("click", () => { cap.classList.add("open"); moreB.remove(); });

    el("div", { class: "p-head" }, av, who, more),
    el("div", { class: "car-wrap" }, car, ctr, burst, prev, next),
    el("div", { class: "p-act" }, heartBtn(s.key), noteBtn, storyBtn, dots, el("span", { class: "grow" })),
    el("p", { class: "likes", "data-likes": s.key }),
    cap,
    el("p", { class: "saved-note", "data-saved": s.key, hidden: "" }),

}

// ---------- Explore ----------
function renderExplore() {
  const box = $("explore");
  const mine = CL.posts.map((f, i) => ({ post: i, src: `${acct.dir}/posts/${f}.jpg`, hd: `${acct.dir}/posts/hd/${f}.jpg`, words: "claudia publicacion post", open: t => openPost(i, t) }));
  const theirs = [];
  SETS.forEach((s, si) => { if (!s.n) return; s.frames.forEach((f, fi) => theirs.push({ src: f.src, hd: f.hd, pick: s.key, words: `${s.title} ${s.chips.join(" ")} ${f.cap} ${s.group} ${s.n}`, open: t => openStory(si, fi, t) })); });
  // Shuffle shots so the grid reads like an explore page, with Claudia's posts sprinkled in
  const order = theirs.map((x, i) => [((i * 37) % theirs.length), x]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  const mixed = [];
  order.forEach((x, i) => { mixed.push(x); if (i % 9 === 4 && mine.length) mixed.push(mine.shift()); });
  mixed.push(...mine);
  mixed.forEach((it, i) => {
    const t = tile(it.src, it.hd, null, () => it.open(t), it.pick);
    t.dataset.words = it.words;
    if (it.post != null) t.dataset.post = it.post;
    if (i % 10 === 2 || i % 10 === 5) t.classList.add("tall");
    box.append(t);
  });
  pinchTiles(box);
  const norm = x => x.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  $("q").addEventListener("input", e => {
    const q = norm(e.target.value.trim());
    box.querySelectorAll(".tile").forEach(t => { t.hidden = !!q && !norm(t.dataset.words).includes(q); });
  });
}

// ---------- Sheets: slide in, swipe from the left edge to go back ----------
const openers = {};
function openSheet(id, from) {
  openers[id] = from || document.activeElement;
  const s = $(id);
  s.classList.remove("in"); s.style.transform = "";
  s.hidden = false; s.scrollTop = 0; lock();
  requestAnimationFrame(() => requestAnimationFrame(() => s.classList.add("in")));
  setTimeout(() => s.querySelector(".back").focus({ preventScroll: true }), 30);
}
function closeSheet(id) {
  const s = $(id);
  s.classList.remove("in", "drag"); s.style.transform = "";

}
document.querySelectorAll(".sheet").forEach(s => {
  s.querySelector(".back").addEventListener("click", () => closeSheet(s.id));
  let sx = null, sy = 0, dx = 0, horiz = false;
  s.addEventListener("touchstart", e => { const t = e.touches[0]; if (e.touches.length === 1 && t.clientX < 32) { sx = t.clientX; sy = t.clientY; dx = 0; horiz = false; } else sx = null; }, { passive: true });
  s.addEventListener("touchmove", e => {
    if (sx == null) return;
    const t = e.touches[0]; dx = Math.max(0, t.clientX - sx);
    if (!horiz && Math.abs(t.clientY - sy) > 12 && dx < 12) { sx = null; return; }
    if (dx > 6) { horiz = true; s.classList.add("drag"); s.style.transform = `translateX(${dx}px)`; }
  }, { passive: true });
  s.addEventListener("touchend", () => {
    if (sx == null || !horiz) { sx = null; return; }
    sx = null; s.classList.remove("drag");
    if (dx > 90) closeSheet(s.id); else s.style.transform = "";
  });
});

// ---------- Story viewer ----------
const viewer = $("viewer"), stage = $("v-stage");
const V = { set: 0, frame: 0, start: 0, spent: 0, paused: false, raf: 0, from: null, anim: false };
const DUR = 5000;
const vImg = $("v-img"), vBg = $("v-bg"), vBars = $("v-bars"), vNote = $("v-note"), vHeart = $("v-heart"), vSend = $("v-send");

function openStory(si, fi, from) {
  V.from = from || document.activeElement;
  viewer.hidden = false; viewer.classList.add("enter"); viewer.style.backgroundColor = ""; stage.style.transform = ""; lock();
  V.paused = false;
  show(si, fi);
  requestAnimationFrame(() => requestAnimationFrame(() => viewer.classList.remove("enter")));
  setTimeout(() => $("v-close").focus({ preventScroll: true }), 30);
}
function closeStory() {
  cancelAnimationFrame(V.raf);
  viewer.classList.remove("drag"); viewer.classList.add("enter");
  setTimeout(() => { viewer.hidden = true; viewer.classList.remove("enter"); stage.style.transform = ""; viewer.style.backgroundColor = ""; unlock(); V.from?.focus?.({ preventScroll: true }); }, 220);
}
function show(si, fi) {
  const s = SETS[si], f = s.frames[fi];
  if (V.set !== si || vBars.children.length !== s.frames.length) vBars.replaceChildren(...s.frames.map(() => el("i", {}, el("b"))));
  V.set = si; V.frame = fi; V.spent = 0; V.start = performance.now();
  [...vBars.children].forEach((bar, j) => bar.firstChild.style.width = j < fi ? "100%" : "0%");
  vImg.src = f.src; vBg.src = f.src; vImg.alt = `${s.title}, ${f.cap}`; vImg.dataset.hd = f.hd || "";
  $("v-av").src = s.avatar;
  $("v-name").replaceChildren(document.createTextNode(s.n ? s.handle : s.title), el("small", { text: f.cap }));
  $("v-sub").textContent = s.n ? `${s.title} · ${s.age} años` : s.key === "old" ? "Primera ronda · 12 caras" : "Elegida · casting nº 12 · fotos base";
  $("v-cap").textContent = `${fi + 1}/${s.frames.length}`;
  $("v-profile").hidden = !s.n;
  vHeart.dataset.heart = f.pick; vNote.dataset.note = f.pick;
  vNote.value = ""; vSend.hidden = true;
  refresh();
  const nx = s.frames[fi + 1] || SETS[si + 1]?.frames[0];
  if (nx) { const p = new Image(); p.decoding = "async"; p.src = nx.src; }
  if (fi === s.frames.length - 1) markSeen(s.key);
  cancelAnimationFrame(V.raf); V.raf = requestAnimationFrame(tick);
}
function tick(now) {
  if (viewer.hidden) return;
  const t = V.paused ? V.spent : V.spent + (now - V.start);
  const p = Math.min(1, t / DUR);
  const bar = vBars.children[V.frame]; if (bar) bar.firstChild.style.width = (p * 100) + "%";
  if (p >= 1) return step(1);
  V.raf = requestAnimationFrame(tick);
}
function pause(on) {
  if (on === V.paused) return;
  if (on) V.spent += performance.now() - V.start; else V.start = performance.now();
  V.paused = on;
}
function step(d) {
  const s = SETS[V.set];
  if (d > 0 && V.frame < s.frames.length - 1) return show(V.set, V.frame + 1);
  if (d < 0 && V.frame > 0) return show(V.set, V.frame - 1);
  jump(d);
}
// Changing girl slides the next one in from the side
function jump(d) {
  const ns = V.set + d;
  if (ns >= SETS.length) return closeStory();
  if (ns < 0) { stage.style.transform = ""; return show(0, 0); }
  const w = stage.clientWidth;
  viewer.classList.remove("drag");
  stage.style.transform = `translateX(${-d * w}px)`;
  V.anim = true;
  setTimeout(() => {
    viewer.classList.add("drag");
    show(ns, 0);
    stage.style.transform = `translateX(${d * w}px)`;
    requestAnimationFrame(() => requestAnimationFrame(() => { viewer.classList.remove("drag"); stage.style.transform = ""; setTimeout(() => { V.anim = false; }, 260); }));
  }, 170);
}
// Gestures: tap left third back, rest forward; hold pauses and hides the UI; drag sideways changes girl; drag down closes
const G = { x: 0, y: 0, t: 0, mode: null, hold: 0, pinch: false, ptrs: new Set() };
attachPinch(stage, () => vImg, { start: () => pause(true), end: () => { if (document.activeElement !== vNote) pause(false); } });
stage.addEventListener("pointerdown", e => {
  if (e.target.closest(".v-foot, .v-head") || V.anim) return;
  if (!G.ptrs.size) G.pinch = false;
  G.ptrs.add(e.pointerId);
  if (G.ptrs.size > 1) { G.pinch = true; G.mode = null; clearTimeout(G.hold); viewer.classList.remove("v-hold", "drag"); stage.style.transform = ""; return; }
  G.x = e.clientX; G.y = e.clientY; G.t = Date.now(); G.mode = "tap"; pause(true);
  clearTimeout(G.hold); G.hold = setTimeout(() => viewer.classList.add("v-hold"), 230);
});
stage.addEventListener("pointermove", e => {
  if (!G.mode || G.pinch || PZ.on) return;
  const dx = e.clientX - G.x, dy = e.clientY - G.y;
  if (G.mode === "tap" && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
    clearTimeout(G.hold); viewer.classList.remove("v-hold");
    G.mode = Math.abs(dx) > Math.abs(dy) ? "x" : dy > 0 ? "y" : "none";
    viewer.classList.add("drag");
  }
  if (G.mode === "x") stage.style.transform = `translateX(${dx}px)`;
  if (G.mode === "y") { const k = Math.max(0, dy); stage.style.transform = `translateY(${k}px) scale(${1 - Math.min(k, 400) / 1600})`; viewer.style.backgroundColor = `rgba(0,0,0,${1 - Math.min(k, 400) / 500})`; }
});
