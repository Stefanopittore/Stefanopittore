<title>Casting Claudia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Layout: a phone social app used as a test bench. Stories row, feed of carousels, explore grid, activity (finalists), Claudia's own profile; full-screen stories that follow the finger; sheets that slide in and swipe back */
:root{
  --bg:#FFFFFF; --fg:#0A0A0A; --muted:#737373; --line:#DBDBDB; --soft:#EFEFEF; --surface:#FFFFFF;
  --like:#FF3040; --link:#0095F6; --chip:#F2EDE6; --studio:#E7E7E4;
  --ig1:#F9CE34; --ig2:#EE2A7B; --ig3:#6228D7;
  --v-bg:#000000; --v-fg:#FFFFFF; --v-dim:rgba(255,255,255,.35);
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --fg:#F5F5F5; --muted:#A8A8A8; --line:#262626; --soft:#1C1C1C; --surface:#121212; --chip:#2A241E; --studio:#1E1E1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --fg:#F5F5F5; --muted:#A8A8A8; --line:#262626; --soft:#1C1C1C; --surface:#121212; --chip:#2A241E; --studio:#1E1E1E; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(64px + env(safe-area-inset-bottom,0px));
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.lock{overflow:hidden}
[hidden]{display:none!important}
h1,h2,h3,h4,p{margin:0}
img{display:block;max-width:100%;-webkit-user-drag:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{font:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.app{max-width:470px;margin:0 auto}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round;display:block}
[aria-pressed="true"] svg.heart{fill:var(--like);stroke:var(--like);animation:pop .35s var(--ease)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:16px;height:52px}
.logo{font-family:var(--display);font-weight:800;font-variation-settings:"wdth" 112;font-size:23px;letter-spacing:-.01em;flex:1;white-space:nowrap}
.icon-btn{position:relative;width:32px;height:32px;display:grid;place-items:center}
.icon-btn .dot{position:absolute;top:0;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--like);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}

/* Stories row */
.stories{display:flex;gap:14px;overflow-x:auto;padding-block:6px 12px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.stories::-webkit-scrollbar{display:none}
.st{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;width:70px}
.st span{font-size:12px;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{display:block;padding:2.5px;border-radius:50%;background:linear-gradient(45deg,var(--ig1),var(--ig2) 55%,var(--ig3));position:relative;flex:none}
.ring img{width:62px;height:62px;border-radius:50%;object-fit:cover;object-position:50% 28%;border:3px solid var(--bg);background:var(--soft)}
.ring.seen{background:var(--line)}
.ring.fin{background:var(--like)}
.ring .badge{position:absolute;right:-3px;bottom:-1px;min-width:20px;height:20px;border-radius:10px;background:var(--fg);color:var(--bg);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg);font-variant-numeric:tabular-nums}
.ring.sm{padding:2px}
.ring.sm img{width:30px;height:30px;border-width:2px}
.ring.xl img{width:82px;height:82px}
.ring.xs{padding:1.5px}
.ring.xs img{width:22px;height:22px;border-width:1.5px}

/* Feed */
.feed{display:flex;flex-direction:column}
.post{display:flex;flex-direction:column;padding-block:10px 18px;scroll-margin-top:60px;content-visibility:auto;contain-intrinsic-size:auto 720px}
.p-head{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.p-who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25;text-align:left}
.p-who b{font-size:14px}
.p-who span{font-size:12px;color:var(--muted)}
.more{width:32px;height:32px;display:grid;place-items:center}
.car-wrap{position:relative}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:4px;aspect-ratio:4/5;background:var(--studio);overscroll-behavior-x:contain;touch-action:pan-x pan-y}
.car::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;position:relative;overflow:hidden;background:var(--studio)}
.slide img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;pointer-events:none}
.slide.panel img{object-fit:contain}
.ctr{position:absolute;right:10px;top:10px;background:rgba(18,18,18,.7);color:#fff;font-size:12px;font-weight:600;padding:3px 9px;border-radius:12px;font-variant-numeric:tabular-nums;pointer-events:none;transition:opacity .3s}
.tag{position:absolute;left:10px;bottom:10px;background:rgba(18,18,18,.7);color:#fff;font-size:12px;font-weight:600;padding:4px 9px;border-radius:12px;pointer-events:none}
.arrow{position:absolute;top:50%;translate:0 -50%;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.85);color:#111;display:none;place-items:center;font-weight:800;font-size:18px;line-height:1}
.arrow.prev{left:8px}.arrow.next{right:8px}
@media (hover:hover){.car-wrap:hover .arrow{display:grid}}
.burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;z-index:2}
.burst svg{width:100px;height:100px;fill:#fff;stroke:none;filter:drop-shadow(0 2px 10px rgba(0,0,0,.35))}
.burst.go{animation:burst .9s var(--ease)}
@keyframes burst{0%{opacity:0;transform:scale(.3)}20%{opacity:1;transform:scale(1.15)}35%{transform:scale(.95)}50%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
.p-act{display:flex;align-items:center;gap:14px;padding-top:10px;position:relative}
.p-act .grow{flex:1}
.dots{position:absolute;left:50%;translate:-50% 0;display:flex;gap:4px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .2s}
.dots i.on{background:var(--link)}
.likes{font-weight:600;padding-top:8px}
.likes.muted{font-weight:400}
.cap{padding-top:4px}
.cap b{margin-right:5px}
.cap .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap.open .clamp{-webkit-line-clamp:unset}
.cap .moreb{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--chip);padding:3px 9px;border-radius:10px;font-size:12px;font-weight:600}
.saved-note{padding-top:4px}
.saved-note b{margin-right:5px}
.add-note{display:flex;align-items:center;gap:8px;padding-top:8px}
.add-note input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);padding:4px 0;font-size:14px;outline:none}
.add-note input::placeholder{color:var(--muted)}
.add-note button{color:var(--link);font-weight:600}
.when{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding-top:6px}

/* Grids */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:18px 0 8px}
.sec-h h2{font-size:16px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}
.tile{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--soft);touch-action:pan-x pan-y}
.tile img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.tile .lbl{position:absolute;left:5px;bottom:5px;max-width:calc(100% - 10px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(18,18,18,.65);color:#fff;font-size:11px;font-weight:600;padding:2px 7px;border-radius:9px;pointer-events:none}
.tile .mark{position:absolute;top:5px;right:5px;width:22px;height:22px;display:none;place-items:center;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.tile .mark svg{width:20px;height:20px;fill:var(--like);stroke:var(--like)}
.tile.fin .mark{display:grid}
.explore{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:calc((min(100vw - 32px, 470px) - 4px) / 3);grid-auto-flow:dense;gap:2px;padding-top:8px}
.explore .tile{aspect-ratio:auto}
.explore .tile.tall{grid-row:span 2}
.search{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:8px 12px;margin-top:6px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);outline:none}

/* Bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
  padding:0 max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.tabs div{max-width:470px;margin:0 auto;display:flex;justify-content:space-around;height:52px;align-items:center}
.tabs button{width:52px;height:44px;display:grid;place-items:center;position:relative;color:var(--fg)}
.tabs button[aria-current="page"] svg.i{stroke-width:2.6}
.tabs button[aria-current="page"] .ring.xs{background:var(--fg)!important}
.tabs .dot{position:absolute;top:6px;right:12px;width:6px;height:6px;border-radius:50%;background:var(--like)}

/* Sheets slide in from the right and swipe back */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;transform:translateX(100%);transition:transform .28s var(--ease);
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:-8px 0 24px rgba(0,0,0,.08)}
.sheet.in{transform:translateX(0)}
.sheet.drag{transition:none}
.s-in{max-width:470px;margin:0 auto}
.s-top{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:14px;height:50px}
.s-top b{font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-head{display:flex;align-items:center;gap:24px;padding-top:4px}
.pr-stats{flex:1;display:flex;justify-content:space-around;text-align:center}
.pr-stats b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.pr-stats span{font-size:13px}
.pr-bio{padding-top:10px;display:flex;flex-direction:column;gap:2px}
.pr-btns{display:flex;gap:6px;padding-top:12px}
.pr-btns button{flex:1;height:32px;border-radius:8px;font-weight:600;background:var(--soft);display:flex;justify-content:center;align-items:center;gap:6px}
.pr-btns button svg.i{width:16px;height:16px}
.pr-btns button.follow{background:var(--link);color:#fff}
.pr-btns button.follow[aria-pressed="true"]{background:var(--soft);color:var(--fg)}
.pr-tabs{display:flex;border-top:1px solid var(--line);margin-top:14px}
.pr-tabs span{flex:1;display:grid;place-items:center;height:44px;border-top:1px solid var(--fg);margin-top:-1px}
.high{display:flex;gap:16px;overflow-x:auto;padding-block:16px 4px;scrollbar-width:none}
.high::-webkit-scrollbar{display:none}
.hl{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;width:66px;font-size:12px;text-align:center}
.hl i{width:62px;height:62px;border-radius:50%;border:1px solid var(--line);padding:3px;display:block;font-style:normal}
.hl i span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-family:var(--display);font-weight:800;font-size:20px;overflow:hidden}
.hl i img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 25%}
.detail{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.detail h3{font-size:19px;line-height:1.25;font-family:var(--display);font-weight:800}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card h4{font-size:14px}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.copy{white-space:pre-line}
.tagsline{font-size:13px;color:var(--link)}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:6px;padding-block:8px;border-top:1px solid var(--line)}
.vrow b{min-width:0;overflow:hidden;text-overflow:ellipsis}
.pill{height:30px;padding:0 12px;border-radius:8px;background:var(--soft);font-weight:600;font-size:13px;display:flex;align-items:center;gap:5px}
.pill svg.i{width:15px;height:15px}
.pill.on{background:var(--fg);color:var(--bg)}
.vrow [data-voice]{width:36px;height:36px;display:grid;place-items:center}

/* Activity (finalists) */
.act{display:flex;align-items:center;gap:12px;padding-block:9px;width:100%;text-align:left}
.act div{flex:1;min-width:0}
.act p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act img.th{width:44px;height:44px;object-fit:cover;object-position:50% 25%;border-radius:4px}
.cmp-open{width:100%;height:36px;margin-top:12px;border-radius:8px;background:var(--link);color:#fff;font-weight:600}
.empty{padding:36px 0;color:var(--muted);text-align:center}
.seg{display:flex;gap:6px;overflow-x:auto;padding-block:4px 12px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;height:32px;padding:0 12px;border-radius:8px;background:var(--soft);font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.cmp{display:grid;grid-auto-flow:column;grid-auto-columns:var(--w,50%);gap:4px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.cmp::-webkit-scrollbar{display:none}
.cmp figure{margin:0;scroll-snap-align:start;display:flex;flex-direction:column;gap:5px;min-width:0}
.cmp figure button{display:block;border-radius:4px;overflow:hidden;background:var(--studio);aspect-ratio:3/5;width:100%;touch-action:pan-x pan-y}
.cmp img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.cmp figcaption{font-size:13px;font-weight:600;line-height:1.2}
.cmp-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px}
.cmp-nav button{height:32px;padding:0 14px;border-radius:8px;background:var(--soft);font-weight:600}

/* Story viewer */
.viewer{position:fixed;inset:0;z-index:50;background:var(--v-bg);color:var(--v-fg);display:flex;justify-content:center;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none;transition:background-color .2s,opacity .22s}
.v-stage{position:relative;width:100%;max-width:min(100vw,calc(100dvh * 9 / 16));height:100%;overflow:hidden;background:var(--v-bg);
  transition:transform .26s var(--ease),opacity .22s;will-change:transform}
@media (min-width:600px){.v-stage{height:calc(100% - 40px);border-radius:10px}}
.viewer.enter{opacity:0}
.viewer.enter .v-stage{transform:scale(.9)}
.viewer.drag .v-stage{transition:none}
.v-bg{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);max-width:none;object-fit:cover;filter:blur(26px) brightness(.55);pointer-events:none}
.v-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.v-top{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 26px;background:linear-gradient(rgba(0,0,0,.45),transparent);z-index:3;transition:opacity .15s}
.v-bars{display:flex;gap:2px}
.v-bars i{flex:1;height:2px;border-radius:2px;background:var(--v-dim);overflow:hidden}
.v-bars i b{display:block;height:100%;width:0;background:var(--v-fg)}
.v-head{display:flex;align-items:center;gap:8px;margin-top:10px;padding-left:4px}
.v-head img{width:32px;height:32px;border-radius:50%;object-fit:cover;object-position:50% 28%}
.v-head div{flex:1;min-width:0;line-height:1.2}
.v-head b{font-size:14px;font-weight:600}
.v-head b small{font-weight:400;opacity:.7;margin-left:6px;font-size:13px}
.v-head span{display:block;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-head button{width:40px;height:40px;display:grid;place-items:center;color:var(--v-fg)}
.v-cap{position:absolute;left:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:3;background:rgba(0,0,0,.45);padding:5px 10px;border-radius:14px;font-size:13px;font-weight:600;pointer-events:none;transition:opacity .15s}
.v-foot{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;gap:12px;align-items:center;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.5));transition:opacity .15s}
.v-foot input{flex:1;min-width:0;background:transparent;border:1px solid rgba(255,255,255,.55);color:var(--v-fg);border-radius:22px;padding:10px 16px;font-size:14px;outline:none}
.v-foot input::placeholder{color:rgba(255,255,255,.8)}
.v-foot button{color:var(--v-fg);width:36px;height:40px;display:grid;place-items:center}
.v-foot button svg.i{width:27px;height:27px}
#v-send{width:auto;font-weight:700;font-size:15px}
.v-hold .v-top,.v-hold .v-foot,.v-hold .v-cap{opacity:0}
.v-burst{z-index:4}

/* Pinch in place */
.pz-shade{position:fixed;inset:0;z-index:89;background:var(--v-bg);opacity:0;pointer-events:none}

.toast{position:fixed;left:50%;translate:-50% 0;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:60;background:rgba(38,38,38,.95);color:#fff;font-size:13px;font-weight:600;padding:9px 15px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:translateY(6px);max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateY(0)}

.print-only{display:none}
@media print{
  @page{size:A4 landscape;margin:9mm}
  body{padding:0;background:#fff;color:#0A0A0A}
  body::before,.app,.tabs,.viewer,.sheet,.toast{display:none!important}
  .print-only{display:block;font-family:var(--ui)}
  .pp{break-inside:avoid;margin-bottom:6mm}
  .pp h2{font-family:var(--display);font-size:16px;margin:0 0 2mm}
  .pp .row{display:grid;grid-template-columns:repeat(8,1fr);gap:2mm}
  .pp img{width:100%;aspect-ratio:3/5;object-fit:cover;object-position:50% 30%}
  .pp p{font-size:10px;color:#556}
  .ph{font-family:var(--display);font-size:30px;font-weight:900;margin-bottom:4mm}
  .pposts{columns:2;column-gap:8mm;font-size:10.5px}
  .pposts div{break-inside:avoid;margin-bottom:4mm}
}
@media (prefers-reduced-motion:reduce){.sheet,.v-stage,.toast,.viewer{transition:none}.burst.go,[aria-pressed="true"] svg.heart{animation:none}}
</style>

<div class="app">
  <header class="top">
    <span class="logo">Casting Claudia</span>
    <button type="button" class="icon-btn" id="top-heart" aria-label="Ver finalistas">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.4-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.8-7.5 10.2-7.5 10.2z"/></svg>
      <span class="dot" id="top-n" hidden>0</span>
    </button>
  </header>

  <main>
    <section id="tab-feed" aria-label="Inicio">
      <div class="stories" id="stories" aria-label="Historias"></div>
      <div class="feed" id="feed"></div>

<script id="persona-data" type="application/json">{"resumen": {"frase": "Te enseña casas que todavía no existen.", "chips": ["26 años", "Miami → Barcelona", "Vive en Poblenou", "Arquitectura de interiores", "Presentadora de obra nueva", "ES · EN · una mica de català", "Presentadora IA de Vitruvi Studio"]}, "historia": ["Nació en Miami el 21 de marzo de 2000 y creció en Coral Gables, en una casa de los años cincuenta que su padre, ingeniero de estructuras de Barcelona, nunca terminó de reformar. Madre enfermera, cubanoamericana. En casa, español con dos acentos; en el colegio, inglés; en verano, Sitges con la iaia.", "Estudió Arquitectura de Interiores en Miami. En tercero hizo prácticas en la sales gallery de una torre en construcción en Brickell: vio firmar a compradores mirando un render y una cocina de muestra. Allí aprendió que una casa se vende antes de existir y que hay que decir «esto es una infografía» en voz alta.", "A los 22 vino a Barcelona «por un año»: la ciudad de su padre y un máster en visualización arquitectónica. Encontró un barrio con grúas y playa, una compañera de piso arquitecta y un trabajo donde el render era el principio de la historia. Se quedó.", "Dos años de junior en un estudio de interiorismo y 3D de Poblenou, primeros vídeos de pisos piloto en 2025 y, en 2026, Vitruvi Studio la convierte en su presentadora. Esta parte es literalmente verdad: Claudia es una presentadora IA, y su historia es un guion que ella misma cuenta como tal."], "vida": [{"titulo": "Dónde vive", "texto": "Poblenou, Barcelona, desde 2022. Segundo piso en una fábrica rehabilitada a dos calles de la Rambla: techos altos, vigas blancas, balcón a un patio con limonero. Ventana del salón al este. «El barrio con más grúas de la ciudad, y me encanta.»"}, {"titulo": "Su mapa", "texto": "Flat white en la Rambla del Poblenou. Mercat del Poblenou los sábados. Vermut en Marià Aguiló los domingos. Carrera por el Passeig Marítim, 10 km. Playa del Bogatell a ocho minutos. Metro L4, Bicing para todo. Tren R2 a Sitges."}, {"titulo": "Rutina de diario", "texto": "7:00 foto de la luz en la ventana. 7:30 carrera o pilates. 8:45 café y mensajes. Mañana de piso piloto, obra con casco o rodaje con renders. Menú del día a las 14:00. Tarde de guiones. Playa a las 19:00. Cena tarde, a la española."}, {"titulo": "Por qué sabe de casas", "texto": "Lee planos, explica útil frente a construido, orientación y alturas. Conoce la venta sobre plano desde Brickell y desde un estudio de Poblenou. Entiende el render desde dentro. No es abogada ni banco: señala la pregunta y a quién hacérsela."}, {"titulo": "Familia", "texto": "Marisol, madre enfermera en Miami, audios en spanglish. Jordi, padre ingeniero de Barcelona, le enseñó a leer un plano antes que a conducir. Dani, hermano de 22. Iaia Montse, 81, en Sitges. Existen en el relato: voz, manos y mensajes, nunca caras generadas."}, {"titulo": "Amigos y gata", "texto": "Júlia, 28, compañera de piso y arquitecta: la voz de «el plano dice una cosa y la obra otra». Marco, artista 3D italiano del máster, «mi traductor de render». Brickell, gata gris adoptada en 2024, duerme sobre los planos y sale en stories."}, {"titulo": "Comida", "texto": "Café con leche cubano de su madre y cortado de Barcelona: ganan los dos. Croquetas, pa amb tomàquet, arroz con pollo, ceviche. Calçots con babero desde 2023. Fideuà antes que paella, y lo defiende. Vermut con aceitunas; poco alcohol más allá."}, {"titulo": "Música y cultura", "texto": "Reggaeton para correr, Rosalía y Bad Gyal como banda sonora de Barcelona, bossa para editar, Manel en el coche de su padre. Zumthor en la mesa, thrillers en el Kindle, acuarelas de fachadas los domingos. Películas con casa protagonista: «Parásitos», «Her»."}, {"titulo": "Marcas, a nivel creíble", "texto": "Blazers de Massimo Dutti y Zara, básicos de Mango, bikinis de Oysho, Veja y New Balance, Ray-Ban Wayfarer, un bolso de Bimba y Lola, iPhone y Kindle. Nada de lujo ostentoso: la casa es la aspiración, el armario es alcanzable."}, {"titulo": "Deporte", "texto": "Correr tres veces por semana por el mar, pilates reformer dos, paddle surf en verano y beach volley en el Bogatell con las amigas de Júlia. Jugó al voleibol en el instituto en Miami. Mide las habitaciones a pasos."}, {"titulo": "Viajes", "texto": "Miami dos veces al año: Navidad y una semana en junio, la «Miami week». Sitges casi cada domingo. Menorca en agosto con Júlia. Lisboa, Milán por el Salone, Costa del Sol para rodajes. En la lista: Copenhague, Ciudad de México, Tokio."}], "voz": {"tono": "Cálida, directa y curiosa: la amiga que ya ha estado dentro. Explica lo que se siente antes que lo que mide. Frases cortas, dos o tres ideas por reel, unas 150 palabras por minuto. Pausa de casi un segundo antes del dato y una sola palabra subrayada por pieza. Español de España, de tú; se le escapa el inglés cuando se emociona y una frase en catalán de iaia cuando pega. Habla como quien enseña una casa a una amiga: sitúa, señala, da el dato y sigue. Sin eslóganes y sin jugar con ser IA: lo dice una vez, con naturalidad, y vuelve a la casa.", "frases_es": ["¿Pasamos?", "Esta casa todavía no existe, pero te la voy a presentar igual.", "Estamos en [barrio], a [diez] minutos del metro. Esta es la entrada.", "Mira qué luz entra a esta hora. Son las nueve y da al este.", "Fíjate en esto, que casi nadie lo mira: la flecha del norte en el plano.", "Aquí ya te veo desayunando, en serio.", "Son [14] metros de terraza. Caben una mesa de seis y una tumbona.", "Lo que ves es una infografía. Los metros y la orientación son los del proyecto.", "Esto lo confirma la promotora. Lo que no, te digo a quién preguntárselo.", "Vale, esta es la parte que más me gusta.", "Okay, wait. Mira el techo: casi tres metros.", "Se entrega en [2028]. El resto de datos, en el texto.", "Guárdalo y enséñaselo a quien esté buscando casa.", "Som-hi, que te enseño la cocina."], "frases_en": ["Shall we?", "This house doesn't exist yet, but I'll show you around anyway.", "We're in [neighbourhood], [ten] minutes from the metro. This is the front door.", "Look at the light at this hour. Nine in the morning, east-facing.", "Okay, this is the part I love.", "[14] square metres of terrace. A table for six fits, and a lounger.", "What you're seeing is a render. The metres and the orientation are the project's.", "Delivery in [2028]. The rest is in the caption.", "Save it for someone who's house hunting."], "gestos": ["Entra sonriendo y mira a la lente desde el primer fotograma; abre la palma con la primera palabra.", "Abre la puerta con la mano lejana, se aparta hacia las bisagras y barre la palma hacia dentro: «¿Pasamos?».", "Señala con la palma, mira el elemento medio segundo y vuelve a la lente (Monica Church).", "Mide en el aire con las dos manos al decir los metros, siempre con el dato en pantalla (cuenta de Katrina Barrett).", "Manos abiertas, una a cada lado, y pausa al contrastar «confirmado / pendiente» o «lo que entra en el precio / lo que no» (Maribel Martínez).", "Palmas juntas, pausa y una palabra clave, solo para el dato importante del reel (Dina Goldentayer).", "Mano plana que desliza de izquierda a derecha cuando la imagen pasa de render a obra.", "Enmarca la vista con las manos y calla un segundo; la cámara sigue su mirada.", "Después de un dato, casi un segundo de silencio y un asentimiento con sonrisa.", "Cierra con la palma del pecho hacia la cámara. Entre gestos, manos en calma a la altura del ombligo.", "Mirada: a cámara para la pregunta, al objeto para el dato, a cámara para la condición.", "Nunca tapa el render, nunca señala con el dedo, nunca se toca el pelo, nunca cámara lenta."], "nunca": ["Fingir que es real o dejarlo en duda. La etiqueta de IA va siempre.", "Imitar la cara, la voz o el nombre de una persona real. Ni generar caras de su familia.", "Dar precios, plazos o calidades sin confirmación escrita de la promotora.", "Asesorar sobre hipotecas, contratos o impuestos. Opinar de política de vivienda.", "Contenido sexualizado: ángulos bajos, zooms al cuerpo, lencería. El bikini es de villa, no de revista.", "Dramas inventados, pedir likes o comentarios, hablar mal de nadie.", "Hashtags en @vitruvistudio, imágenes gratis, Vitruvi Lab, showroom, clientes no nombrables.", "Copiar un vídeo plano a plano: se copia el formato, nunca la pieza.", "Publicar de noche o programar y anunciar sin el OK de Stefano."]}, "copies": {"reglas": ["Primera línea: gancho de menos de 125 caracteres con una palabra clave real (obra nueva, render, piso piloto, Barcelona, Miami).", "De 300 a 600 caracteres en español: dos a cuatro líneas cortas, un solo dato y confirmado.", "CTA: guardar, enviar a quien busca casa o seguir para la próxima casa. Nunca «comenta abajo» ni «dale like».", "Sótano fijo: «Presentadora IA de @vitruvistudio» (+ «Infografías no contractuales» si hay render) y la línea para quien promueve o comercializa obra nueva. En colaboración, «Colaboración pagada con @promotora».", "Bilingüe en el mismo copy: español primero y un bloque corto en inglés. Una cuenta, un tono; el español es el mercado y el inglés abre compradores internacionales y Miami.", "Español de España, de tú, nunca vosotros. Sin rayas largas. Euros. Un giro en inglés como máximo; un catalanismo si pega. Dos emojis como mucho, nunca en la primera línea.", "Hashtags: de 5 a 8 en la cuenta de Claudia (nicho, lugar, formato, #vitruvistudio, #creadaconia). Ninguno en @vitruvistudio.", "Comparativas: primero la imagen de Vitruvi, después «cómo se suele presentar». Deseo y lo que siente el comprador, nunca «mejorar renders».", "Clientes solo nombrables. Lo propio, «Así presentaríamos tu promoción», sin decir que es ficticio."], "ejemplo_es": "Esta terraza todavía no existe, pero te la enseño igual.\nOeste, 14 m², y a las 20:00 de julio el sol cae justo aquí, en la mesa. Es una infografía de obra nueva en Barcelona; metros y orientación son los del proyecto.\nGuárdalo y enséñaselo a quien busque casa.\nPresentadora IA de @vitruvistudio. Infografías no contractuales.\n¿Promueves o comercializas obra nueva? Escríbeles.", "ejemplo_en": "This terrace doesn't exist yet, but I'll show you around anyway.\nWest-facing, 14 m², and at 8 pm in July the sun lands right here, on the table. What you see is a render; the metres and the orientation are the project's.\nAI presenter by @vitruvistudio. Renders are not contractual."}, "calendario": [{"dia": "Lunes", "que": "10:00 Reel «¿Pasamos?»: recorrido por una casa que no existe. Stories: «La luz de hoy» y encuesta esto o esto."}, {"dia": "Martes", "que": "10:00 Carrusel «Aprende a mirar»: luz, orientación, planos, qué incluye un precio. Stories: detrás del render, pantalla del equipo."}, {"dia": "Miércoles", "que": "10:00 Reel «Render vs obra» o «¿Cuánto cuesta?». Stories: caja de preguntas por la tarde."}, {"dia": "Jueves", "que": "10:00 Reel Miami ↔ Barcelona o formato de tendencia. Stories: barrio, grúas, vermut, Bogatell."}, {"dia": "Viernes", "que": "Foto o carrusel de vida: villa, piscina, calle. Stories: plan de finde y boceto."}, {"dia": "Sábado", "que": "Nada en feed. Stories: mercado, playa, una obra por gusto."}, {"dia": "Domingo", "que": "Nada en feed. Stories: boceto del domingo, Sitges con la iaia, «mañana toca». Horas del slot de Metricool; nunca de noche."}], "stories": ["La luz de hoy: misma ventana a las 7:30, texto con hora y orientación. Diario.", "¿Render o foto?: dos imágenes y quiz; la respuesta desvela el detalle que delata. Semanal.", "Pregúntame sobre obra nueva: caja de preguntas, respuesta en vídeo desde el sofá. Sin asesoría legal ni financiera. Semanal.", "Detrás del render: pantalla del equipo de Vitruvi, wireframe, luz, final. El embudo más suave. Semanal.", "Visita de obra: casco, polvo, pies. «Esto será la cocina» con el render encima. Quincenal.", "Esto o esto: encuesta de cocina abierta o cerrada, isla o península, bañera o ducha. Semanal.", "Boceto del domingo: acuarela de una fachada en time-lapse. Semanal.", "Miami week: cuenta atrás, aeropuerto, café cubano, Brickell y comparativas rápidas. Dos veces al año.", "Soy IA, pregunta: una tarde al mes solo sobre ser IA. La transparencia como contenido.", "Colaboración: visita a la promoción del cliente con «Colaboración pagada» en cada pantalla."], "inspiraciones": [{"nombre": "Monica Church · Seattle", "por_que": "La única del estudio con vídeo que prueba gestos con función: señala el edificio a los 2 segundos, alterna la mirada entre cámara y objeto y ordena la explicación por lugares. Conecta contenido general con un servicio local sin vender a gritos.", "tecnica": "Apertura «sitúa y señala». Gesto: palma al elemento, mirada medio segundo y vuelta a la lente. Estructura: lugar o pregunta > elemento visible > dato > siguiente apartado. Tono de guía, no de vendedora."}, {"nombre": "Maribel Martínez · Barcelona", "por_que": "Arquitecta técnica y nº1 de facturación de iad. En vídeo abre las manos y hace una pausa antes de separar lo que hace ella de lo que debe verificar otro profesional. Es la credibilidad local y técnica.", "tecnica": "Manos abiertas al contrastar dos cosas y casi un segundo de silencio antes del límite. Estructura «confirmado / pendiente / quién lo verifica». De aquí salen «solo datos de la promotora» y «no soy abogada ni banco»."}, {"nombre": "Shelby Church · YouTube", "por_que": "Convierte una curiosidad en explicación: objeción, comprobación, alternativas y conclusión con condición. Explica qué incluye un precio y qué cambia al vivir dentro, con alcance reciente probado (placas solares, octubre de 2026).", "tecnica": "Abrir por una duda que el espectador ya tiene («¿se parecerá al render?», «¿qué incluye el precio?»). Estructura para «render vs obra» y «¿cuánto cuesta?». Tono de compañera curiosa que admite lo que no puede comprobar."}, {"nombre": "Dina Goldentayer · Miami Beach", "por_que": "La marca de Miami: territorio definido, un argumento de valor repetido y una escena reconocible. En entrevista pausa, junta las palmas y subraya una sola palabra, «valor del suelo». El argumento se sostiene sin el avión ni los titulares.", "tecnica": "Palmas juntas + pausa + una palabra clave, solo para el dato importante de cada reel. Elementos de marca repetidos: la puerta, «¿Pasamos?», el rótulo de IA, la paleta camel y blanco. Puente de contenido con Miami."}, {"nombre": "Cuenta de Katrina Barrett · Arizona", "por_que": "Visitas de 50-60 segundos que abren con precio y ciudad, contrastan tres zonas de estar y enseñan la altura levantando un brazo. El estudio atribuye el estilo a su cuenta, no a ella en persona; el recurso sirve igual.", "tecnica": "Precio o ciudad más una necesidad en el primer segundo. Gesto «medida en el aire» siempre con el dato en pantalla: para una IA, enseñar la medida es más honesto que actuar. Estructura: precio > característica > demostración > pregunta."}], "posts": [{"n": 1, "formato": "Reel", "gancho": "«Esta casa todavía no existe, pero te la voy a presentar igual. ¿Pasamos?» Claudia en la puerta de la villa, mano en la puerta.", "idea": "La presentación, como una visita normal. Cuatro planos de la casa que no existe (puerta, salón, terraza, cocina), un dato por plano y quién es Claudia en una frase. Rótulo de IA desde el segundo 1; en voz, lo dice una vez.", "plano": ["Puerta: gesto de invitar. «Esta casa todavía no existe, pero te la voy a presentar igual. ¿Pasamos?»", "Salón: palma al ventanal. «Mira qué luz entra a esta hora. Da al este, son las nueve. Lo que ves es una infografía; los metros son los del proyecto»", "Terraza: enmarca la vista. «Soy Claudia. Veintiséis, de Miami, vivo en Poblenou»", "Cocina: toca el material. «Enseño obra nueva antes de que exista. Soy la presentadora IA de Vitruvi; las promociones son reales»"], "copy_es": "Esta casa todavía no existe, pero te la voy a presentar igual.\nSoy Claudia. 26 años, de Miami, vivo en Poblenou. Enseño obra nueva antes de la primera piedra: dónde da el sol, los metros de la terraza y cuándo se entrega.\nPresentadora IA de @vitruvistudio. Las promociones son reales.\nSígueme para la siguiente; hay una cada lunes.\n¿Vendes obra nueva? Escríbeles.", "copy_en": "This house doesn't exist yet, but I'll show you around anyway.\nI'm Claudia, 26, Miami-born, living in Poblenou. I show new-build homes before the first brick: where the sun lands, how big the terrace is, when it's delivered. AI presenter by @vitruvistudio. The developments are real.", "cta": "Sígueme para la siguiente; hay una cada lunes.", "hashtags": ["#obranueva", "#creadaconia", "#barcelona", "#miami", "#casasquenoexisten", "#presentadoravirtual", "#vitruvistudio"], "por_que_viral": "Abre como una visita de verdad y la novedad (primera presentadora IA de obra nueva en España) la aporta el rótulo, no la frase: eso genera debate y compartidos sin parecer un truco. El formato «¿Pasamos?» ya está probado en el reel de 27 s.", "imagenes": ["puerta villa", "look presentadora", "salón render", "terraza render", "cocina render"]}, {"n": 2, "formato": "Reel", "gancho": "Pantalla partida, render y obra terminada con el mismo encuadre. Claudia delante: «La pregunta que más me hacen: ¿luego se parece al render? Mira. Hace [14] meses, esto. Hoy, esto».", "idea": "Tres parejas render > real (fachada, salón, terraza). Claudia camina por el espacio real o el piso piloto y «desliza» del render a la obra. Cierra con lo que ninguna imagen sabe: el ruido de la calle, el olor a pintura, la fecha real de entrega.", "plano": ["Pareja fachada, gesto de deslizar: «Hace [14] meses, infografía. Hoy, la obra entregada. Misma esquina, misma hora»", "Pareja salón, Claudia entra en el real: «Fíjate en la ventana: la misma. Lo que cambia es el sofá, que lo pone cada uno»", "Pareja terraza, enmarca la vista: «La terraza, al oeste. El sol cae donde decía el render porque estaba calculado para esta orientación»", "A cámara, manos abiertas: «Hay una cosa que el render no podía saber: [dato real]. Eso se comprueba en la visita»", "Cierre con rótulo de IA e infografía no contractual"], "copy_es": "La pregunta que más me hacen: ¿luego se parece al render?\nHace [14] meses era una infografía. Hoy tiene llaves. Misma fachada, mismo salón, misma hora de sol.\nLo que ninguna imagen sabe (el ruido de la calle, la fecha real de entrega) se pregunta en la visita.\nGuárdalo si vas a comprar sobre plano.\nPresentadora IA de @vitruvistudio. Infografías no contractuales.", "copy_en": "The question I get most: does it end up looking like the render? [14] months ago this was a render; today it has keys. Same facade, same living room, same terrace, same hour of sun. What no image shows, you check on the visit. AI presenter by @vitruvistudio.", "cta": "Guárdalo si vas a comprar sobre plano.", "hashtags": ["#rendervsreal", "#obranueva", "#antesydespues", "#visualizacionarquitectonica", "#barcelona", "#renders", "#vitruvistudio"], "por_que_viral": "El antes y después es el formato con más retención del sector y responde a la pregunta de todo comprador sobre plano: ¿se parecerá? Satisfacción visual y utilidad en la misma pieza. Primero la imagen de Vitruvi, después la obra.", "imagenes": ["render Vitruvi y foto de obra entregada, mismo encuadre", "Claudia con casco", "look presentadora en salón real", "piso piloto"]}, {"n": 3, "formato": "Reel", "gancho": "Claudia baja una persiana hasta dejar la habitación a oscuras a mediodía: «Son las doce y mira: a oscuras. En Miami no tenemos esto y mi madre sigue sin creérselo».", "idea": "Cinco cosas de Barcelona (persianas, tendedero, cocina con puerta, sin garaje, techos de tres metros) contadas desde su casa, y el giro: una cosa de Miami que copiaría ya, enseñar la casa con maqueta y renders antes del primer pilar. «Eso aquí ya lo hace Vitruvi.»", "plano": ["Persiana bajando: «Son las doce y mira: a oscuras. En Miami no tenemos esto»", "Terraza con tendedero y balcón del Eixample: «La ropa se seca fuera. En Coral Gables, secadora o nada»", "Cocina cerrada frente a cocina abierta de Miami: «Cocina con puerta. Mi madre la defiende; yo ya me he pasado a la abierta»", "Calle de Barcelona sin garaje frente a torre de Brickell: «Aquí se vive sin coche. En Brickell el garaje ocupa las tres primeras plantas»", "Giro: sales gallery con maqueta, palmas juntas: «Y una cosa de Miami que copiaría ya: te enseñan la casa con maqueta y render antes de poner un pilar. Eso aquí lo hace Vitruvi»", "Cierre en la puerta de la villa: «El lunes te enseño una de obra nueva. ¿Pasamos?»"], "copy_es": "Son las doce y mira: a oscuras. En Miami no tenemos persianas y mi madre sigue sin creérselo.\nCosas de Barcelona: persiana, tendedero en la terraza, cocina con puerta. Y una de Miami que copiaría ya: enseñar la casa con maqueta y render antes del primer pilar. Aquí eso ya lo hace @vitruvistudio.\nEnvíaselo a quien vive entre dos ciudades.\nPresentadora IA de @vitruvistudio.", "copy_en": "It's noon and the room is dark. Miami has no shutters and my mother still doesn't believe it. Barcelona things: shutters, laundry on the terrace, kitchens with doors. And one Miami thing worth copying: showing the home with a model and renders before the first column goes up. Send it to someone living between two cities.", "cta": "Envíaselo a quien vive entre dos ciudades.", "hashtags": ["#miamivsbarcelona", "#barcelona", "#miami", "#obranueva", "#casas", "#expatlife", "#vitruvistudio"], "por_que_viral": "El contenido de identidad y comparación lo comparten los dos públicos: expats, catalanes en Miami, americanos en Barcelona. Las persianas son humor viral recurrente y la pieza lo lleva sin forzar a la venta sobre plano.", "imagenes": ["look calle en balcón de Barcelona", "calle Eixample", "playa Bogatell", "Miami: Brickell desde el coche, palmeras, fachada blanca", "sales gallery recreada con render"]}, {"n": 4, "formato": "Reel", "gancho": "Claudia en la puerta, a cámara: «Antes de que te enamores de la cocina, tres números. El precio es el tercero».", "idea": "Tres números, uno por plano (metros útiles, terraza y orientación, precio confirmado por la promotora), y el giro útil: lo que no está en la cifra (IVA del 10 %, impuesto autonómico, notaría y registro). «Pregúntalo antes de reservar.»", "plano": ["Puerta: gancho", "Salón, medida en el aire con los m² en pantalla: «Primero: [92] metros útiles. Útiles, no construidos»", "Terraza al sur, mirada a la vista: «Segundo: [12] metros de terraza al sur. Sol desde media mañana; pide toldo»", "Piscina y garaje: texto en pantalla, sin voz", "A cámara, pausa, palmas juntas: «Tercero. Desde [X] €, confirmado por la promotora»", "Manos abiertas: «Lo que no está en esa cifra: el 10 % de IVA de obra nueva, el impuesto de tu comunidad, notaría y registro. Pregúntalo antes de reservar»"], "copy_es": "Antes de enamorarte de la cocina, tres números. El precio es el tercero.\n[92] m² útiles, terraza de [12] m² al sur y garaje. Desde [X] €, confirmado por la promotora.\nLo que no entra en esa cifra: 10 % de IVA, impuesto autonómico, notaría y registro. Pregúntalo antes de reservar.\nGuárdalo para la visita.\nPresentadora IA de @vitruvistudio. Precio orientativo. Infografías no contractuales.", "copy_en": "Before you fall for the kitchen, three numbers. The price is the third. [92] m² usable, a [12] m² south-facing terrace and parking. From €[X], confirmed by the developer. Not in that figure: 10 % VAT on new builds, regional tax, notary and registry. Ask before you reserve.", "cta": "Guárdalo para la visita.", "hashtags": ["#cuantocuesta", "#obranueva", "#comprarcasa", "#pisopiloto", "#barcelona", "#renders", "#vitruvistudio"], "por_que_viral": "Anunciar tres números y dejar el precio para el final retiene sin recurrir a «adivina»: la gente se queda a comprobar la cifra. Los costes que no están en el precio convierten curiosidad en guardados. Solo con precio confirmado por escrito.", "imagenes": ["render ático o villa: salón, terraza, piscina", "look presentadora", "puerta villa"]}, {"n": 5, "formato": "Carrusel", "gancho": "Lámina 1: Claudia señala con la palma la flecha del norte en un plano: «Lo primero que miro en un plano no son los metros. Es esta flecha». Subtítulo: «La del norte. Te explico por qué».", "idea": "Educativo y guardable: las cuatro orientaciones explicadas con la vida dentro (a qué hora entra el sol y qué haces con él) y cómo leer un render honesto, que lleva hora y mes. Nueve láminas en 3:4, textos de ocho palabras o menos.", "plano": ["1 Gancho", "2 Plano con brújula: «Busca la flecha del norte. Todo lo demás sale de ahí»", "3 Este: «Sol de 8 a 12. Desayunos con luz»", "4 Oeste: «Sol de 16 a 21. Tardes largas en la terraza»", "5 Sur: «Sol casi todo el día. Pide toldo»", "6 Norte: «Luz pareja, sin sol directo. Para trabajar»", "7 «Un render honesto lleva hora y mes. Pregunta cuáles»", "8 «Si entra sol por todas las ventanas a la vez, pregunta»", "9 Claudia: «Guárdalo para el piso piloto» + línea de Vitruvi"], "copy_es": "Lo primero que miro en un plano no son los metros. Es la flecha del norte.\nEste: desayunos con luz. Oeste: tardes largas en la terraza. Sur: sol casi todo el día, pide toldo. Norte: luz pareja, para trabajar.\nUn render honesto lleva hora y mes. Si entra sol por todas partes, pregunta.\nGuárdalo para el piso piloto.\nPresentadora IA de @vitruvistudio.", "copy_en": "The first thing I check on a floor plan isn't the square metres. It's the north arrow. East: morning sun. West: long terrace evenings. South: sun most of the day, you'll want shade. North: even light for work. An honest render shows time and month.", "cta": "Guárdalo para el piso piloto.", "hashtags": ["#obranueva", "#orientacion", "#comprarsobreplano", "#luznatural", "#planos", "#interiorismo", "#vitruvistudio"], "por_que_viral": "Los carruseles educativos simples son los más guardados y Instagram los reparte durante semanas. Lo entiende cualquier edad y posiciona a Vitruvi en lo suyo: la luz real. Versión PDF para el LinkedIn de Stefano.", "imagenes": ["look presentadora en salón render (láminas 1 y 9)", "misma estancia a cuatro horas distintas", "plano con brújula"]}, {"n": 6, "formato": "Reel", "gancho": "Claudia en el borde de la piscina infinita, bikini arena y camisa de lino abierta, mete un pie en el agua: «Esta piscina se entrega en [2028]. Yo me he adelantado un poco».", "idea": "La pieza que para el scroll, con el giro de Vitruvi: la imagen se deshace en wireframe y vuelve. Presenta la piscina con la palma como presentaría un salón, con medida, orientación y la hora de la sombra. Cámara a la altura de los ojos, sin zooms. Cierra sentada con los pies en el agua: «Yo ya sé dónde me voy a sentar en julio».", "plano": ["Borde de la piscina: gancho", "Palma presentadora hacia la piscina y el mar: «[12] metros, al sur, y a las seis la sombra del olivo llega justo a las tumbonas»", "Transición a wireframe y vuelta al render: «Lo que ves es una infografía de Vitruvi. El sol es el de esta orientación en julio»", "Sentada en el borde, pies en el agua, pausa con sonrisa: «Yo ya sé dónde me voy a sentar en julio»", "Cierre con texto: «Entrega [2028]»"], "copy_es": "Esta piscina se entrega en [2028]. Yo me he adelantado un poco.\n[12] metros, al sur, y a las seis la sombra del olivo llega justo a las tumbonas. Lo que ves es una infografía de @vitruvistudio con el sol de esta orientación en julio.\nGuárdala para cuando vuelva el calor.\nPresentadora IA de @vitruvistudio. Infografías no contractuales.\n¿Vendes obra nueva? Escríbeles.", "copy_en": "This pool is delivered in [2028]. I got here a little early. [12] metres, south-facing, and at six the olive tree's shade reaches the loungers. What you see is a render by @vitruvistudio with July sun for this orientation. Save it for when the heat comes back.", "cta": "Guárdala para cuando vuelva el calor.", "hashtags": ["#piscina", "#villa", "#obranueva", "#render", "#mediterraneo", "#creadaconia", "#vitruvistudio"], "por_que_viral": "Piscina, atardecer y presentadora son la combinación con más retención visual; el giro a wireframe la convierte en pieza de marca y evita que sea solo un cuerpo en bikini. Es la que más perfiles nuevos trae. Siempre el look elegante.", "imagenes": ["villa piscina, bikini elegante con camisa de lino", "wireframe del render", "atardecer en la villa"]}, {"n": 7, "formato": "Carrusel (desde @vitruvistudio, en colaboración con Claudia)", "gancho": "Lámina 1: Claudia en look presentadora, manos abiertas: «Tu comprador firma sobre plano mirando una imagen. Hablemos de esa imagen».", "idea": "La pieza para promotoras y comercializadoras: deseo, no técnica. Qué ve el comprador antes de firmar y qué le hace verse viviendo ahí: el sol de su orientación a la hora en que llega a casa, la mesa puesta y alguien que abre la puerta. Se publica desde Vitruvi sin hashtags y como PDF en el LinkedIn de Stefano.", "plano": ["1 Gancho", "2 «Decide con lo que ve. Y lo que ve tiene que parecerse a su vida»", "3 Pareja exterior: «La misma fachada a las 12 y a las 21. Una informa; la otra se recuerda»", "4 «El sol de su orientación, a la hora en que llega a casa»", "5 Pareja salón vacío y salón con cena: «El salón vacío y el salón con la cena puesta. El segundo se reenvía»", "6 Claudia en la puerta: «Alguien que abre la puerta y lo acompaña»", "7 «27 segundos de vídeo frente a 30 fotos»", "8 «Infografía no contractual y etiqueta de IA a la vista. Lo que se dice claro, se cree»", "9 «¿Promueves, comercializas o tienes que presentar un proyecto? Escríbenos»"], "copy_es": "Tu comprador firma sobre plano mirando una imagen. Hablemos de esa imagen.\nEl sol de su orientación cuando llega a casa, la mesa puesta y alguien que abre la puerta. Así una infografía se parece a una visita.\n¿Promueves, comercializas o presentas un proyecto? Escríbenos por mensaje o WhatsApp y te enseñamos cómo lo presentaríamos.\nClaudia es una presentadora IA de Vitruvi Studio.", "copy_en": "Your buyer signs off-plan looking at an image. Let's talk about that image. The sun of their orientation at the hour they get home, a set table and someone opening the door: that's how a render starts to feel like a visit. Message us and we'll show you how we'd present your project.", "cta": "Escríbenos por mensaje o al WhatsApp y te enseñamos cómo lo presentaríamos.", "hashtags": [], "por_que_viral": "Viral en su nicho: los comercializadores se lo reenvían y el LinkedIn de Stefano lo multiplica. Es la pieza que convierte seguidores de Claudia en mensajes para Vitruvi. Sin hashtags porque manda el manual de Vitruvi.", "imagenes": ["look presentadora", "puerta villa", "parejas de renders: exterior día y noche, salón vacío y con cena"]}, {"n": 8, "formato": "Reel de tendencia", "gancho": "Claudia señala con la palma un enchufe en la isla de la cocina: «Un enchufe en la isla. Parece poca cosa hasta que te falta». En pantalla, el texto de la tendencia: «Cosas de esta casa que tienen sentido».", "idea": "Formato de tendencia (las cosas de mi casa que tienen sentido) con seis detalles de obra nueva bien pensada, uno por corte y una frase de uso por detalle. Audio de tendencia si es orgánico; si funciona, se rehace con audio propio para poder promocionarlo. Se copia el formato, no el vídeo.", "plano": ["Enchufe en la isla: «Un enchufe en la isla. Parece poca cosa hasta que te falta»", "Lavadero con ventana: «Lavadero con ventana. La ropa se seca y no huele a cerrado»", "Armario en la entrada: «Armario en la entrada, para que el abrigo no viva en la silla»", "Grifo en la terraza: «Grifo en la terraza. Plantas y pies de playa»", "Banco en la ducha: «Banco en la ducha. Se agradece a los 30 y a los 80»", "Persiana que baja sola a las 15:00: «Persiana que baja sola a las tres, cuando el sol da de lleno»", "Claudia a cámara: «Nada de esto sale en el precio por metro. Pídeselo a tu arquitecto»"], "copy_es": "Un enchufe en la isla. Parece poca cosa hasta que te falta.\nLavadero con ventana. Armario en la entrada. Grifo en la terraza. Banco en la ducha. Persiana que baja sola a las tres.\nNada de esto sale en el precio por metro y todo se nota el primer mes.\nGuárdalo para enseñárselo a tu arquitecto.\nPresentadora IA de @vitruvistudio. Infografías no contractuales.", "copy_en": "A socket on the island. Seems like nothing until you don't have one. A laundry room with a window, a closet by the door, a tap on the terrace, a bench in the shower, shutters that close by themselves at 3 pm. None of it shows in the price per square metre; all of it shows in month one.", "cta": "Guárdalo para enseñárselo a tu arquitecto.", "hashtags": ["#cosasquetienensentido", "#obranueva", "#interiorismo", "#detalles", "#casa", "#renders", "#vitruvistudio"], "por_que_viral": "Formato que la gente ya reconoce y consume en bucle; los detalles satisfactorios generan guardados y «yo quiero esto». Gancho B para el Trial Reel: «Seis cosas que pediría en cualquier obra nueva».", "imagenes": ["seis detalles de interior en renders: cocina, lavadero, entrada, terraza, baño", "mano y palma de Claudia", "plano medio final"]}, {"n": 9, "formato": "Serie de stories", "gancho": "Story 1, Claudia en el sofá, a cámara: «Esta tarde, sin casas. Me preguntas tú a mí, lo de ser IA incluido». Sticker de preguntas.", "idea": "La transparencia como contenido, sin hacer de ello un número: 8-10 stories en una tarde (18:00-20:00) respondiendo desde el sofá a las preguntas que todo el mundo se hace. Las respuestas se recortan en reels la semana siguiente y se guardan en el destacado «Soy IA».", "plano": ["¿Quién te creó?: «Vitruvi Studio, un estudio de Barcelona que hace infografías y visitas virtuales de obra nueva»", "¿Hay una persona detrás?: «Un equipo. Mi historia la escribieron ellos; las casas que enseño, no»", "¿Por qué Barcelona?: «Mi padre es de aquí. Vine por un máster de visualización y me quedé por el barrio»", "¿Las casas son reales?: «Las promociones sí. Lo que ves son infografías no contractuales, y lo digo siempre»", "¿Puedo contratarte?: «Si promueves o comercializas obra nueva, escribe a @vitruvistudio. Te contestan ellos, no yo»", "¿Qué no haces?: «Dar precios que no me hayan confirmado, asesorar de hipotecas y hacerme pasar por humana»", "Encuesta: «¿Qué barrio quieres que enseñe?»", "Cierre: «El lunes, una de obra nueva. Con metros y orientación, como siempre»"], "copy_es": "Esta tarde, sin casas. Me preguntas tú a mí, lo de ser IA incluido.\nRespondo desde el sofá. Lo que no hago: precios sin confirmar, asesoría y hacerme pasar por humana.\nPresentadora IA de @vitruvistudio.", "copy_en": "No houses this afternoon. You ask me, the AI part included. Answering from the sofa. AI presenter by @vitruvistudio.", "cta": "Pregunta en la caja. Si vendes obra nueva, escribe a Vitruvi.", "hashtags": ["#creadaconia", "#ia", "#obranueva", "#barcelona", "#vitruvistudio"], "por_que_viral": "La honestidad desarma a los críticos y da a la prensa un titular limpio. Las respuestas alimentan reels y cumplen de forma visible el artículo 50 del Reglamento de IA.", "imagenes": ["look presentadora o calle, sentada en el sofá", "piso Poblenou con luz de tarde", "la gata en el plano"]}, {"n": 10, "formato": "Reel", "gancho": "Claudia en el balcón con una grúa detrás: «Desde mi balcón cuento siete grúas. Te enseño qué están construyendo».", "idea": "Día en mi vida en Poblenou: la luz de las 7:30, la carrera por el Bogatell, el flat white, una obra con casco, la pantalla con la infografía de esa obra terminada, el vermut. Cierra: «Un barrio a medio hacer, a ocho minutos de la playa. Me va bien».", "plano": ["Balcón: gancho. «Ven, que te enseño el barrio»", "Ventana con luz, texto «7:30, este»: «Las siete y media. Ventana al este; por eso me levanto sin alarma»", "Carrera por el paseo marítimo, sin voz", "Café en la Rambla del Poblenou: «Flat white. Costumbre de Miami que no pienso dejar»", "Obra con casco, palma hacia el forjado: «Esto será un salón. Da al mar y el forjado de arriba ya está»", "Pantalla: render de la misma obra: «Y así se va a ver cuando terminen. Es una infografía; el sol es el de aquí»", "Vermut, manos y mesa: «Vermut en Marià Aguiló. Fin de la jornada»", "Puerta: «El lunes, otra casa. ¿Pasamos?»"], "copy_es": "Desde mi balcón cuento siete grúas. Te enseño qué están construyendo.\nPoblenou: luz a las 7:30 por la ventana del este, carrera hasta el Bogatell, flat white, una obra con casco a mediodía y, por la tarde, la infografía de esa misma obra terminada. Vermut al cerrar.\nSígueme para la siguiente casa; hay una cada lunes.\nPresentadora IA de @vitruvistudio.", "copy_en": "From my balcony I count seven cranes. Let me show you what they're building. Poblenou: 7:30 light through the east window, a run to Bogatell, a flat white, a building site at noon and, by evening, the render of that same site finished. Vermouth to close.", "cta": "Sígueme para la siguiente casa; hay una cada lunes.", "hashtags": ["#poblenou", "#barcelona", "#diaenmivida", "#obranueva", "#22arroba", "#creadaconia", "#vitruvistudio"], "por_que_viral": "El «día en mi vida» convierte visitas en seguidores; el barrio lo comparte su propia comunidad y el gancho con número concreto (siete grúas) abre curiosidad sin truco. Enseña que Claudia tiene vida, no solo casas. Caras reales fuera de plano.", "imagenes": ["piso Poblenou: ventana y balcón con grúa", "calle Barcelona, look calle", "playa Bogatell", "obra con casco", "pantalla con render", "vermut, manos y mesa"]}]}</script>
<script>

const PANEL = new Set(["seria", "sonrisa", "perfil", "cuerpo"]);
const HEART_PATH = "M12 20.5s-7.5-4.4-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.8-7.5 10.2-7.5 10.2z";
const HEART = `<svg class="i heart" viewBox="0 0 24 24"><path d="${HEART_PATH}"/></svg>`;
const BUBBLE = '<svg class="i" viewBox="0 0 24 24"><path d="M20.5 11.5a8.5 8.5 0 0 1-12.3 7.6L3.5 20.5l1.4-4.4a8.5 8.5 0 1 1 15.6-4.6z"/></svg>';
const PLAY = '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l5.5-3.5z"/></svg>';
const DOTS = '<svg class="i" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/></svg>';
const GRIDI = '<svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16"/></svg>';
const pad = n => String(n).padStart(2, "0");
const $ = id => document.getElementById(id);
const cands = JSON.parse($("cast-data").textContent);
const persona = JSON.parse($("persona-data").textContent);
const OLD = Array.from({ length: 12 }, (_, i) => ({
  id: "a" + pad(i + 1), label: "A" + (i + 1), src: `media/c${pad(i + 1)}.jpg`, age: i < 6 ? "≈28 años" : "26 años", now: i === 6,
}));

// One "set" per story circle: each candidate, the previous round, and Claudia herself
const SETS = cands.map(c => {
  const key = "c" + pad(c.n);
  return {
    key, n: c.n, handle: `candidata.${pad(c.n)}`, title: c.label, age: c.age, chips: c.chips || [], inspired: c.inspired || "", group: c.group || "",

  };

SETS.push({
  key: "old", handle: "ronda.anterior", title: "Ronda anterior", age: "", chips: [], inspired: "", avatar: "media/c07.jpg",
  frames: OLD.map(o => ({ src: o.src, cap: `${o.label} · ${o.now ? "la actual" : o.age}`, pick: o.id })),
});
const OLD_IDX = SETS.length - 1;
const CL = {
  avatar: "media/claudia/b2_risa.jpg",
  base: [["b1_frente", "Frente"], ["b2_risa", "Risa"], ["b3_tres_cuartos_izq", "Tres cuartos"], ["b4_tres_cuartos_der", "Tres cuartos"], ["b5_perfil", "Perfil"], ["b6_cuerpo", "Cuerpo"], ["b7_presentadora", "Presentadora"], ["b8_calle", "Poblenou"]],
  posts: ["p01_puerta", "p02_obra", "p03_balcon", "p04_atico", "p05_plano", "p06_piscina", "p07_noche", "p08_cocina", "p09_sofa", "p10_balcon_gruas"],
  voices: [["carmen", "Carmen"], ["lucia", "Lucía"], ["clara", "Clara"], ["casilda", "Casilda"], ["amparo", "Amparo"]],
};
SETS.push({
  key: "claudia", handle: "claudia", title: "Claudia", age: 26, chips: ["Elegida", "Casting nº 12"], inspired: "", avatar: CL.avatar,
  frames: CL.base.map(([f, cap]) => ({ src: `media/claudia/${f}.jpg`, hd: `media/claudia/hd/${f}.jpg`, cap, pick: "c12" })),
});
const CL_IDX = SETS.length - 1;
const labelFor = id => id[0] === "a" ? "A" + (+id.slice(1)) : String(+id.slice(1));
const setFor = id => SETS.find(s => s.key === id) || SETS[OLD_IDX];

const picks = {};
const queue = {};
let db = null;
let seen = new Set();
try { seen = new Set(JSON.parse(localStorage.getItem("cc-seen") || "[]")); } catch {}
const markSeen = k => { if (seen.has(k)) return; seen.add(k); try { localStorage.setItem("cc-seen", JSON.stringify([...seen])); } catch {} refresh(); };

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else if (k === "html") e.innerHTML = v; else e.setAttribute(k, v);
  }
  for (const k of kids) if (k) e.append(k);
  return e;
}
const img = (src, hd, extra = {}) => { const i = el("img", { src, alt: "", loading: "lazy", decoding: "async", ...extra }); if (hd) i.dataset.hd = hd; return i; };
function pop(node) { node.classList.remove("go"); void node.offsetWidth; node.classList.add("go"); }
const toastEl = $("toast");
let toastT;
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("on"), 1600); }
const overlaysOpen = () => document.querySelectorAll(".sheet:not([hidden]), .viewer:not([hidden])").length > 0;
const lock = () => document.body.classList.add("lock");
const unlock = () => { if (!overlaysOpen()) document.body.classList.remove("lock"); };

// ---------- Pinch in place: the photo grows over the page and springs back on release ----------
const PZ = { on: false, clone: null, src: null, rect: null, p0x: 0, p0y: 0, d0: 1, s: 1, shade: null, end: null, wheelT: 0 };
function pzBegin(node, cx, cy, d0, end) {
  const r = node.getBoundingClientRect();
  const c = node.cloneNode(true);
  c.removeAttribute("id");
  c.querySelectorAll?.(".tag, .lbl, .mark").forEach(n => n.remove());
  const cs = getComputedStyle(node);
  Object.assign(c.style, { position: "fixed", left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px", margin: "0",
    zIndex: 90, transformOrigin: "0 0", pointerEvents: "none", transition: "none", visibility: "visible", borderRadius: cs.borderRadius, overflow: "hidden",
    objectFit: cs.objectFit, objectPosition: cs.objectPosition });
  const hd = node.dataset.hd || node.querySelector?.("img")?.dataset.hd;
  if (hd) { const fg = c.matches("img") ? c : c.querySelector("img"); if (fg) { const im = new Image(); im.onload = () => { fg.src = hd; }; im.src = hd; } }
  const shade = el("div", { class: "pz-shade" });
  document.body.append(shade, c);
  node.style.visibility = "hidden";
  Object.assign(PZ, { on: true, clone: c, src: node, rect: r, p0x: cx - r.left, p0y: cy - r.top, d0, s: 1, shade, end });
}
function pzMove(cx, cy, s) {
  PZ.s = Math.min(4, Math.max(1, s));
  PZ.clone.style.transform = `translate(${cx - PZ.rect.left - PZ.p0x * PZ.s}px, ${cy - PZ.rect.top - PZ.p0y * PZ.s}px) scale(${PZ.s})`;
  PZ.shade.style.opacity = String(Math.min(0.75, (PZ.s - 1) * 0.9));
}
function pzEnd() {
  if (!PZ.on) return;
  PZ.on = false;
  const { clone, shade, src, end } = PZ;
  clone.style.transition = "transform .26s cubic-bezier(.2,.8,.2,1)"; clone.style.transform = "translate(0px, 0px) scale(1)";
  shade.style.transition = "opacity .26s"; shade.style.opacity = "0";
  setTimeout(() => { clone.remove(); shade.remove(); src.style.visibility = ""; end?.(); }, 270);
}
function attachPinch(area, pick, hooks = {}) {
  const span = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1;
  area.addEventListener("touchstart", e => {
    if (e.touches.length !== 2 || PZ.on) return;
    const node = pick(e); if (!node) return;
    e.preventDefault();
    const [a, b] = e.touches;
    hooks.start?.();
    pzBegin(node, (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2, span(a, b), hooks.end);
  }, { passive: false });
  area.addEventListener("touchmove", e => {
    if (!PZ.on || e.touches.length < 2) return;
    e.preventDefault();
    const [a, b] = e.touches;
    pzMove((a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2, span(a, b) / PZ.d0);
  }, { passive: false });
  const up = e => { if (PZ.on && e.touches.length < 2) pzEnd(); };
  area.addEventListener("touchend", up);
  area.addEventListener("touchcancel", up);
  // A trackpad pinch on a computer arrives as ctrl + wheel
  area.addEventListener("wheel", e => {
    if (!e.ctrlKey) return;
    const node = PZ.on ? PZ.src : pick(e); if (!node) return;
    e.preventDefault();
    if (!PZ.on) { hooks.start?.(); pzBegin(node, e.clientX, e.clientY, 1, hooks.end); }
    pzMove(e.clientX, e.clientY, PZ.s * Math.exp(-e.deltaY * 0.01));
    clearTimeout(PZ.wheelT); PZ.wheelT = setTimeout(pzEnd, 200);
  }, { passive: false });
}
const pinchTiles = grid => attachPinch(grid, e => e.target.closest?.(".tile")?.querySelector("img"));

// ---------- Small builders ----------
function ring(set, size = "") {
  const r = el("span", { class: `ring ${size}`, "data-ring": set.key }, el("img", { src: set.avatar, alt: "", decoding: "async" }));
  if (set.n && !size) r.append(el("span", { class: "badge", text: set.n }));

}
function heartBtn(id, cls = "", label = "") {
  const b = el("button", { type: "button", class: cls || null, "data-heart": id, "aria-pressed": "false", "aria-label": `Me gusta: finalista ${labelFor(id)}`, html: HEART + label });
  b.addEventListener("click", e => { e.stopPropagation(); toggle(id); });

}
function tile(src, hd, label, onClick, pickId) {
  const t = el("button", { type: "button", class: "tile", "data-tile": pickId || null, "aria-label": label || "Ver foto" }, img(src, hd),
    label ? el("span", { class: "lbl", text: label }) : null, el("span", { class: "mark", html: HEART }));
  t.addEventListener("click", onClick);
  return t;
}
function noteInput(id, label) {
  const input = el("input", { type: "text", "data-note": id, placeholder: "Añade una nota…", "aria-label": label, autocomplete: "off", enterkeyhint: "send" });
  const send = el("button", { type: "button", text: "Publicar", hidden: "" });
  let t;
  input.addEventListener("input", () => { send.hidden = !input.value.trim(); clearTimeout(t); t = setTimeout(() => save(id, { note: input.value.trim() }), 900); });
  const commit = () => { clearTimeout(t); save(id, { note: input.value.trim() }); send.hidden = true; input.value = ""; input.blur(); toast("Nota guardada"); };
  input.addEventListener("keydown", e => { if (e.key === "Enter") commit(); });
  send.addEventListener("click", commit);
  return el("div", { class: "add-note" }, el("span", { class: "ring xs", style: "background:var(--line)" }, el("img", { src: CL.avatar, alt: "" })), input, send);
}

// ---------- Feed ----------
function renderFeed() {
  const st = $("stories");
  for (const s of [SETS[CL_IDX], ...SETS.slice(0, CL_IDX)]) {
    const b = el("button", { type: "button", class: "st", "aria-label": `Ver historia: ${s.n ? s.n + ", " : ""}${s.title}` }, ring(s), el("span", { text: s.n ? s.handle : s.title }));
    b.addEventListener("click", () => openStory(SETS.indexOf(s), 0, b));
    st.append(b);
  }
  const feed = $("feed");
  for (const s of SETS.filter(s => s.n)) feed.append(post(s));
}

function post(s) {
  const car = el("div", { class: "car", tabindex: "0", "aria-label": `Fotos de la candidata ${s.n}` });
  s.frames.forEach(f => car.append(el("div", { class: PANEL.has(f.k) ? "slide panel" : "slide", "data-hd": f.hd },
    img(f.src, f.hd, { alt: `Candidata ${s.n}, ${f.cap.toLowerCase()}` }), el("span", { class: "tag", text: f.cap }))));
  const ctr = el("span", { class: "ctr", text: `1/${s.frames.length}` });
  const burst = el("div", { class: "burst", html: `<svg viewBox="0 0 24 24"><path d="${HEART_PATH}"/></svg>` });
  const prev = el("button", { type: "button", class: "arrow prev", "aria-label": "Foto anterior", text: "‹" });
  const next = el("button", { type: "button", class: "arrow next", "aria-label": "Foto siguiente", text: "›" });
  const dots = el("div", { class: "dots", "aria-hidden": "true" });
  s.frames.forEach((_, i) => dots.append(el("i", { class: i ? "" : "on" })));
  const here = () => Math.round(car.scrollLeft / car.clientWidth);
  const go = d => car.scrollTo({ left: (here() + d) * car.clientWidth, behavior: "smooth" });
  prev.addEventListener("click", () => go(-1));
  next.addEventListener("click", () => go(1));
  let ctrT, lastI = 0;
  car.addEventListener("scroll", () => {
    const i = here();
    ctr.style.opacity = "1"; clearTimeout(ctrT); ctrT = setTimeout(() => { ctr.style.opacity = "0"; }, 2500);
    if (i === lastI) return;
    lastI = i; ctr.textContent = `${i + 1}/${s.frames.length}`;
    [...dots.children].forEach((d, j) => d.classList.toggle("on", j === i));
  }, { passive: true });
  car.addEventListener("keydown", e => { if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); });
  attachPinch(car, () => car.children[here()]);
  // Double tap = like = finalist
  let last = 0, sx = 0, sy = 0, pinched = false;
  const touches = new Set();
  car.addEventListener("pointerdown", e => { if (!touches.size) pinched = false; touches.add(e.pointerId); sx = e.clientX; sy = e.clientY; if (touches.size > 1) pinched = true; });
  car.addEventListener("pointercancel", e => touches.delete(e.pointerId));
  car.addEventListener("pointerup", e => {
    touches.delete(e.pointerId);
    if (pinched || Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) return;
    const now = Date.now();
    if (now - last < 300) { last = 0; if (!picks[s.key]?.finalist) toggle(s.key); pop(burst); } else last = now;
  });

  const noteBtn = el("button", { type: "button", "aria-label": "Escribir nota", html: BUBBLE });
  const ni = noteInput(s.key, `Nota sobre la candidata ${s.n}`);
  noteBtn.addEventListener("click", () => ni.querySelector("input").focus());
  const storyBtn = el("button", { type: "button", "aria-label": "Ver en historia", html: PLAY });
  storyBtn.addEventListener("click", () => openStory(SETS.indexOf(s), here(), storyBtn));
  const more = el("button", { type: "button", class: "more", "aria-label": "Ver perfil", html: DOTS });
  more.addEventListener("click", () => openProfile(s, more));
  const who = el("button", { type: "button", class: "p-who", "aria-label": `Perfil de la candidata ${s.n}` }, el("b", { text: s.handle }), el("span", { text: `${s.title} · ${s.age} años` }));
  who.addEventListener("click", () => openProfile(s, who));
  const av = el("button", { type: "button", "aria-label": `Historia de la candidata ${s.n}` }, ring(s, "sm"));
  av.addEventListener("click", () => openStory(SETS.indexOf(s), 0, av));

function renderExplore() {
  const box = $("explore");
  const mine = CL.posts.map((f, i) => ({ src: `media/claudia/posts/${f}.jpg`, hd: `media/claudia/posts/hd/${f}.jpg`, words: "claudia publicacion post", open: t => openPost(i, t) }));
  const theirs = [];
  SETS.forEach((s, si) => { if (!s.n) return; s.frames.forEach((f, fi) => theirs.push({ src: f.src, hd: f.hd, pick: s.key, words: `${s.title} ${s.chips.join(" ")} ${f.cap} ${s.group} ${s.n}`, open: t => openStory(si, fi, t) })); });

  const order = theirs.map((x, i) => [((i * 37) % theirs.length), x]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  const mixed = [];
  order.forEach((x, i) => { mixed.push(x); if (i % 9 === 4 && mine.length) mixed.push(mine.shift()); });

  mixed.forEach((it, i) => {

}

function list(arr) { const u = el("ul"); for (const x of arr || []) u.append(el("li", { text: x })); return u; }
function openDetail(title, nodes, from) {
  $("dt-title").textContent = title;
  $("dt-body").replaceChildren(...nodes.filter(Boolean));
  openSheet("detail", from);
}
function openPost(i, from) {
  const x = persona.posts?.[i], f = CL.posts[i];
  if (!x) return;
  const hero = f ? img(`media/claudia/posts/${f}.jpg`, `media/claudia/posts/hd/${f}.jpg`, { alt: `Publicación ${x.n}`, style: "width:100%;border-radius:4px" }) : null;
  const wrap = hero ? el("div", {}, hero) : null;
  if (wrap) attachPinch(wrap, () => hero);
  openDetail(`Publicación ${x.n} · ${x.formato.split(" (")[0]}`, [
    wrap,
    el("h3", { text: x.gancho }), el("p", { text: x.idea }),
    x.plano?.length ? card("Planos o láminas", list(x.plano)) : null,
    card("Copy ES", el("p", { class: "copy", text: x.copy_es })),
    card("Copy EN", el("p", { class: "copy", text: x.copy_en })),
    card("Por qué puede viralizar", el("p", { text: x.por_que_viral })),
    el("p", { class: "tagsline", text: (x.hashtags || []).join(" ") })], from);
}
function renderClaudia() {
  const p = persona, box = $("tab-claudia");
  box.append(el("div", { class: "s-top" }, el("b", { text: "claudia" })));
  if (!p || !p.resumen) { box.append(el("p", { class: "empty", text: "La personalidad de Claudia aparece aquí en cuanto esté escrita." })); return; }
  const av = el("button", { type: "button", "aria-label": "Ver historia de Claudia" }, ring(SETS[CL_IDX], "xl"));
  av.addEventListener("click", () => openStory(CL_IDX, 0, av));
  box.append(el("div", { class: "pr-head" }, av,
    el("div", { class: "pr-stats" },
      el("div", {}, el("b", { text: p.posts?.length || 0 }), el("span", { text: "posts" })),
      el("div", {}, el("b", { text: "0" }), el("span", { text: "publicados" })),
      el("div", {}, el("b", { text: "ES·EN" }), el("span", { text: "idiomas" })))));
  box.append(el("div", { class: "pr-bio" }, el("b", { text: "Claudia · presentadora IA" }), el("span", { class: "muted", text: "Creadora de contenido · Obra nueva" }),
    el("p", { text: p.resumen.frase }), el("p", { text: "Miami → Barcelona · Poblenou" }), el("p", { class: "tagsline", text: "@vitruvistudio" })));
  box.append(voicePicker());

  const highs = [
    ["Fotos base", { src: "media/claudia/b1_frente.jpg" }, () => [el("p", { class: "muted", text: "La cara fijada para todas las fotos y vídeos. Pellizca para acercar." }), (() => {
      const g = el("div", { class: "grid" });
      CL.base.forEach(([f, cap], i) => g.append(tile(`media/claudia/${f}.jpg`, `media/claudia/hd/${f}.jpg`, cap, e => openStory(CL_IDX, i, e.currentTarget))));
      pinchTiles(g);
      return g;
    })()]],
    ["Quién es", { text: "Q" }, () => [card("Su historia", ...(p.historia || []).map(t => el("p", { text: t })))]],
    ["Su vida", { src: "media/claudia/b8_calle.jpg" }, () => (p.vida || []).map(v => card(v.titulo, el("p", { text: v.texto })))],
    ["Frases", { text: "“" }, () => p.voz ? [card("Tono", el("p", { text: p.voz.tono })), card("Frases ES", list(p.voz.frases_es)), card("Frases EN", list(p.voz.frases_en)), card("Gestos", list(p.voz.gestos)), card("Nunca", list(p.voz.nunca))] : []],
    ["Copies", { text: "Aa" }, () => p.copies ? [card("Reglas", list(p.copies.reglas)), card("Ejemplo ES", el("p", { class: "copy", text: p.copies.ejemplo_es })), card("Example EN", el("p", { class: "copy", text: p.copies.ejemplo_en }))] : []],
    ["Semana", { text: "7" }, () => [...(p.calendario || []).map(d => card(d.dia, el("p", { text: d.que }))), card("Stories", list(p.stories))]],
    ["Inspiración", { text: "5" }, () => (p.inspiraciones || []).map(x => card(x.nombre, el("p", { text: x.por_que }), el("p", { class: "muted", text: "Tomamos: " + x.tecnica })))],
  ];
  const hl = el("div", { class: "high" });
  for (const [name, face, build] of highs) {
    const inner = face.src ? el("img", { src: face.src, alt: "" }) : el("span", { text: face.text });
    const b = el("button", { type: "button", class: "hl" }, el("i", {}, inner), el("span", { text: name }));
    b.addEventListener("click", () => openDetail(name, build(), b));
    hl.append(b);
  }
  box.append(hl);
  box.append(el("div", { class: "pr-tabs" }, el("span", { html: GRIDI })));
  const grid = el("div", { class: "grid" });
  (p.posts || []).forEach((x, i) => {
    const f = CL.posts[i];
    if (f) grid.append(tile(`media/claudia/posts/${f}.jpg`, `media/claudia/posts/hd/${f}.jpg`, `${x.n} · ${x.formato.split(" (")[0]}`, e => openPost(i, e.currentTarget)));
  });
  pinchTiles(grid);
  box.append(grid, el("p", { class: "muted", style: "padding:10px 0", text: "Borrador · no se publica nada" }));
}

// ---------- Tabs ----------
document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => tab(b.dataset.tab)));
$("top-heart").addEventListener("click", () => tab("picks"));
function tab(name) {
  const cur = document.querySelector("[data-tab][aria-current]")?.dataset.tab;
  for (const t of ["feed", "explore", "picks", "claudia"]) $("tab-" + t).hidden = t !== name;
  document.querySelectorAll("[data-tab]").forEach(b => b.dataset.tab === name ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  window.scrollTo({ top: 0, behavior: cur === name ? "smooth" : "auto" });
}

// ---------- Print (PDF) ----------
function renderPrint() {
  const pr = $("print");
  pr.append(el("div", { class: "ph", text: "Casting Claudia · ronda 2" }));
  for (const s of SETS.filter(s => s.n)) {
    const row = el("div", { class: "row" });
    for (const f of s.frames) row.append(el("img", { src: f.src, alt: "" }));
    pr.append(el("div", { class: "pp" }, el("h2", { text: `${s.n} · ${s.title} · ${s.age} años` }), el("p", { text: `${s.chips.join(" · ")}${s.inspired ? " · Rasgos de " + s.inspired : ""}` }), row));
  }
  if (persona.posts?.length) {
    const box = el("div", { class: "pposts" });
    for (const x of persona.posts) box.append(el("div", {}, el("b", { text: `${x.n} · ${x.formato}. ` }), document.createTextNode(x.gancho)));
    pr.append(el("div", { class: "pp", style: "break-before:page" }, el("div", { class: "ph", text: "Claudia · 10 primeras publicaciones" }), el("p", { text: persona.resumen?.frase || "" }), box));
  }
}

renderFeed();
renderExplore();
renderOld();
renderClaudia();
renderPrint();
refresh();

(async () => {
  try { db = window.claude?.use ? await window.claude.use("db") : null; } catch { db = null; }
  if (!db) { setState("Sin guardar: abre el enlace con tu cuenta"); return; }
  setState("Listo");
  db.collection("picks").onSnapshot(snap => {
    for (const d of snap.docs) if (d.exists) picks[d.id] = d.data();
    refresh();
  }, () => setState("Conexión perdida: recarga la página"));
})();
</script>
