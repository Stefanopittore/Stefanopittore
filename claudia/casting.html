iscina y gente viviendo la casa. La vara con la que medir el guion B."}, {"titulo": "Architectural Digest · «$100M equestrian estate» y Bespoke RE · «Equestrian facility»", "url": "https://www.youtube.com/watch?v=k2Sft4bwESw", "vistas": "895 K y 708 K (YouTube, comprobado 25/10/2026)", "aprendizaje": "El caballo significa escala y vida, no decoración. Un plano de 1,4 s basta: mano en el cuello, mirada a cámara, amanecer en una masía del Empordà."}, {"titulo": "lift on · «Video tours for properties that don't exist yet» (IA, Engel & Völkers, 0:51)", "url": "https://www.youtube.com/watch?v=ieU_G-4AJJ0", "vistas": "953 (YouTube, 3 semanas; comprobado 25/10/2026)", "aprendizaje": "Ya existe quien vende visitas IA de casas que no existen, sin presentadora ni gancho: 953 vistas. La diferencia de Claudia es la anfitriona y la honestidad en pantalla, no la tecnología."}], "tendencias": {"ganchos": ["número concreto", "bucle abierto (la recompensa se retiene)", "contradicción", "ancla de precio / adivina el precio", "dirección directa a un público («si vendes obra nueva…»)", "no abrir con «Hola, soy…»: la presentación va después del plano espectacular"], "formatos": ["ancla de precio", "antes y después / render vs obra", "revelado día-noche sin palabras", "busto parlante de objeción (14-30 s)", "visita narrada 15-30 s", "lip-sync sobre sonido de tendencia (solo orgánico)", "tráiler de marca 27-31 s", "un día en mi vida", "quiz ¿real o IA? / ¿foto o render?"], "ritmo_corte": "Reel actual de Claudia medido: 27 s, 4 cortes (0,15 cortes/s, plano medio 5,4 s). Tráilers de 27-31 s de referencia: plano cada 1-2 s. Prescripción: guion B 16 planos en 25 s (0,64 cortes/s; montaje a 1,2-1,4 cortes/s, planos hablados de 1,5-3 s); guion A 12 planos en 14,5 s. Nunca cámara lenta. No existe estudio público riguroso de cortes por segundo; las cifras de proveedores son heurísticas. Versión de 15 s: 2 planos hablando en 5,6 s y 12 cortes en 7,4 s (1,6 cortes/s) sobre 128 BPM; 15 planos en total, 1 corte/s de media.", "duracion": "Orgánico 15-30 s (gancho + una idea); anuncio: 6-15 s ThruPlay típico 18-35 %, 16-30 s 15-25 %. B = 25 s, A = 14,5 s.", "texto_en_pantalla": "1-3 palabras a la vez, sans geométrica semibold (Inter/Montserrat), 60 px sobre 1080, blanco con sombra, palabra clave en camel #C8A27A, centrado al 55-60 % de altura (la interfaz de Reels creció a finales de 2025). Rótulo legal «Presentadora IA · Infografías no contractuales» a 34 px arriba izquierda desde el fotograma 1.", "sonidos": "Virales: himnos de ciudad, sonidos originales de tendencia para lip-sync, sonido original con voz. Con música con licencia no se puede promocionar (Instagram obliga a cambiarla por Meta Sound Collection). Guion B: audio original propio a 96 BPM con cortes en el pulso; guion A: pulso propio a 120 BPM con tic de cuenta atrás. Sonidos de tendencia se consultan el día del montaje en TikTok Creative Center (España) y la pestaña de audio de Reels, solo para orgánico."}, "guiones": [{"id": "A", "titulo": "¿Foto o render?", "duracion": "14,5 s · 9:16", "por_que": "Versión inmobiliaria del quiz «¿real o IA?», formato de masas en 2025-2026. Cada imagen es un bucle abierto de 1,2 s: quien se queda a comprobar ya ha visto el 80 % del reel. Pieza de guardados y comentarios sin pedirlos, y la única que Vitruvi puede hacer con autoridad. Audio propio. Gancho B para Trial Reel: «Cuatro casas. Dos no existen todavía.» Requiere dos fotos reales con derechos y dos renders de Vitruvi; nunca se hace pasar un render por foto.", "planos": [{"seg": "0,0-1,2", "imagen": "Claudia, look calle, azotea de su fábrica rehabilitada en Poblenou con grúas y una torre del 22@ detrás, luz de las 10:00. iPhone a la altura de los ojos, ligero temblor, encuadre un pelo torcido, cielo sin HDR, pelo con brisa, piel con textura. Abre la palma a la lente con la primera palabra.", "texto": "¿FOTO O RENDER? · rótulo IA arriba izq.", "voz": "¿Foto o render? Som-hi.", "sonido": "Chasquido de dedos; arranca pulso propio a 120 BPM."}, {"seg": "1,2-2,4", "imagen": "Imagen 1: foto real de una terraza de obra entregada a las 20:00 con la mesa puesta, pantalla completa con marco fino blanco y anillo de cuenta atrás de 1 s.", "texto": "1", "voz": "", "sonido": "Tic-tac de 1 s."}, {"seg": "2,4-2,9", "imagen": "Sello sobre la imagen 1.", "texto": "FOTO (verde oliva)", "voz": "", "sonido": "Ding."}, {"seg": "2,9-4,1", "imagen": "Imagen 2: render de Vitruvi, terraza al oeste a las 20:00 de julio, 14 m², mesa para seis; grano añadido para igualar la foto.", "texto": "2", "voz": "", "sonido": "Tic-tac."}, {"seg": "4,1-4,6", "imagen": "Sello y parpadeo de 3 fotogramas en wireframe (firma de Vitruvi).", "texto": "RENDER (camel)", "voz": "", "sonido": "Blip corto."}, {"seg": "4,6-5,8", "imagen": "Imagen 3: foto real de un salón de piso piloto con luz lateral.", "texto": "3", "voz": "", "sonido": "Tic-tac."}, {"seg": "5,8-6,3", "imagen": "Sello.", "texto": "FOTO", "voz": "", "sonido": "Ding."}, {"seg": "6,3-7,5", "imagen": "Imagen 4: render de cocina con isla, luz del este a las 9:00.", "texto": "4", "voz": "", "sonido": "Tic-tac."}, {"seg": "7,5-8,0", "imagen": "Sello y wireframe.", "texto": "RENDER", "voz": "", "sonido": "Blip."}, {"seg": "8,0-11,0", "imagen": "Claudia en la azotea, mismo encuadre un paso más cerca (como si el móvil se hubiera movido). Manos abiertas de contraste y casi un segundo de pausa antes de la segunda frase.", "texto": "así se van a ver", "voz": "Si has fallado alguna, no pasa nada. (pausa) Así se van a ver.", "sonido": "El pulso baja a la mitad; ambiente de calle."}, {"seg": "11,0-13,0", "imagen": "Mismo plano, palma del pecho hacia la cámara.", "texto": "la siguiente, el lunes", "voz": "Yo las enseño antes de que existan. Guárdalo para la siguiente.", "sonido": "Última nota de la música."}, {"seg": "13,0-14,5", "imagen": "Cartela sobre el render de la terraza oscurecido un 30 %.", "texto": "Claudia · Presentadora IA de Vitruvi Studio · Infografías no contractuales", "voz": "", "sonido": "Ambiente de azotea, sin música."}], "copy": "¿Foto o render? Cuatro casas, dos no existen todavía.\nLas dos que son render se van a ver así: mismo sol, misma hora, mismos metros.\nGuárdalo para la siguiente, el lunes.\nPresentadora IA de @vitruvistudio. Infografías no contractuales.\n¿Promueves o comercializas obra nueva? Escríbeles por mensaje o WhatsApp."}, {"id": "B", "titulo": "Tráiler «Hola, soy Claudia» · 15 s", "duracion": "15,0 s · 9:16", "por_que": "Versión rápida pedida por Stefano: ella se presenta hablando natural los primeros 5,6 s en la toma de noche y, en «igual», entra la música y llegan 12 cortes al pulso (0,5-1 s) en los que va apareciendo entre villas, áticos, la masía con caballo y la obra real. Termina en la misma puerta de noche, así el reel se repite en bucle. Edición moderna: corte en salto, barrido, destello en la entrada del ritmo, rampas de velocidad, corte por coincidencia (puerta de noche → puerta de día) y su voz entrando antes de verla. 15 s cabe entero en un ThruPlay. Claudia sale en 8 de los 15 planos.", "voz_completa": "Hola, soy Claudia. Esta casa todavía no existe… pero te la voy a enseñar igual. ¿Vendes obra nueva? Escríbeme.", "planos": [{"seg": "0,0-3,1", "imagen": "Noche, hora azul. Villa nueva en las colinas del Empordà, todas las ventanas encendidas y la piscina iluminada en turquesa. Claudia en la puerta pivotante de roble abierta; la luz cálida de dentro le cae en la cara y deja el resto en penumbra. Habla a cámara desde el primer fotograma, relajada, como quien te abre la puerta. Vestido largo de lino arena, aros de oro. iPhone en modo noche: grano visible, balance cálido frente al azul del cielo, halo en las ventanas, mano no del todo quieta.", "texto": "Rótulo fijo pequeño «Presentadora IA · @vitruvistudio» desde el fotograma 0. Subtítulos palabra a palabra.", "voz": "Hola, soy Claudia. Esta casa todavía no existe…", "sonido": "Grillos y agua de la piscina. Una nota grave de fondo, todavía sin ritmo.", "ella": true}, {"seg": "3,1-5,6", "imagen": "Corte en salto: el mismo plano, un 15 % más cerca y un pelo más torcido. Sonríe a media frase y en «igual» gira la cabeza hacia dentro; la cámara hace un barrido rápido hacia el salón encendido.", "texto": "Subtítulos palabra a palabra; «igual» en grande.", "voz": "…pero te la voy a enseñar igual.", "sonido": "Subida de tensión de 1 s; el barrido suena como un golpe de aire.", "ella": true}, {"seg": "5,6-6,1", "imagen": "ENTRA EL RITMO. Dron en picado rápido (rampa de velocidad) sobre una villa de obra nueva en un acantilado de la Costa Brava a hora dorada, pinos y mar. Destello blanco de 2 fotogramas en el corte.", "texto": "VILLAS", "voz": "", "sonido": "Golpe de entrada de la música propia, 128 BPM: cada corte cae en un pulso (0,47 s).", "ella": false}, {"seg": "6,1-6,6", "imagen": "Claudia camina por el borde de la piscina infinita con el vestido de lino, a contraluz de atardecer, el pelo se mueve. Cámara en mano a su lado.", "texto": "", "voz": "", "sonido": "Agua.", "ella": true}, {"seg": "6,6-7,1", "imagen": "Terraza de un ático en Barcelona al atardecer: la ciudad, el mar y la Sagrada Familia al fondo. Movimiento lateral rápido.", "texto": "ÁTICOS", "voz": "", "sonido": "Música.", "ella": false}, {"seg": "7,1-7,6", "imagen": "Detalle: su mano recorre la isla de piedra de una cocina nueva, luz rasante.", "texto": "", "voz": "", "sonido": "Roce de la piedra.", "ella": false}, {"seg": "7,6-8,5", "imagen": "Claudia en la terraza del ático gira la cabeza a cámara y se ríe. Rampa de velocidad: rápido, lento, rápido.", "texto": "", "voz": "", "sonido": "Música.", "ella": true}, {"seg": "8,5-9,0", "imagen": "Dron orbitando una masía rehabilitada en el Empordà a hora dorada, caballos en el cercado.", "texto": "MASÍAS", "voz": "", "sonido": "Música.", "ella": false}, {"seg": "9,0-9,9", "imagen": "Claudia junto a un caballo castaño en la valla, la mano en su cuello; mira a cámara y sonríe. Luz baja de tarde.", "texto": "CON CABALLO", "voz": "", "sonido": "Resoplido del caballo sobre el pulso.", "ella": true}, {"seg": "9,9-10,4", "imagen": "Dron que baja en picado sobre una piscina hacia el mar.", "texto": "", "voz": "", "sonido": "Golpe de aire.", "ella": false}, {"seg": "10,4-10,9", "imagen": "Salón de doble altura con escalera y luz de tarde; la cámara sube en vertical.", "texto": "", "voz": "", "sonido": "Música.", "ella": false}, {"seg": "10,9-11,4", "imagen": "Corte por coincidencia: ella empuja la misma puerta pivotante de roble del plano 1, esta vez de día.", "texto": "", "voz": "", "sonido": "Golpe seco de la puerta en el pulso.", "ella": true}, {"seg": "11,4-11,9", "imagen": "Obra real del 22@: grúa, forjado de hormigón, polvo en el aire. Ella, con casco blanco, camiseta blanca y vaqueros, señala dónde irá la cocina.", "texto": "ANTES DE LA PRIMERA PIEDRA", "voz": "", "sonido": "Obra lejana bajo la música.", "ella": true}, {"seg": "11,9-13,0", "imagen": "Vuelta a la noche: dron que se aleja de la villa encendida del plano 1 (rampa: rápido y luego lento).", "texto": "ANTES DE LA PRIMERA PIEDRA (sigue)", "voz": "¿Vendes obra nueva?", "sonido": "Su voz entra antes de verla, en 12,4. La música baja.", "ella": false}, {"seg": "13,0-15,0", "imagen": "Primer plano en la puerta de noche, la luz en la cara. Termina la frase mirando a cámara y sonríe. El último fotograma encaja con el primero para que el reel se repita en bucle.", "texto": "«¿Vendes obra nueva en Cataluña?» → «Escríbeme» con icono de WhatsApp. Pie fijo: «Presentadora IA de @vitruvistudio · Infografías no contractuales».", "voz": "Escríbeme.", "sonido": "La música corta en seco en «Escríbeme»; quedan los grillos.", "ella": true}], "copy": "Esta casa todavía no existe, pero te la voy a enseñar igual.\nSoy Claudia. Enseño obra nueva en Cataluña antes de la primera piedra: áticos, villas, masías. Lo que ves son infografías; las promociones son reales.\nSígueme para la siguiente; hay una cada lunes.\nPresentadora IA de @vitruvistudio. Infografías no contractuales.\n¿Vendes obra nueva? Escríbeles por mensaje o WhatsApp y te enseñan cómo presentarían tu promoción.", "vestuario": "Un solo look para que la cara y el cuerpo no cambien: vestido largo de lino arena y aros de oro (noche, piscina, ático, masía, puerta de día). En la obra: casco blanco, chaleco, camiseta blanca y vaqueros.", "produccion": "Unos 11 clips. La presentación (planos 1-2) y el cierre (plano 15) salen de una sola toma hablando de unos 8 s en la puerta de noche, con su voz (Amparo) y sincronización de labios; se usa el principio y el final. Los planos sin ella (dron, interiores, terraza) se generan cortos y se recortan a 0,5 s. Grano y temblor de iPhone iguales en todos para que no se note el cambio de plano."}], "recomendacion": {"guion": "B", "por_que": "Prueba lo que Stefano quiere probar: que ella, hablando, pare el scroll en los primeros segundos. Tiene una llamada a la acción legal y medible (mensajes de promotoras), audio propio que se puede promocionar sin cambios, y en 15 s enseña la marca completa: nombre, territorio, transparencia y a quién sirve. Al durar 15 s, cada reproducción completa cuenta como ThruPlay, y los vídeos de 6-15 s retienen más (18-35 %) que los de 16-30 s (15-25 %). El guion A se publica igual en orgánico como Trial Reel: es la pieza de guardados y comentarios, no la de anuncio.", "anuncio": {"objetivo": "Paso previo: B como Trial Reel con dos primeros planos (V1 puerta de noche, V2 la misma presentación hablando mientras camina por la piscina al atardecer); ganador a las 48-72 h. Fase 1 (días 1-4, 35 €): objetivo Reconocimiento, optimización Reproducciones de vídeo (ThruPlay), dos anuncios de 17,50 €. Fase 2 (días 5-7, 15 €): objetivo Interacción, destino Mensajes a WhatsApp de Vitruvi con el ganador; respuesta automática que se presenta como IA y ofrece HUMANO.", "ubicacion": "Instagram Reels y Facebook Reels (ubicaciones manuales, 9:16), desde Ads Manager con la cuenta publicitaria de Vitruvi. TikTok queda para una segunda prueba orgánica con Spark Ads (etiqueta de IA obligatoria en anuncios desde 21/07/2026; Claudia aún no tiene cuenta).", "publico": "Cataluña (Barcelona, Girona, Tarragona, Lleida), 25-55 años, español y catalán; Advantage+ audience con sugerencias de promoción inmobiliaria, arquitectura, interiorismo e inversión inmobiliaria. Sin categoría especial de vivienda: el anuncio no ofrece ninguna vivienda ni servicio de agente.", "duracion": "7 días: 4 de medición de gancho + 3 de llamada a la acción.", "presupuesto": "50 € en total: 35 € ThruPlay (2 × 17,50 €, 4,40 €/día) + 15 € Mensajes (5 €/día). Esperado con CPM de 6-12 €: 4.000-8.000 impresiones, 1.200-2.600 vistas de 3 s, 800-1.800 ThruPlays, 40-150 visitas al perfil, 2-6 conversaciones.", "kpis": [{"kpi": "Tasa de gancho (vistas de 3 s / impresiones)", "rango_referencia": "media 20-35 % (otra guía: 25-40 % media, 40-55 % fuerte)", "objetivo": "≥ 30 % bien, ≥ 40 % muy bien, < 20 % cambiar primer plano", "fuente": "https://coolnerdsmarketing.com/?p=42608 ; https://nestscale.com/blog/increase-tiktok-hook-rate.html"}, {"kpi": "Tasa de abandono (skip rate, Insights orgánico)", "rango_referencia": "sano < 30-40 %; > 50 % el gancho no funciona", "objetivo": "< 35 %", "fuente": "https://metricool.com/instagram-reel-analytics/"}, {"kpi": "ThruPlay (≥ 15 s o completas / impresiones)", "rango_referencia": "18-35 % típico en clips de 6-15 s a público frío (15-25 % en 16-30 s)", "objetivo": "≥ 25 %", "fuente": "https://dynamoi.com/learn/instagram-ads/meta-ads-manager-metrics-music-campaigns"}, {"kpi": "Tiempo medio de visionado", "rango_referencia": "sin benchmark oficial; ≥ 35-40 % del vídeo es sano", "objetivo": "≥ 7 s de 15", "fuente": "criterio propio sobre la lógica de finalización de Instagram"}, {"kpi": "CPM", "rango_referencia": "España todas las industrias: mediana ≈ 7,6 € (jul. 2025-jul. 2026), mínimo 3,6 €, picos > 10 €; inmobiliario global 28,7 $ de media (+39 % vs. global)", "objetivo": "5-12 €", "fuente": "https://www.superads.ai/facebook-ads-costs/cpm-cost-per-mille/spain ; https://www.superads.ai/facebook-ads-costs/cpm-cost-per-mille/real-estate/spain"}, {"kpi": "CTR", "rango_referencia": "España ≈ 1,6 % (1,1-2,7 %); inmobiliario global ≈ 2,8 % (2,2-4,7 %)", "objetivo": "1-2 % en fase 2 (clic a WhatsApp)", "fuente": "https://www.superads.ai/facebook-ads-costs/ctr-click-through-rate/spain ; https://www.superads.ai/facebook-ads-costs/ctr-click-through-rate/real-estate/spain"}, {"kpi": "Coste por conversación / mensaje", "rango_referencia": "sin benchmark independiente; proveedores: 1,5-8 € según sector, hasta 10 €", "objetivo": "≤ 7,5 € (≥ 2 conversaciones con 15 €) y al menos 1 de promotora o comercializadora", "fuente": "https://getkanal.com/blog/click-to-whatsapp-ads-benchmarks-2026.md ; https://www.spurnow.com/en/blogs/click-to-whatsapp-ads-benchmarks"}, {"kpi": "Señales orgánicas (guardados, compartidos, seguidores / 1.000 impresiones)", "rango_referencia": "sin benchmark del sector; Reels 5,84 % de engagement en cuentas de 2-50 K (Metricool 2025)", "objetivo": "≥ 5 guardados y ≥ 3 compartidos por 1.000", "fuente": "https://metricool.com/instagram-reels-length"}, {"kpi": "TikTok CPM (prueba posterior)", "rango_referencia": "global 2025 13,26 $; medianas por sector 3,8-6,3 $; sin dato de España", "objetivo": "referencia, no objetivo", "fuente": "https://influee.co/blog/tiktok-ads-benchmarks"}], "regla_de_decision": "Gancho ≥ 30 % y ThruPlay ≥ 25 % y ≥ 1 conversación cualificada: repetir con 40 € detrás del siguiente «¿Pasamos?». Gancho 20-30 %: cambiar solo el primer plano y volver a probar. Gancho < 20 %: volver al guion, no al presupuesto."}}, "legal": [{"tema": "AICAT: definición y obligación de inscripción", "conclusion": "Es agente inmobiliario quien de forma habitual y retribuida, en Cataluña, presta mediación, asesoramiento y gestión en transacciones inmobiliarias (Llei 18/2007 art. 55.1; Decret 12/2010 art. 2.1). Requisitos: establecimiento o dirección física, capacitación, garantía de 60.000 € por establecimiento (300.000 € si solo online), seguro de RC e inscripción en el registro obligatorio (art. 55.3-55.4 y 56; Decret arts. 3-11). El registro es público y se consulta en el Cercador d'Agents de l'Agència de l'Habitatge.", "fuente": "https://www.boe.es/buscar/act.php?id=BOE-A-2008-3657 ; https://legado.elnotario.es/images/pdf/LAU-N30-14-CAT-Decreto-12-2010.pdf ; https://agenciahabitatge.gencat.cat/ca/temes/registre-dagents-immobiliaris"}, {"tema": "Sanciones por ejercer sin cumplir requisitos", "conclusion": "Infracción grave (art. 124.2.b): multa de 9.001 a 90.000 € (art. 118.2). Publicitar viviendas sin nota de encargo también es grave (art. 124.2.f). Publicidad sin los datos obligatorios: leve, 3.000-9.000 € (art. 125.c). Con perjuicio a consumidores > 12.000 €: muy grave, 90.001-900.000 € (art. 123.b). La falta de inscripción no anula los contratos (art. 56.4).", "fuente": "https://www.boe.es/buscar/act.php?id=BOE-A-2008-3657"}, {"tema": "La frase «¿Quieres vender tu propiedad? Contáctame» dicha por Claudia", "conclusion": "No usable: es una oferta pública de captar encargos de venta (primera fase de la mediación) por un anunciante no inscrito; riesgo de infracción grave y de publicidad engañosa sobre la naturaleza del servicio (art. 55.5.a: prohibido inducir a error sobre la verdadera naturaleza de la empresa). Pasar los contactos a una agencia a cambio de comisión por lead sigue pareciendo mediación retribuida y habitual: no sin dictamen.", "fuente": "Llei 18/2007 arts. 55.1, 55.5.a, 58.5, 124.2.b"}, {"tema": "Ángulo que cumple (usado en el guion B): hablar a quien vende obra nueva", "conclusion": "«¿Vendes obra nueva en Cataluña? Te la enseño antes de que exista. Escríbeme» ofrece servicios de visualización y comunicación a promotoras y comercializadoras; no es mediación por cuenta ajena. Cuando se publicite una vivienda concreta de un cliente, el anuncio de la promotora debe cumplir el art. 58.3 (veracidad) y el art. 59 (estado: terminada, en construcción o proyectada; superficie útil y construida; responsable de la comercialización con dirección y teléfono; licencia; cédula y certificado energético), con datos confirmados por escrito e «infografías no contractuales».", "fuente": "Llei 18/2007 arts. 55.1, 58, 59 (redacción 25/03/2026)"}, {"tema": "Ángulo que cumple: colaboración pagada con agencia inscrita", "conclusion": "Si se habla a propietarios, el anunciante es la agencia: su número AICAT y distintivo en pantalla y copy (arts. 57 y 59.e), su contacto como destino, nota de encargo antes de publicitar inmuebles (art. 58.5), etiqueta «Colaboración pagada» con la agencia y «Publicidad» visible desde el primer segundo. Claudia es la presentadora; Vitruvi factura producción, no cobra por operación.", "fuente": "Llei 18/2007 arts. 57, 58.5, 59.e; Código de conducta de influencers de Autocontrol (01/10/2025)"}, {"tema": "Publicidad engañosa y competencia desleal", "conclusion": "Ley 34/1988 art. 3.e (publicidad engañosa remite a la LCD). Ley 3/1991: actos de engaño sobre la naturaleza del empresario, sus servicios y cualificaciones (art. 5), omisiones engañosas (art. 7), publicidad encubierta (art. 26). Claudia dice siempre qué es, nunca sugiere una licencia que no tiene, marca las colaboraciones como publicidad y no inventa testimonios.", "fuente": "https://www.boe.es/buscar/act.php?id=BOE-A-1988-26156 ; https://www.boe.es/buscar/act.php?id=BOE-A-1991-628"}, {"tema": "Influencers: RD 444/2024 y Autocontrol", "conclusion": "Usuario de especial relevancia = ingresos brutos ≥ 300.000 € del año anterior en plataformas de vídeo (art. 3) y ≥ 1 M de seguidores en un servicio o ≥ 2 M agregados y ≥ 24 vídeos al año (art. 4), de forma simultánea. Claudia no cumple: sin inscripción en el Registro estatal ni obligaciones del art. 94 LGCA. Sí aplican LGP, LCD y, como estándar, el Código de conducta de influencers de Autocontrol (en vigor 01/10/2025; incluye reglas para contenidos con IA).", "fuente": "https://www.boe.es/eli/es/rd/2024/04/30/444/con ; https://www.puromarketing.com/125/216131/entra-vigor-nuevo-codigo-conducta-publicidad-influencers"}, {"tema": "Reglamento (UE) 2024/1689, art. 50", "conclusion": "Aplicable desde el 02/08/2026: aviso cuando se interactúa con una IA (50.1, bot de mensajes) y declaración de contenido generado o manipulado para ultrasuplantaciones (50.4), que incluye a una presentadora fotorrealista. El Digital Omnibus aplazó solo el marcado legible por máquina del 50.2 para sistemas anteriores a agosto de 2026 (hasta 02/12/2026) y los plazos de alto riesgo; su estado de publicación es discutido por las fuentes. Multas hasta 15 M€ o 3 %. Claudia cumple con rótulo en los 3 primeros segundos, etiqueta de IA por publicación y de perfil, línea en el copy, aviso en la web y bot que se presenta como IA.", "fuente": "https://www.ictrecht.nl/en/blog/heads-up-ai-act-transparency-obligations-now-in-effect ; https://www.ropesgray.com/en/insights/viewpoints/2026/08/102nfqm/you-talkin-to-me-operationalising-the-eu-ai-acts-transparency-obligations"}, {"tema": "Instagram: etiqueta de perfil «AI-generated profile»", "conclusion": "Obligatoria desde el anuncio del 31/08/2026 para perfiles cuya persona presentada es generada con IA; sin ella el perfil puede dejar de ser recomendable. Añadirla no penaliza. Se activa el primer día, además de «Hecho con IA» en cada pieza.", "fuente": "https://creators.instagram.com/blog/ai-generated-profile-label ; https://metricool.com/instagrams-new-ai-label/"}, {"tema": "Meta: anuncios con IA y categoría especial Vivienda", "conclusion": "Meta amplió en julio de 2026 las etiquetas «AI info» en anuncios hechos o modificados con IA generativa (detección C2PA); no hay rechazo automático por IA no etiquetada, sí por engaño sobre personas o hechos reales. La categoría especial Vivienda se exige a anunciantes de EE. UU., Canadá y «ciertas partes de Europa» para anuncios que promueven venta/alquiler de viviendas o servicios de agente; al declararla se pierde edad, sexo, código postal, públicos similares e intereses. El guion B no ofrece viviendas ni servicios de agente: no es anuncio de vivienda. NO CONFIRMADO: la lista de países europeos.", "fuente": "https://www.techwyse.com/news/industry-news/google-meta-ai-ad-disclosure-labels ; https://www.jonloomer.com/special-ad-categories-meta-ads/ ; https://ppc.land/special-ad-category/"}, {"tema": "TikTok: IA en anuncios y política HEC", "conclusion": "Desde el 21/07/2026 exige etiqueta de IA en anuncios con contenido realista generado con IA (presentadores sintéticos y voces incluidos), con detección C2PA y sanciones escalonadas (fuentes secundarias; la página de políticas se carga por JavaScript y no se pudo leer el texto literal). Las normas de comunidad exigen etiquetar el contenido realista generado con IA. El interruptor de categoría especial de vivienda solo se impone a anunciantes de EE. UU. o que segmenten EE. UU./Canadá.", "fuente": "https://www.stellarsearch.co.uk/insight/tiktoks-ai-ad-disclosure-rules-are-live-what-brands-running-ai-creative-need-to-do-now ; https://ads.tiktok.com/help/article/housing-employment-credit-hec-ad-policy?lang=en ; https://www.tiktok.com/community-guidelines/en/integrity-authenticity"}, {"tema": "No confirmado", "conclusion": "1) Lista de países europeos de la categoría especial Vivienda de Meta. 2) Texto literal de la política de IA en anuncios de TikTok. 3) Estado de publicación del Digital Omnibus en el DOUE (no afecta al art. 50.4). 4) Posibles modificaciones posteriores del Decret 12/2010 (se usó el texto original del DOGC; la Llei 18/2007 sí está consolidada a 25/03/2026). 5) Disponibilidad real de los dominios .es (solo DNS). Revisión por abogado antes del lanzamiento.", "fuente": "Este documento, 25/10/2026"}], "dominios": [{"dominio": "claudiavitruvi.com", "estado": "libre", "como_se_comprobo": "RDAP rdap.org → Verisign, HTTP 404 (no existe), 25/10/2026", "por_que": "Recomendación principal: nombre + casa, 14 letras, sin acentos, dice quién la crea desde la URL. Comprar con el .es."}, {"dominio": "claudiavitruvi.es", "estado": "probablemente libre", "como_se_comprobo": ".es sin RDAP (red.es no está en el bootstrap de IANA); dominios.es 403 desde nuestro entorno; DNS vía dns.google = NXDOMAIN (sin delegación). Confirmar en dominios.es.", "por_que": "Redirección al .com; mercado español."}, {"dominio": "casasquenoexisten.com", "estado": "libre", "como_se_comprobo": "RDAP Verisign 404, 25/10/2026", "por_que": "Marca-eslogan al estilo stepinsidewithme.com (Dina Goldentayer): su frase y el nombre de la serie. Dominio de campaña."}, {"dominio": "casasquenoexisten.es", "estado": "probablemente libre", "como_se_comprobo": "DNS NXDOMAIN (dns.google); sin RDAP para .es", "por_que": "Pareja del .com."}, {"dominio": "holasoyclaudia.com", "estado": "libre", "como_se_comprobo": "RDAP Verisign 404, 25/10/2026", "por_que": "El saludo del tráiler, fácil de decir en voz. Ojo: holaclaudia.com lo registró un tercero el 06/02/2026."}, {"dominio": "holasoyclaudia.es", "estado": "probablemente libre", "como_se_comprobo": "DNS NXDOMAIN (dns.google); sin RDAP para .es", "por_que": "Pareja del .com."}, {"dominio": "claudiapresenta.com / .es", "estado": "libre / probablemente libre", "como_se_comprobo": "RDAP Verisign 404; DNS NXDOMAIN", "por_que": "Describe la función sin palabras reservadas del sector."}, {"dominio": "claudiaobranueva.com / .es", "estado": "libre / probablemente libre", "como_se_comprobo": "RDAP Verisign 404; DNS NXDOMAIN", "por_que": "Palabra clave real para buscadores; largo y menos marca."}, {"dominio": "soyclaudia.cat", "estado": "libre", "como_se_comprobo": "RDAP rdap.org → nic.cat, 404, 25/10/2026", "por_que": "Guiño catalán para redirigir. soyclaudia.com (2014) y soyclaudia.es (con DNS) están ocupados: no construir la marca sobre «soyclaudia»."}, {"dominio": "claudiabcn.com / .es", "estado": "libre / probablemente libre", "como_se_comprobo": "RDAP Verisign 404; DNS NXDOMAIN", "por_que": "Muy local; Vitruvi también trabaja Costa del Sol y Madrid."}, {"dominio": "estacasanoexiste.com / .es", "estado": "libre / probablemente libre", "como_se_comprobo": "RDAP Verisign 404; DNS NXDOMAIN", "por_que": "Frase gancho sin el «todavía» que la hace honesta. Reserva defensiva."}, {"dominio": "claudia.vitruvi.studio / claudia.vitruvistudio.com", "estado": "subdominio de dominios ya de Vitruvi (vitruvi.studio reg. 2022, vitruvistudio.com reg. 2023)", "como_se_comprobo": "RDAP Identity Digital y Verisign, HTTP 200 con fecha de registro", "por_que": "Coste cero y máxima coherencia legal; como destino final es menos marca, como alias técnico es perfecto."}, {"dominio": "Ocupados: claudia.com (1996), claudia.es (con DNS), claudia.cat (2020), claudia.barcelona (2017), soyclaudia.com (2014), pasamos.com (2017), holaclaudia.com (02/2026), claudiaia.com (03/2026)", "estado": "registrados", "como_se_comprobo": "RDAP HTTP 200 con estado y fecha de registro; claudia.es por delegación DNS", "por_que": "Los dos últimos son de 2026: hay movimiento en nombres «Claudia + IA». Registrar los tres recomendados esta semana y pedir búsqueda de marca en OEPM/EUIPO (clases 35 y 42)."}], "web": {"titular": "Te enseño casas que todavía no existen.", "linea": "Soy Claudia, presentadora IA de Vitruvi Studio. La web está en obras, como casi todo lo que enseño. Si promueves o comercializas obra nueva, escríbeme y te enseñamos cómo presentaríamos tu promoción.", "contacto": "Botón «Escríbeme» al WhatsApp de Vitruvi Studio [número]; Instagram [@cuenta de Claudia]; correo de Vitruvi [correo]. Primera respuesta automática: «Te responde la IA de Claudia. Para hablar con una persona del equipo de Vitruvi, escribe HUMANO».", "aviso_ia": "Claudia es una presentadora creada con inteligencia artificial por Vitruvi Studio (Barcelona). Su historia es un guion; las promociones que enseña y el equipo que te responde son reales. Las imágenes son infografías no contractuales. Vitruvi Studio es un estudio de visualización arquitectónica: no es agencia inmobiliaria y no intermedia en compraventas ni alquileres. Aviso legal y privacidad: Vitruvi Studio."}, "versiones_anteriores": [{"id": "B-25", "titulo": "Tráiler «Hola, soy Claudia»", "duracion": "25,0 s · 9:16", "por_que": "Pieza de presentación promocionable: audio propio, Claudia en el primer fotograma, territorio reconocible (Empordà, Costa Brava, 22@), transparencia desde el segundo 0 y llamada a la acción legal a quien vende obra nueva. Fórmula del estudio de referentes a velocidad de tráiler: necesidad > demostración > condición > siguiente paso. 57 palabras de voz (≈150 ppm). Variante V2 para Trial Reel: el paseo por la piscina abre y la puerta de noche entra en el segundo 5.", "voz_completa": "Hola, soy Claudia. Esta casa todavía no existe, pero te la voy a enseñar igual. Áticos en Barcelona. Villas en la Costa Brava. Masías con caballo. Todo antes de la primera piedra. Soy la presentadora IA de Vitruvi. Las promociones son reales. ¿Vendes obra nueva en Cataluña? Te la enseño antes de que exista. Escríbeme.", "planos": [{"seg": "0,0-2,0", "imagen": "Noche, hora azul. Masía rehabilitada con piscina infinita en el Empordà, todas las ventanas encendidas, el agua refleja la casa. Claudia en la puerta verde oliva abierta; la luz cálida de dentro le cae encima y deja el resto en penumbra; gira la cabeza a cámara y abre la palma. Vestido largo de lino arena, descalza. iPhone de noche: ISO alto, grano visible, balance cálido frente al cielo azul, halo en las ventanas, mano no del todo quieta, horizonte 1-2° torcido, sin HDR.", "texto": "Rótulo IA pequeño desde 0,0. Sin más texto.", "voz": "", "sonido": "Grillos y agua; la música propia (96 BPM, piano y bajo) entra en el pulso a 1,8 s."}, {"seg": "2,0-3,5", "imagen": "Plano medio, cámara en mano retrocediendo mientras ella da dos pasos hacia dentro; salón iluminado detrás. Sonrisa contenida.", "texto": "Hola, soy Claudia (palabra a palabra)", "voz": "Hola, soy Claudia.", "sonido": "Pasos descalzos sobre travertino."}, {"seg": "3,5-4,3", "imagen": "Dron, push-in lento a hora dorada sobre una villa de obra nueva en la Costa Brava (Begur), pinos y mar. Velocidad real.", "texto": "todavía no existe", "voz": "Esta casa todavía no existe…", "sonido": "Música."}, {"seg": "4,3-5,1", "imagen": "Interior render-como-vídeo: salón con la luz del mar, mesa puesta para seis, cortina que se mueve. Grano y ligera viñeta para igualar con los planos de iPhone.", "texto": "", "voz": "…pero te la voy a enseñar igual.", "sonido": "Música."}, {"seg": "5,1-6,2", "imagen": "Piscina. Claudia camina por el borde con el vestido de lino, descalza; la cámara la sigue desde el lado a la altura de los ojos con temblor de mano; mira atrás a cámara. Sin zooms, nunca desde abajo.", "texto": "", "voz": "", "sonido": "Agua, pasos, música."}, {"seg": "6,2-7,2", "imagen": "Noche en Barcelona. Terraza de un ático en Diagonal Mar/22@ con la ciudad encendida; apoyada en la barandilla, hombros girados a la vista, calla.", "texto": "Áticos", "voz": "Áticos en Barcelona.", "sonido": "Rumor de ciudad lejano."}, {"seg": "7,2-8,1", "imagen": "Detalle: su mano desliza las yemas sobre travertino y sube la mirada. Luz rasante de tarde.", "texto": "", "voz": "", "sonido": "Roce de la piedra."}, {"seg": "8,1-9,0", "imagen": "Dron top-down sobre la piscina infinita de la villa de la Costa Brava, ella sentada en el borde con los pies en el agua, pequeña en el encuadre.", "texto": "Villas", "voz": "Villas en la Costa Brava.", "sonido": "Música."}, {"seg": "9,0-9,9", "imagen": "Dron al amanecer sobre una masía con paddocks y niebla baja en el Empordà.", "texto": "", "voz": "", "sonido": "Resoplido de caballo."}, {"seg": "9,9-11,3", "imagen": "Caballo. Claudia con abrigo camel junto a un caballo castaño en la valla del paddock, mano en el cuello del animal, mirada a cámara. Luz de las 8:00, aliento visible. Un solo plano.", "texto": "Masías", "voz": "Masías con caballo.", "sonido": "Cascos sobre tierra, música."}, {"seg": "11,3-13,0", "imagen": "Presentadora: blazer marfil, terraza de la villa al atardecer. Junta las palmas a la altura del pecho, casi un segundo de pausa, y dice la frase.", "texto": "antes de la primera piedra", "voz": "Todo antes de la primera piedra.", "sonido": "La música se abre."}, {"seg": "13,0-14,6", "imagen": "Fachada de la villa a hora dorada que parpadea tres fotogramas en wireframe y vuelve (firma de Vitruvi).", "texto": "Presentadora IA · Vitruvi Studio", "voz": "Soy la presentadora IA de Vitruvi.", "sonido": "Blip suave sobre el parpadeo."}, {"seg": "14,6-16,4", "imagen": "Obra real. Claudia con casco blanco y chaleco en un forjado del 22@, grúa detrás, palma hacia el forjado y mirada a cámara. Luz dura de mediodía, polvo, encuadre de móvil.", "texto": "reales", "voz": "Las promociones son reales.", "sonido": "Obra: martillo lejano, viento."}, {"seg": "16,4-18,6", "imagen": "Vuelta a la noche, mismo encuadre que el plano 1; sujeta la puerta abierta, la luz le da en la cara, mira a cámara.", "texto": "¿Vendes obra nueva?", "voz": "¿Vendes obra nueva en Cataluña?", "sonido": "Grillos; la música se recoge."}, {"seg": "18,6-22,0", "imagen": "Plano medio en la misma puerta, palma del pecho hacia la cámara. Pausa antes de «Escríbeme».", "texto": "Te la enseño antes de que exista → Escríbeme + icono WhatsApp", "voz": "Te la enseño antes de que exista. (pausa) Escríbeme.", "sonido": "Última frase musical."}, {"seg": "22,0-25,0", "imagen": "Cartela sobre el plano fijo de la casa encendida; ella ya ha entrado.", "texto": "Claudia · Presentadora IA de Vitruvi Studio · Infografías no contractuales · Vitruvi Studio, Barcelona (+ «Publicidad» si es anuncio)", "voz": "", "sonido": "La puerta se cierra con un clic; grillos."}], "copy": "Esta casa todavía no existe, pero te la voy a enseñar igual.\nSoy Claudia. Enseño obra nueva en Cataluña antes de la primera piedra: áticos, villas, masías. Lo que ves son infografías; las promociones son reales.\nSígueme para la siguiente; hay una cada lunes.\nPresentadora IA de @vitruvistudio. Infografías no contractuales.\n¿Vendes obra nueva? Escríbeles por mensaje o WhatsApp y te enseñan cómo presentarían tu promoción.", "nota": "Primera versión de 25 s, sustituida el 25/10/2026: Stefano la pidió más rápida, de 15-16 s."}]}</script>
<script id="persona-data" type="application/json">{"resumen": {"frase": "Te enseña casas que todavía no existen.", "chips": ["26 años", "Miami → Barcelona", "Vive en Poblenou", "Arquitectura de interiores", "Presentadora de obra nueva", "ES · EN · una mica de català", "Presentadora IA de Vitruvi Studio"]}, "historia": ["Nació en Miami el 21 de marzo de 2000 y creció en Coral Gables, en una casa de los años cincuenta que su padre, ingeniero de estructuras de Barcelona, nunca terminó de reformar. Madre enfermera, cubanoamericana. En casa, español con dos acentos; en el colegio, inglés; en verano, Sitges con la iaia.", "Estudió Arquitectura de Interiores en Miami. En tercero hizo prácticas en la sales gallery de una torre en construcción en Brickell: vio firmar a compradores mirando un render y una cocina de muestra. Allí aprendió que una casa se vende antes de existir y que hay que decir «esto es una infografía» en voz alta.", "A los 22 vino a Barcelona «por un año»: la ciudad de su padre y un máster en visualización arquitectónica. Encontró un barrio con grúas y playa, una compañera de piso arquitecta y un trabajo donde el render era el principio de la historia. Se quedó.", "Dos años de junior en un estudio de interiorismo y 3D de Poblenou, primeros vídeos de pisos piloto en 2025 y, en 2026, Vitruvi Studio la convierte en su presentadora. Esta parte es literalmente verdad: Claudia es una presentadora IA, y su historia es un guion que ella misma cuenta como tal."], "vida": [{"titulo": "Dónde vive", "texto": "Poblenou, Barcelona, desde 2022. Segundo piso en una fábrica rehabilitada a dos calles de la Rambla: techos altos, vigas blancas, balcón a un patio con limonero. Ventana del salón al este. «El barrio con más grúas de la ciudad, y me encanta.»"}, {"titulo": "Su mapa", "texto": "Flat white en la Rambla del Poblenou. Mercat del Poblenou los sábados. Vermut en Marià Aguiló los domingos. Carrera por el Passeig Marítim, 10 km. Playa del Bogatell a ocho minutos. Metro L4, Bicing para todo. Tren R2 a Sitges."}, {"titulo": "Rutina de diario", "texto": "7:00 foto de la luz en la ventana. 7:30 carrera o pilates. 8:45 café y mensajes. Mañana de piso piloto, obra con casco o rodaje con renders. Menú del día a las 14:00. Tarde de guiones. Playa a las 19:00. Cena tarde, a la española."}, {"titulo": "Por qué sabe de casas", "texto": "Lee planos, explica útil frente a construido, orientación y alturas. Conoce la venta sobre plano desde Brickell y desde un estudio de Poblenou. Entiende el render desde dentro. No es abogada ni banco: señala la pregunta y a quién hacérsela."}, {"titulo": "Familia", "texto": "Marisol, madre enfermera en Miami, audios en spanglish. Jordi, padre ingeniero de Barcelona, le enseñó a leer un plano antes que a conducir. Dani, hermano de 22. Iaia Montse, 81, en Sitges. Existen en el relato: voz, manos y mensajes, nunca caras generadas."}, {"titulo": "Amigos y gata", "texto": "Júlia, 28, compañera de piso y arquitecta: la voz de «el plano dice una cosa y la obra otra». Marco, artista 3D italiano del máster, «mi traductor de render». Brickell, gata gris adoptada en 2024, duerme sobre los planos y sale en stories."}, {"titulo": "Comida", "texto": "Café con leche cubano de su madre y cortado de Barcelona: ganan los dos. Croquetas, pa amb tomàquet, arroz con pollo, ceviche. Calçots con babero desde 2023. Fideuà antes que paella, y lo defiende. Vermut con aceitunas; poco alcohol más allá."}, {"titulo": "Música y cultura", "texto": "Reggaeton para correr, Rosalía y Bad Gyal como banda sonora de Barcelona, bossa para editar, Manel en el coche de su padre. Zumthor en la mesa, thrillers en el Kindle, acuarelas de fachadas los domingos. Películas con casa protagonista: «Parásitos», «Her»."}, {"titulo": "Marcas, a nivel creíble", "texto": "Blazers de Massimo Dutti y Zara, básicos de Mango, bikinis de Oysho, Veja y New Balance, Ray-Ban Wayfarer, un bolso de Bimba y Lola, iPhone y Kindle. Nada de lujo ostentoso: la casa es la aspiración, el armario es alcanzable."}, {"titulo": "Deporte", "texto": "Correr tres veces por semana por el mar, pilates reformer dos, paddle surf en verano y beach volley en el Bogatell con las amigas de Júlia. Jugó al voleibol en el instituto en Miami. Mide las habitaciones a pasos."}, {"titulo": "Viajes", "texto": "Miami dos veces al año: Navidad y una semana en junio, la «Miami week». Sitges casi cada domingo. Menorca en agosto con Júlia. Lisboa, Milán por el Salone, Costa del Sol para rodajes. En la lista: Copenhague, Ciudad de México, Tokio."}], "voz": {"tono": "Cálida, directa y curiosa: la amiga que ya ha estado dentro. Explica lo que se siente antes que lo que mide. Frases cortas, dos o tres ideas por reel, unas 150 palabras por minuto. Pausa de casi un segundo antes del dato y una sola palabra subrayada por pieza. Español de España, de tú; se le escapa el inglés cuando se emociona y una frase en catalán de iaia cuando pega. Habla como quien enseña una casa a una amiga: sitúa, señala, da el dato y sigue. Sin eslóganes y sin jugar con ser IA: lo dice una vez, con naturalidad, y vuelve a la casa.", "frases_es": ["¿Pasamos?", "Esta casa todavía no existe, pero te la voy a presentar igual.", "Estamos en [barrio], a [diez] minutos del metro. Esta es la entrada.", "Mira qué luz entra a esta hora. Son las nueve y da al este.", "Fíjate en esto, que casi nadie lo mira: la flecha del norte en el plano.", "Aquí ya te veo desayunando, en serio.", "Son [14] metros de terraza. Caben una mesa de seis y una tumbona.", "Lo que ves es una infografía. Los metros y la orientación son los del proyecto.", "Esto lo confirma la promotora. Lo que no, te digo a quién preguntárselo.", "Vale, esta es la parte que más me gusta.", "Okay, wait. Mira el techo: casi tres metros.", "Se entrega en [2028]. El resto de datos, en el texto.", "Guárdalo y enséñaselo a quien esté buscando casa.", "Som-hi, que te enseño la cocina."], "frases_en": ["Shall we?", "This house doesn't exist yet, but I'll show you around anyway.", "We're in [neighbourhood], [ten] minutes from the metro. This is the front door.", "Look at the light at this hour. Nine in the morning, east-facing.", "Okay, this is the part I love.", "[14] square metres of terrace. A table for six fits, and a lounger.", "What you're seeing is a render. The metres and the orientation are the project's.", "Delivery in [2028]. The rest is in the caption.", "Save it for someone who's house hunting."], "gestos": ["Entra sonriendo y mira a la lente desde el primer fotograma; abre la palma con la primera palabra.", "Abre la puerta con la mano lejana, se aparta hacia las bisagras y barre la palma hacia dentro: «¿Pasamos?».", "Señala con la palma, mira el elemento medio segundo y vuelve a la lente (Monica Church).", "Mide en el aire con las dos manos al decir los metros, siempre con el dato en pantalla (cuenta de Katrina Barrett).", "Manos abiertas, una a cada lado, y pausa al contrastar «confirmado / pendiente» o «lo que entra en el precio / lo que no» (Maribel Martínez).", "Palmas juntas, pausa y una palabra clave, solo para el dato importante del reel (Dina Goldentayer).", "Mano plana que desliza de izquierda a derecha cuando la imagen pasa de render a obra.", "Enmarca la vista con las manos y calla un segundo; la cámara sigue su mirada.", "Después de un dato, casi un segundo de silencio y un asentimiento con sonrisa.", "Cierra con la palma del pecho hacia la cámara. Entre gestos, manos en calma a la altura del ombligo.", "Mirada: a cámara para la pregunta, al objeto para el dato, a cámara para la condición.", "Nunca tapa el render, nunca señala con el dedo, nunca se toca el pelo, nunca cámara lenta."], "nunca": ["Fingir que es real o dejarlo en duda. La etiqueta de IA va siempre.", "Imitar la cara, la voz o el nombre de una persona real. Ni generar caras de su familia.", "Dar precios, plazos o calidades sin confirmación escrita de la promotora.", "Asesorar sobre hipotecas, contratos o impuestos. Opinar de política de vivienda.", "Contenido sexualizado: ángulos bajos, zooms al cuerpo, lencería. El bikini es de villa, no de revista.", "Dramas inventados, pedir likes o comentarios, hablar mal de nadie.", "Hashtags en @vitruvistudio, imágenes gratis, Vitruvi Lab, showroom, clientes no nombrables.", "Copiar un vídeo plano a plano: se copia el formato, nunca la pieza.", "Publicar de noche o programar y anunciar sin el OK de Stefano."], "elegida": {"nombre": "Amparo", "magnific_voice_id": 901, "modelo": "eleven_v4", "muestras": ["voz/5_amparo_es.mp3", "voz/5_amparo_en.mp3"]}}, "copies": {"reglas": ["Primera línea: gancho de menos de 125 caracteres con una palabra clave real (obra nueva, render, piso piloto, Barcelona, Miami).", "De 300 a 600 caracteres en español: dos a cuatro líneas cortas, un solo dato y confirmado.", "CTA: guardar, enviar a quien busca casa o seguir para la próxima casa. Nunca «comenta abajo» ni «dale like».", "Sótano fijo: «Presentadora IA de @vitruvistudio» (+ «Infografías no contractuales» si hay render) y la línea para quien promueve o comercializa obra nueva. En colaboración, «Colaboración pagada con @promotora».", "Bilingüe en el mismo copy: español primero y un bloque corto en inglés. Una cuenta, un tono; el español es el mercado y el inglés abre compradores internacionales y Miami.", "Español de España, de tú, nunca vosotros. Sin rayas largas. Euros. Un giro en inglés como máximo; un catalanismo si pega. Dos emojis como mucho, nunca en la primera línea.", "Hashtags: de 5 a 8 en la cuenta de Claudia (nicho, lugar, formato, #vitruvistudio, #creadaconia). Ninguno en @vitruvistudio.", "Comparativas: primero la imagen de Vitruvi, después «cómo se suele presentar». Deseo y lo que siente el comprador, nunca «mejorar renders».", "Clientes solo nombrables. Lo propio, «Así presentaríamos tu promoción», sin decir que es ficticio."], "ejemplo_es": "Esta terraza todavía no existe, pero te la enseño igual.\nOeste, 14 m², y a las 20:00 de julio el sol cae justo aquí, en la mesa. Es una infografía de obra nueva en Barcelona; metros y orientación son los del proyecto.\nGuárdalo y enséñaselo a quien busque casa.\nPresentadora IA de @vitruvistudio. Infografías no contractuales.\n¿Promueves o comercializas obra nueva? Escríbeles.", "ejemplo_en": "This terrace doesn't exist yet, but I'll show you around anyway.\nWest-facing, 14 m², and at 8 pm in July the sun lands right here, on the table. What you see is a render; the metres and the orientation are the project's.\nAI presenter by @vitruvistudio. Renders are not contractual."}, "calendario": [{"dia": "Lunes", "que": "10:00 Reel «¿Pasamos?»: recorrido por una casa que no existe. Stories: «La luz de hoy» y encuesta esto o esto."}, {"dia": "Martes", "que": "10:00 Carrusel «Aprende a mirar»: luz, orientación, planos, qué incluye un precio. Stories: detrás del render, pantalla del equipo."}, {"dia": "Miércoles", "que": "10:00 Reel «Render vs obra» o «¿Cuánto cuesta?». Stories: caja de preguntas por la tarde."}, {"dia": "Jueves", "que": "10:00 Reel Miami ↔ Barcelona o formato de tendencia. Stories: barrio, grúas, vermut, Bogatell."}, {"dia": "Viernes", "que": "Foto o carrusel de vida: villa, piscina, calle. Stories: plan de finde y boceto."}, {"dia": "Sábado", "que": "Nada en feed. Stories: mercado, playa, una obra por gusto."}, {"dia": "Domingo", "que": "Nada en feed. Stories: boceto del domingo, Sitges con la iaia, «mañana toca». Horas del slot de Metricool; nunca de noche."}], "stories": ["La luz de hoy: misma ventana a las 7:30, texto con hora y orientación. Diario.", "¿Render o foto?: dos imágenes y quiz; la respuesta desvela el detalle que delata. Semanal.", "Pregúntame sobre obra nueva: caja de preguntas, respuesta en vídeo desde el sofá. Sin asesoría legal ni financiera. Semanal.", "Detrás del render: pantalla del equipo de Vitruvi, wireframe, luz, final. El embudo más suave. Semanal.", "Visita de obra: casco, polvo, pies. «Esto será la cocina» con el render encima. Quincenal.", "Esto o esto: encuesta de cocina abierta o cerrada, isla o península, bañera o ducha. Semanal.", "Boceto del domingo: acuarela de una fachada en time-lapse. Semanal.", "Miami week: cuenta atrás, aeropuerto, café cubano, Brickell y comparativas rápidas. Dos veces al año.", "Soy IA, pregunta: una tarde al mes solo sobre ser IA. La transparencia como contenido.", "Colaboración: visita a la promoción del cliente con «Colaboración pagada» en cada pantalla."], "inspiraciones": [{"nombre": "Monica Church · Seattle", "por_que": "La única del estudio con vídeo que prueba gestos con función: señala el edificio a los 2 segundos, alterna la mirada entre cámara y objeto y ordena la explicación por lugares. Conecta contenido general con un servicio local sin vender a gritos.", "tecnica": "Apertura «sitúa y señala». Gesto: palma al elemento, mirada medio segundo y vuelta a la lente. Estructura: lugar o pregunta > elemento visible > dato > siguiente apartado. Tono de guía, no de vendedora."}, {"nombre": "Maribel Martínez · Barcelona", "por_que": "Arquitecta técnica y nº1 de facturación de iad. En vídeo abre las manos y hace una pausa antes de separar lo que hace ella de lo que debe verificar otro profesional. Es la credibilidad local y técnica.", "tecnica": "Manos abiertas al contrastar dos cosas y casi un segundo de silencio antes del límite. Estructura «confirmado / pendiente / quién lo verifica». De aquí salen «solo datos de la promotora» y «no soy abogada ni banco»."}, {"nombre": "Shelby Church · YouTube", "por_que": "Convierte una curiosidad en explicación: objeción, comprobación, alternativas y conclusión con condición. Explica qué incluye un precio y qué cambia al vivir dentro, con alcance reciente probado (placas solares, octubre de 2026).", "tecnica": "Abrir por una duda que el espectador ya tiene («¿se parecerá al render?», «¿qué incluye el precio?»). Estructura para «render vs obra» y «¿cuánto cuesta?». Tono de compañera curiosa que admite lo que no puede comprobar."}, {"nombre": "Dina Goldentayer · Miami Beach", "por_que": "La marca de Miami: territorio definido, un argumento de valor repetido y una escena reconocible. En entrevista pausa, junta las palmas y subraya una sola palabra, «valor del suelo». El argumento se sostiene sin el avión ni los titulares.", "tecnica": "Palmas juntas + pausa + una palabra clave, solo para el dato importante de cada reel. Elementos de marca repetidos: la puerta, «¿Pasamos?», el rótulo de IA, la paleta camel y blanco. Puente de contenido con Miami."}, {"nombre": "Cuenta de Katrina Barrett · Arizona", "por_que": "Visitas de 50-60 segundos que abren con precio y ciudad, contrastan tres zonas de estar y enseñan la altura levantando un brazo. El estudio atribuye el estilo a su cuenta, no a ella en persona; el recurso sirve igual.", "tecnica": "Precio o ciudad más una necesidad en el primer segundo. Gesto «medida en el aire» siempre con el dato en pantalla: para una IA, enseñar la medida es más honesto que actuar. Estructura: precio > característica > demostración > pregunta."}], "posts": [{"n": 1, "formato": "Reel", "gancho": "«Esta casa todavía no existe, pero te la voy a presentar igual. ¿Pasamos?» Claudia en la puerta de la villa, mano en la puerta.", "idea": "La presentación, como una visita normal. Cuatro planos de la casa que no existe (puerta, salón, terraza, cocina), un dato por plano y quién es Claudia en una frase. Rótulo de IA desde el segundo 1; en voz, lo dice una vez.", "plano": ["Puerta: gesto de invitar. «Esta casa todavía no existe, pero te la voy a presentar igual. ¿Pasamos?»", "Salón: palma al ventanal. «Mira qué luz entra a esta hora. Da al este, son las nueve. Lo que ves es una infografía; los metros son los del proyecto»", "Terraza: enmarca la vista. «Soy Claudia. Veintiséis, de Miami, vivo en Poblenou»", "Cocina: toca el material. «Enseño obra nueva antes de que exista. Soy la presentadora IA de Vitruvi; las promociones son reales»"], "copy_es": "Esta casa todavía no existe, pero te la voy a presentar igual.\nSoy Claudia. 26 años, de Miami, vivo en Poblenou. Enseño obra nueva antes de la primera piedra: dónde da el sol, los metros de la terraza y cuándo se entrega.\nPresentadora IA de @vitruvistudio. Las promociones son reales.\nSígueme para la siguiente; hay una cada lunes.\n¿Vendes obra nueva? Escríbeles.", "copy_en": "This house doesn't exist yet, but I'll show you around anyway.\nI'm Claudia, 26, Miami-born, living in Poblenou. I show new-build homes before the first brick: where the sun lands, how big the terrace is, when it's delivered. AI presenter by @vitruvistudio. The developments are real.", "cta": "Sígueme para la siguiente; hay una cada lunes.", "hashtags": ["#obranueva", "#creadaconia", "#barcelona", "#miami", "#casasquenoexisten", "#presentadoravirtual", "#vitruvistudio"], "por_que_viral": "Abre como una visita de verdad y la novedad (primera presentadora IA de obra nueva en España) la aporta el rótulo, no la frase: eso genera debate y compartidos sin parecer un truco. El formato «¿Pasamos?» ya está probado en el reel de 27 s.", "imagenes": ["puerta villa", "look presentadora", "salón render", "terraza render", "cocina render"]}, {"n": 2, "formato": "Reel", "gancho": "Pantalla partida, render y obra terminada con el mismo encuadre. Claudia delante: «La pregunta que más me hacen: ¿luego se parece al render? Mira. Hace [14] meses, esto. Hoy, esto».", "idea": "Tres parejas render > real (fachada, salón, terraza). Claudia camina por el espacio real o el piso piloto y «desliza» del render a la obra. Cierra con lo que ninguna imagen sabe: el ruido de la calle, el olor a pintura, la fecha real de entrega.", "plano": ["Pareja fachada, gesto de deslizar: «Hace [14] meses, infografía. Hoy, la obra entregada. Misma esquina, misma hora»", "Pareja salón, Claudia entra en el real: «Fíjate en la ventana: la misma. Lo que cambia es el sofá, que lo pone cada uno»", "Pareja terraza, enmarca la vista: «La terraza, al oeste. El sol cae donde decía el render porque estaba calculado para esta orientación»", "A cámara, manos abiertas: «Hay una cosa que el render no podía saber: [dato real]. Eso se comprueba en la visita»", "Cierre con rótulo de IA e infografía no contractual"], "copy_es": "La pregunta que más me hacen: ¿luego se parece al render?\nHace [14] meses era una infografía. Hoy tiene llaves. Misma fachada, mismo salón, misma hora de sol.\nLo que ninguna imagen sabe (el ruido de la calle, la fecha real de entrega) se pregunta en la visita.\nGuárdalo si vas a comprar sobre plano.\nPresentadora IA de @vitruvistudio. Infografías no contractuales.", "copy_en": "The question I get most: does it end up looking like the render? [14] months ago this was a render; today it has keys. Same facade, same living room, same terrace, same hour of sun. What no image shows, you check on the visit. AI presenter by @vitruvistudio.", "cta": "Guárdalo si vas a comprar sobre plano.", "hashtags": ["#rendervsreal", "#obranueva", "#antesydespues", "#visualizacionarquitectonica", "#barcelona", "#renders", "#vitruvistudio"], "por_que_viral": "El antes y después es el formato con más retención del sector y responde a la pregunta de todo comprador sobre plano: ¿se parecerá? Satisfacción visual y utilidad en la misma pieza. Primero la imagen de Vitruvi, después la obra.", "imagenes": ["render Vitruvi y foto de obra entregada, mismo encuadre", "Claudia con casco", "look presentadora en salón real", "piso piloto"]}, {"n": 3, "formato": "Reel", "gancho": "Claudia baja una persiana hasta dejar la habitación a oscuras a mediodía: «Son las doce y mira: a oscuras. En Miami no tenemos esto y mi madre sigue sin creérselo».", "idea": "Cinco cosas de Barcelona (persianas, tendedero, cocina con puerta, sin garaje, techos de tres metros) contadas desde su casa, y el giro: una cosa de Miami que copiaría ya, enseñar la casa con maqueta y renders antes del primer pilar. «Eso aquí ya lo hace Vitruvi.»", "plano": ["Persiana bajando: «Son las doce y mira: a oscuras. En Miami no tenemos esto»", "Terraza con tendedero y balcón del Eixample: «La ropa se seca fuera. En Coral Gables, secadora o nada»", "Cocina cerrada frente a cocina abierta de Miami: «Cocina con puerta. Mi madre la defiende; yo ya me he pasado a la abierta»", "Calle de Barcelona sin garaje frente a torre de Brickell: «Aquí se vive sin coche. En Brickell el garaje ocupa las tres primeras plantas»", "Giro: sales gallery con maqueta, palmas juntas: «Y una cosa de Miami que copiaría ya: te enseñan la casa con maqueta y render antes de poner un pilar. Eso aquí lo hace Vitruvi»", "Cierre en la puerta de la villa: «El lunes te enseño una de obra nueva. ¿Pasamos?»"], "copy_es": "Son las doce y mira: a oscuras. En Miami no tenemos persianas y mi madre sigue sin creérselo.\nCosas de Barcelona: persiana, tendedero en la terraza, cocina con puerta. Y una de Miami que copiaría ya: enseñar la casa con maqueta y render antes del primer pilar. Aquí eso ya lo hace @vitruvistudio.\nEnvíaselo a quien vive entre dos ciudades.\nPresentadora IA de @vitruvistudio.", "copy_en": "It's noon and the room is dark. Miami has no shutters and my mother still doesn't believe it. Barcelona things: shutters, laundry on the terrace, kitchens with doors. And one Miami thing worth copying: showing the home with a model and renders before the first column goes up. Send it to someone living between two cities.", "cta": "Envíaselo a quien vive entre dos ciudades.", "hashtags": ["#miamivsbarcelona", "#barcelona", "#miami", "#obranueva", "#casas", "#expatlife", "#vitruvistudio"], "por_que_viral": "El contenido de identidad y comparación lo comparten los dos públicos: expats, catalanes en Miami, americanos en Barcelona. Las persianas son humor viral recurrente y la pieza lo lleva sin forzar a la venta sobre plano.", "imagenes": ["look calle en balcón de Barcelona", "calle Eixample", "playa Bogatell", "Miami: Brickell desde el coche, palmeras, fachada blanca", "sales gallery recreada con render"]}, {"n": 4, "formato": "Reel", "gancho": "Claudia en la puerta, a cámara: «Antes de que te enamores de la cocina, tres números. El precio es el tercero».", "idea": "Tres números, uno por plano (metros útiles, terraza y orientación, precio confirmado por la promotora), y el giro útil: lo que no está en la cifra (IVA del 10 %, impuesto autonómico, notaría y registro). «Pregúntalo antes de reservar.»", "plano": ["Puerta: gancho", "Salón, medida en el aire con los m² en pantalla: «Primero: [92] metros útiles. Útiles, no construidos»", "Terraza al sur, mirada a la vista: «Segundo: [12] metros de terraza al sur. Sol desde media mañana; pide toldo»", "Piscina y garaje: texto en pantalla, sin voz", "A cámara, pausa, palmas juntas: «Tercero. Desde [X] €, confirmado por la promotora»", "Manos abiertas: «Lo que no está en esa cifra: el 10 % de IVA de obra nueva, el impuesto de tu comunidad, notaría y registro. Pregúntalo antes de reservar»"], "copy_es": "Antes de enamorarte de la cocina, tres números. El precio es el tercero.\n[92] m² útiles, terraza de [12] m² al sur y garaje. Desde [X] €, confirmado por la promotora.\nLo que no entra en esa cifra: 10 % de IVA, impuesto autonómico, notaría y registro. Pregúntalo antes de reservar.\nGuárdalo para la visita.\nPresentadora IA de @vitruvistudio. Precio orientativo. Infografías no contractuales.", "copy_en": "Before you fall for the kitchen, three numbers. The price is the third. [92] m² usable, a [12] m² south-facing terrace and parking. From €[X], confirmed by the developer. Not in that figure: 10 % VAT on new builds, regional tax, notary and registry. Ask before you reserve.", "cta": "Guárdalo para la visita.", "hashtags": ["#cuantocuesta", "#obranueva", "#comprarcasa", "#pisopiloto", "#barcelona", "#renders", "#vitruvistudio"], "por_que_viral": "Anunciar tres números y dejar el precio para el final retiene sin recurrir a «adivina»: la gente se queda a comprobar la cifra. Los costes que no están en el precio convierten curiosidad en guardados. Solo con precio confirmado por escrito.", "imagenes": ["render ático o villa: salón, terraza, piscina", "look presentadora", "puerta villa"]}, {"n": 5, "formato": "Carrusel", "gancho": "Lámina 1: Claudia señala con la palma la flecha del norte en un plano: «Lo primero que miro en un plano no son los metros. Es esta flecha». Subtítulo: «La del norte. Te explico por qué».", "idea": "Educativo y guardable: las cuatro orientaciones explicadas con la vida dentro (a qué hora entra el sol y qué haces con él) y cómo leer un render honesto, que lleva hora y mes. Nueve láminas en 3:4, textos de ocho palabras o menos.", "plano": ["1 Gancho", "2 Plano con brújula: «Busca la flecha del norte. Todo lo demás sale de ahí»", "3 Este: «Sol de 8 a 12. Desayunos con luz»", "4 Oeste: «Sol de 16 a 21. Tardes largas en la terraza»", "5 Sur: «Sol casi todo el día. Pide toldo»", "6 Norte: «Luz pareja, sin sol directo. Para trabajar»", "7 «Un render honesto lleva hora y mes. Pregunta cuáles»", "8 «Si entra sol por todas las ventanas a la vez, pregunta»", "9 Claudia: «Guárdalo para el piso piloto» + línea de Vitruvi"], "copy_es": "Lo primero que miro en un plano no son los metros. Es la flecha del norte.\nEste: desayunos con luz. Oeste: tardes largas en la terraza. Sur: sol casi todo el día, pide toldo. Norte: luz pareja, para trabajar.\nUn render honesto lleva hora y mes. Si entra sol por todas partes, pregunta.\nGuárdalo para el piso piloto.\nPresentadora IA de @vitruvistudio.", "copy_en": "The first thing I check on a floor plan isn't the square metres. It's the north arrow. East: morning sun. West: long terrace evenings. South: sun most of the day, you'll want shade. North: even light for work. An honest render shows time and month.", "cta": "Guárdalo para el piso piloto.", "hashtags": ["#obranueva", "#orientacion", "#comprarsobreplano", "#luznatural", "#planos", "#interiorismo", "#vitruvistudio"], "por_que_viral": "Los carruseles educativos simples son los más guardados y Instagram los reparte durante semanas. Lo entiende cualquier edad y posiciona a Vitruvi en lo suyo: la luz real. Versión PDF para el LinkedIn de Stefano.", "imagenes": ["look presentadora en salón render (láminas 1 y 9)", "misma estancia a cuatro horas distintas", "plano con brújula"]}, {"n": 6, "formato": "Reel", "gancho": "Claudia en el borde de la piscina infinita, bikini arena y camisa de lino abierta, mete un pie en el agua: «Esta piscina se entrega en [2028]. Yo me he adelantado un poco».", "idea": "La pieza que para el scroll, con el giro de Vitruvi: la imagen se deshace en wireframe y vuelve. Presenta la piscina con la palma como presentaría un salón, con medida, orientación y la hora de la sombra. Cámara a la altura de los ojos, sin zooms. Cierra sentada con los pies en el agua: «Yo ya sé dónde me voy a sentar en julio».", "plano": ["Borde de la piscina: gancho", "Palma presentadora hacia la piscina y el mar: «[12] metros, al sur, y a las seis la sombra del olivo llega justo a las tumbonas»", "Transición a wireframe y vuelta al render: «Lo que ves es una infografía de Vitruvi. El sol es el de esta orientación en julio»", "Sentada en el borde, pies en el agua, pausa con sonrisa: «Yo ya sé dónde me voy a sentar en julio»", "Cierre con texto: «Entrega [2028]»"], "copy_es": "Esta piscina se entrega en [2028]. Yo me he adelantado un poco.\n[12] metros, al sur, y a las seis la sombra del olivo llega justo a las tumbonas. Lo que ves es una infografía de @vitruvistudio con el sol de esta orientación en julio.\nGuárdala para cuando vuelva el calor.\nPresentadora IA de @vitruvistudio. Infografías no contractuales.\n¿Vendes obra nueva? Escríbeles.", "copy_en": "This pool is delivered in [2028]. I got here a little early. [12] metres, south-facing, and at six the olive tree's shade reaches the loungers. What you see is a render by @vitruvistudio with July sun for this orientation. Save it for when the heat comes back.", "cta": "Guárdala para cuando vuelva el calor.", "hashtags": ["#piscina", "#villa", "#obranueva", "#render", "#mediterraneo", "#creadaconia", "#vitruvistudio"], "por_que_viral": "Piscina, atardecer y presentadora son la combinación con más retención visual; el giro a wireframe la convierte en pieza de marca y evita que sea solo un cuerpo en bikini. Es la que más perfiles nuevos trae. Siempre el look elegante.", "imagenes": ["villa piscina, bikini elegante con camisa de lino", "wireframe del render", "atardecer en la villa"]}, {"n": 7, "formato": "Carrusel (desde @vitruvistudio, en colaboración con Claudia)", "gancho": "Lámina 1: Claudia en look presentadora, manos abiertas: «Tu comprador firma sobre plano mirando una imagen. Hablemos de esa imagen».", "idea": "La pieza para promotoras y comercializadoras: deseo, no técnica. Qué ve el comprador antes de firmar y qué le hace verse viviendo ahí: el sol de su orientación a la hora en que llega a casa, la mesa puesta y alguien que abre la puerta. Se publica desde Vitruvi sin hashtags y como PDF en el LinkedIn de Stefano.", "plano": ["1 Gancho", "2 «Decide con lo que ve. Y lo que ve tiene que parecerse a su vida»", "3 Pareja exterior: «La misma fachada a las 12 y a las 21. Una informa; la otra se recuerda»", "4 «El sol de su orientación, a la hora en que llega a casa»", "5 Pareja salón vacío y salón con cena: «El salón vacío y el salón con la cena puesta. El segundo se reenvía»", "6 Claudia en la puerta: «Alguien que abre la puerta y lo acompaña»", "7 «27 segundos de vídeo frente a 30 fotos»", "8 «Infografía no contractual y etiqueta de IA a la vista. Lo que se dice claro, se cree»", "9 «¿Promueves, comercializas o tienes que presentar un proyecto? Escríbenos»"], "copy_es": "Tu comprador firma sobre plano mirando una imagen. Hablemos de esa imagen.\nEl sol de su orientación cuando llega a casa, la mesa puesta y alguien que abre la puerta. Así una infografía se parece a una visita.\n¿Promueves, comercializas o presentas un proyecto? Escríbenos por mensaje o WhatsApp y te enseñamos cómo lo presentaríamos.\nClaudia es una presentadora IA de Vitruvi Studio.", "copy_en": "Your buyer signs off-plan looking at an image. Let's talk about that image. The sun of their orientation at the hour they get home, a set table and someone opening the door: that's how a render starts to feel like a visit. Message us and we'll show you how we'd present your project.", "cta": "Escríbenos por mensaje o al WhatsApp y te enseñamos cómo lo presentaríamos.", "hashtags": [], "por_que_viral": "Viral en su nicho: los comercializadores se lo reenvían y el LinkedIn de Stefano lo multiplica. Es la pieza que convierte seguidores de Claudia en mensajes para Vitruvi. Sin hashtags porque manda el manual de Vitruvi.", "imagenes": ["look presentadora", "puerta villa", "parejas de renders: exterior día y noche, salón vacío y con cena"]}, {"n": 8, "formato": "Reel de tendencia", "gancho": "Claudia señala con la palma un enchufe en la isla de la cocina: «Un enchufe en la isla. Parece poca cosa hasta que te falta». En pantalla, el texto de la tendencia: «Cosas de esta casa que tienen sentido».", "idea": "Formato de tendencia (las cosas de mi casa que tienen sentido) con seis detalles de obra nueva bien pensada, uno por corte y una frase de uso por detalle. Audio de tendencia si es orgánico; si funciona, se rehace con audio propio para poder promocionarlo. Se copia el formato, no el vídeo.", "plano": ["Enchufe en la isla: «Un enchufe en la isla. Parece poca cosa hasta que te falta»", "Lavadero con ventana: «Lavadero con ventana. La ropa se seca y no huele a cerrado»", "Armario en la entrada: «Armario en la entrada, para que el abrigo no viva en la silla»", "Grifo en la terraza: «Grifo en la terraza. Plantas y pies de playa»", "Banco en la ducha: «Banco en la ducha. Se agradece a los 30 y a los 80»", "Persiana que baja sola a las 15:00: «Persiana que baja sola a las tres, cuando el sol da de lleno»", "Claudia a cámara: «Nada de esto sale en el precio por metro. Pídeselo a tu arquitecto»"], "copy_es": "Un enchufe en la isla. Parece poca cosa hasta que te falta.\nLavadero con ventana. Armario en la entrada. Grifo en la terraza. Banco en la ducha. Persiana que baja sola a las tres.\nNada de esto sale en el precio por metro y todo se nota el primer mes.\nGuárdalo para enseñárselo a tu arquitecto.\nPresentadora IA de @vitruvistudio. Infografías no contractuales.", "copy_en": "A socket on the island. Seems like nothing until you don't have one. A laundry room with a window, a closet by the door, a tap on the terrace, a bench in the shower, shutters that close by themselves at 3 pm. None of it shows in the price per square metre; all of it shows in month one.", "cta": "Guárdalo para enseñárselo a tu arquitecto.", "hashtags": ["#cosasquetienensentido", "#obranueva", "#interiorismo", "#detalles", "#casa", "#renders", "#vitruvistudio"], "por_que_viral": "Formato que la gente ya reconoce y consume en bucle; los detalles satisfactorios generan guardados y «yo quiero esto». Gancho B para el Trial Reel: «Seis cosas que pediría en cualquier obra nueva».", "imagenes": ["seis detalles de interior en renders: cocina, lavadero, entrada, terraza, baño", "mano y palma de Claudia", "plano medio final"]}, {"n": 9, "formato": "Serie de stories", "gancho": "Story 1, Claudia en el sofá, a cámara: «Esta tarde, sin casas. Me preguntas tú a mí, lo de ser IA incluido». Sticker de preguntas.", "idea": "La transparencia como contenido, sin hacer de ello un número: 8-10 stories en una tarde (18:00-20:00) respondiendo desde el sofá a las preguntas que todo el mundo se hace. Las respuestas se recortan en reels la semana siguiente y se guardan en el destacado «Soy IA».", "plano": ["¿Quién te creó?: «Vitruvi Studio, un estudio de Barcelona que hace infografías y visitas virtuales de obra nueva»", "¿Hay una persona detrás?: «Un equipo. Mi historia la escribieron ellos; las casas que enseño, no»", "¿Por qué Barcelona?: «Mi padre es de aquí. Vine por un máster de visualización y me quedé por el barrio»", "¿Las casas son reales?: «Las promociones sí. Lo que ves son infografías no contractuales, y lo digo siempre»", "¿Puedo contratarte?: «Si promueves o comercializas obra nueva, escribe a @vitruvistudio. Te contestan ellos, no yo»", "¿Qué no haces?: «Dar precios que no me hayan confirmado, asesorar de hipotecas y hacerme pasar por humana»", "Encuesta: «¿Qué barrio quieres que enseñe?»", "Cierre: «El lunes, una de obra nueva. Con metros y orientación, como siempre»"], "copy_es": "Esta tarde, sin casas. Me preguntas tú a mí, lo de ser IA incluido.\nRespondo desde el sofá. Lo que no hago: precios sin confirmar, asesoría y hacerme pasar por humana.\nPresentadora IA de @vitruvistudio.", "copy_en": "No houses this afternoon. You ask me, the AI part included. Answering from the sofa. AI presenter by @vitruvistudio.", "cta": "Pregunta en la caja. Si vendes obra nueva, escribe a Vitruvi.", "hashtags": ["#creadaconia", "#ia", "#obranueva", "#barcelona", "#vitruvistudio"], "por_que_viral": "La honestidad desarma a los críticos y da a la prensa un titular limpio. Las respuestas alimentan reels y cumplen de forma visible el artículo 50 del Reglamento de IA.", "imagenes": ["look presentadora o calle, sentada en el sofá", "piso Poblenou con luz de tarde", "la gata en el plano"]}, {"n": 10, "formato": "Reel", "gancho": "Claudia en el balcón con una grúa detrás: «Desde mi balcón cuento siete grúas. Te enseño qué están construyendo».", "idea": "Día en mi vida en Poblenou: la luz de las 7:30, la carrera por el Bogatell, el flat white, una obra con casco, la pantalla con la infografía de esa obra terminada, el vermut. Cierra: «Un barrio a medio hacer, a ocho minutos de la playa. Me va bien».", "plano": ["Balcón: gancho. «Ven, que te enseño el barrio»", "Ventana con luz, texto «7:30, este»: «Las siete y media. Ventana al este; por eso me levanto sin alarma»", "Carrera por el paseo marítimo, sin voz", "Café en la Rambla del Poblenou: «Flat white. Costumbre de Miami que no pienso dejar»", "Obra con casco, palma hacia el forjado: «Esto será un salón. Da al mar y el forjado de arriba ya está»", "Pantalla: render de la misma obra: «Y así se va a ver cuando terminen. Es una infografía; el sol es el de aquí»", "Vermut, manos y mesa: «Vermut en Marià Aguiló. Fin de la jornada»", "Puerta: «El lunes, otra casa. ¿Pasamos?»"], "copy_es": "Desde mi balcón cuento siete grúas. Te enseño qué están construyendo.\nPoblenou: luz a las 7:30 por la ventana del este, carrera hasta el Bogatell, flat white, una obra con casco a mediodía y, por la tarde, la infografía de esa misma obra terminada. Vermut al cerrar.\nSígueme para la siguiente casa; hay una cada lunes.\nPresentadora IA de @vitruvistudio.", "copy_en": "From my balcony I count seven cranes. Let me show you what they're building. Poblenou: 7:30 light through the east window, a run to Bogatell, a flat white, a building site at noon and, by evening, the render of that same site finished. Vermouth to close.", "cta": "Sígueme para la siguiente casa; hay una cada lunes.", "hashtags": ["#poblenou", "#barcelona", "#diaenmivida", "#obranueva", "#22arroba", "#creadaconia", "#vitruvistudio"], "por_que_viral": "El «día en mi vida» convierte visitas en seguidores; el barrio lo comparte su propia comunidad y el gancho con número concreto (siete grúas) abre curiosidad sin truco. Enseña que Claudia tiene vida, no solo casas. Caras reales fuera de plano.", "imagenes": ["piso Poblenou: ventana y balcón con grúa", "calle Barcelona, look calle", "playa Bogatell", "obra con casco", "pantalla con render", "vermut, manos y mesa"]}]}</script>

// ---------- Pinch in place: the photo grows over the page and springs back on release ----------
const PZ = { on: false, clone: null, src: null, rect: null, p0x: 0, p0y: 0, d0: 1, s: 1, shade: null, end: null, wheelT: 0 };
function pzBegin(node, cx, cy, d0, end) {
  const r = node.getBoundingClientRect();
  const c = node.cloneNode(true);
  c.removeAttribute("id");
  c.querySelectorAll?.(".tag, .lbl, .mark").forEach(n => n.remove());
  const cs = getComputedStyle(node);
  Object.assign(c.style, { position: "fixed", left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px", margin: "0",
    zIndex: 90, transformOrigin: "0 0", pointerEvents: "none", transition: "none", visibility: "visible", borderRadius: cs.borderRadius, overflow: "hidden",
    objectFit: cs.objectFit, objectPosition: cs.objectPosition });
  const hd = node.dataset.hd || node.querySelector?.("img")?.dataset.hd;
  if (hd) { const fg = c.matches("img") ? c : c.querySelector("img"); if (fg) { const im = new Image(); im.onload = () => { fg.src = hd; }; im.src = hd; } }
  const shade = el("div", { class: "pz-shade" });
  document.body.append(shade, c);
  node.style.visibility = "hidden";
  Object.assign(PZ, { on: true, clone: c, src: node, rect: r, p0x: cx - r.left, p0y: cy - r.top, d0, s: 1, shade, end });
}
function pzMove(cx, cy, s) {
  PZ.s = Math.min(4, Math.max(1, s));
  PZ.clone.style.transform = `translate(${cx - PZ.rect.left - PZ.p0x * PZ.s}px, ${cy - PZ.rect.top - PZ.p0y * PZ.s}px) scale(${PZ.s})`;
  PZ.shade.style.opacity = String(Math.min(0.75, (PZ.s - 1) * 0.9));
}
function pzEnd() {
  if (!PZ.on) return;
  PZ.on = false;
  const { clone, shade, src, end } = PZ;
  clone.style.transition = "transform .26s cubic-bezier(.2,.8,.2,1)"; clone.style.transform = "translate(0px, 0px) scale(1)";
  shade.style.transition = "opacity .26s"; shade.style.opacity = "0";
  setTimeout(() => { clone.remove(); shade.remove(); src.style.visibility = ""; end?.(); }, 270);
}
function attachPinch(area, pick, hooks = {}) {
  const span = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1;
  area.addEventListener("touchstart", e => {
    if (e.touches.length !== 2 || PZ.on) return;
    const node = pick(e); if (!node) return;
    e.preventDefault();
    const [a, b] = e.touches;
    hooks.start?.();
    pzBegin(node, (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2, span(a, b), hooks.end);
  }, { passive: false });
  area.addEventListener("touchmove", e => {
    if (!PZ.on || e.touches.length < 2) return;
    e.preventDefault();
    const [a, b] = e.touches;
    pzMove((a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2, span(a, b) / PZ.d0);
  }, { passive: false });
  const up = e => { if (PZ.on && e.touches.length < 2) pzEnd(); };
  area.addEventListener("touchend", up);
  area.addEventListener("touchcancel", up);
  // A trackpad pinch on a computer arrives as ctrl + wheel
  area.addEventListener("wheel", e => {
    if (!e.ctrlKey) return;
    const node = PZ.on ? PZ.src : pick(e); if (!node) return;
    e.preventDefault();
    if (!PZ.on) { hooks.start?.(); pzBegin(node, e.clientX, e.clientY, 1, hooks.end); }
    pzMove(e.clientX, e.clientY, PZ.s * Math.exp(-e.deltaY * 0.01));
    clearTimeout(PZ.wheelT); PZ.wheelT = setTimeout(pzEnd, 200);

}

// ---------- Feed ----------
function renderFeed() {
  const st = $("stories");
  for (const s of [SETS[CL_IDX], ...SETS.slice(0, CL_IDX)]) {
    const b = el("button", { type: "button", class: "st", "aria-label": `Ver historia: ${s.n ? s.n + ", " : ""}${s.title}` }, ring(s), el("span", { text: s.n ? s.handle : s.title }));
