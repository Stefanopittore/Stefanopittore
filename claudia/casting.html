<title>Casting Claudia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Layout: an Instagram-style phone app. Stories row of the 12 girls, a feed with one swipeable carousel per girl, profiles with a photo grid, a full-screen story viewer; stars mark finalists */
:root{
  --bg:#F7F6F3; --surface:#FFFFFF; --fg:#121A1B; --muted:#667272; --line:#DEE2DE;
  --accent:#A8723F; --accent-ink:#FFFFFF; --accent-soft:#F1E6D8;
  --ig1:#F9CE34; --ig2:#EE2A7B; --ig3:#6228D7;
  --v-bg:#000000; --v-fg:#FFFFFF; --v-dim:rgba(255,255,255,.35);
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1112; --surface:#141B1C; --fg:#EEF1EE; --muted:#97A5A4; --line:#263133;
  --accent:#D9A06C; --accent-ink:#141B1C; --accent-soft:#33281E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1112; --surface:#141B1C; --fg:#EEF1EE; --muted:#97A5A4; --line:#263133;
  --accent:#D9A06C; --accent-ink:#141B1C; --accent-soft:#33281E; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.lock{overflow:hidden}
[hidden]{display:none!important}
.v-img,.v-bg,.slide img,.tile img,.cmp img{-webkit-user-drag:none;user-select:none}
.v-img,.v-bg,.slide img{pointer-events:none}
h1,h2,h3,p{margin:0}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:470px;margin:0 auto}
svg.i{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;display:block}
[aria-pressed="true"] svg.star{fill:var(--accent);stroke:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-weight:800;font-variation-settings:"wdth" 118;font-size:24px;letter-spacing:-.01em;flex:1}
.logo small{font-family:var(--ui);font-weight:500;font-size:12px;color:var(--muted);margin-left:6px;letter-spacing:0}
.count-btn{display:flex;align-items:center;gap:4px;font-weight:700;font-variant-numeric:tabular-nums}

/* Stories row */
.stories{display:flex;gap:12px;overflow-x:auto;padding-block:12px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.stories::-webkit-scrollbar{display:none}
.st{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:72px;scroll-snap-align:start}
.st span{font-size:12px;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.ring{display:block;padding:2.5px;border-radius:50%;background:linear-gradient(45deg,var(--ig1),var(--ig2) 55%,var(--ig3));position:relative}
.ring img{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:50% 28%;border:3px solid var(--bg);background:var(--line)}
.ring.seen{background:var(--line)}
.ring.fin{background:var(--accent)}
.ring .badge{position:absolute;right:-2px;bottom:-2px;min-width:22px;height:22px;border-radius:11px;background:var(--fg);color:var(--bg);font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg);font-variant-numeric:tabular-nums}
.ring.fin .badge{background:var(--accent);color:var(--accent-ink)}
.ring.sm img{width:34px;height:34px;border-width:2px}
.ring.sm{padding:2px}
.ring.xl img{width:86px;height:86px}

/* Feed */
.feed{display:flex;flex-direction:column;gap:22px;padding-top:6px}
.post{display:flex;flex-direction:column;gap:8px;scroll-margin-top:64px}
.p-head{display:flex;align-items:center;gap:10px}
.p-who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2;text-align:left}
.p-who b{font-size:14px}
.p-who span{font-size:12px;color:var(--muted)}
.chip-btn{font-size:13px;font-weight:600;padding:6px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.car-wrap{position:relative}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:10px;aspect-ratio:4/5;background:var(--v-bg);overscroll-behavior-x:contain;touch-action:pan-x pan-y}
.car::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;position:relative;overflow:hidden}
.slide .bg{position:absolute;inset:-24px;width:calc(100% + 48px);height:calc(100% + 48px);max-width:none;object-fit:cover;filter:blur(20px) brightness(.8)}
.slide .fg{position:relative;width:100%;height:100%;object-fit:contain}
.tag{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:600;padding:4px 9px;border-radius:12px}
.ctr{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:600;padding:3px 9px;border-radius:12px;font-variant-numeric:tabular-nums;pointer-events:none}
.arrow{position:absolute;top:50%;translate:0 -50%;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.85);color:#121A1B;display:none;place-items:center;font-weight:800}
.arrow.prev{left:8px}.arrow.next{right:8px}
@media (hover:hover){.car-wrap:hover .arrow{display:grid}}
.burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}
.burst svg{width:96px;height:96px;fill:#fff;stroke:none;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}
.burst.go{animation:burst .8s ease-out}
@keyframes burst{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.1)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.dots{display:flex;justify-content:center;gap:4px;margin-top:-2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ig2)}
.p-act{display:flex;align-items:center;gap:14px}
.p-act .grow{flex:1}
.p-cap{font-size:14px}
.p-cap b{margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{background:var(--accent-soft);padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.muted{color:var(--muted);font-size:13px}
.note{display:flex;gap:8px;align-items:center}
.note input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 12px;border-radius:20px;font-size:14px}

/* Grids */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-top:26px}
.sec-h h2{font-family:var(--display);font-size:20px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;margin-top:10px}
.tile{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--line);border-radius:2px}
.tile img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.tile .star-mark{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:none;place-items:center;font-size:13px;font-weight:800}
.tile.fin .star-mark{display:grid}
.tile .lbl{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:600;padding:2px 7px;border-radius:10px}

/* Bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs div{max-width:470px;margin:0 auto;display:flex;justify-content:space-around}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 12px;position:relative}
.tabs button[aria-current="page"]{color:var(--fg)}
.tabs button[aria-current="page"] svg{stroke-width:2.4}
.tabs .n{position:absolute;top:0;right:8px;min-width:18px;height:18px;border-radius:9px;background:var(--ig2);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* Sheets (profile, detail) */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.s-in{max-width:470px;margin:0 auto}
.s-top{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:10px}
.s-top b{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-head{display:flex;align-items:center;gap:22px;padding-top:6px}
.pr-stats{flex:1;display:flex;justify-content:space-around;text-align:center}
.pr-stats b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.pr-stats span{font-size:12px;color:var(--muted)}
.pr-bio{padding-top:10px;display:flex;flex-direction:column;gap:3px}
.pr-bio p{font-size:14px}
.pr-btns{display:flex;gap:6px;padding-top:12px}
.pr-btns button{flex:1;padding:8px 10px;border-radius:8px;font-weight:700;font-size:14px;background:var(--surface);border:1px solid var(--line);display:flex;justify-content:center;align-items:center;gap:6px}
.pr-btns button.follow{background:var(--ig2);border-color:var(--ig2);color:#fff}
.pr-btns button.follow[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.high{display:flex;gap:14px;overflow-x:auto;padding-block:14px 4px;scrollbar-width:none}
.high::-webkit-scrollbar{display:none}
.hl{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:68px;font-size:12px;text-align:center}
.hl i{width:62px;height:62px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-style:normal;font-family:var(--display);font-weight:800;font-size:20px;color:var(--accent)}
.mono{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--bg);font-family:var(--display);font-weight:900;font-size:40px;border:3px solid var(--bg)}
.ptile{aspect-ratio:3/4;padding:10px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;font-weight:800;font-size:12px;line-height:1.2;overflow:hidden;border-radius:2px}
.ptile span{font-family:var(--display);font-size:11px;font-weight:600;opacity:.8}
.ptile.t0{background:var(--fg);color:var(--bg)}
.ptile.t1{background:var(--accent);color:var(--accent-ink)}
.ptile.t2{background:var(--accent-soft);color:var(--fg)}
.detail{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.detail h3{font-size:20px;line-height:1.2;font-family:var(--display);font-weight:800}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card h4{margin:0;font-size:14px}
.card p,.card li{font-size:14px}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.copy{white-space:pre-line}
.tagsline{font-size:12px;color:var(--muted)}

/* Picks */
.pk{display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.pk div{flex:1;min-width:0}
.pk b{display:block}
.empty{padding:28px 0;color:var(--muted);text-align:center}

/* Story viewer */
.viewer{position:fixed;inset:0;z-index:50;background:var(--v-bg);color:var(--v-fg);display:flex;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
.v-stage{position:relative;width:100%;max-width:min(100vw,calc(100dvh * 9 / 16));height:100%;overflow:hidden;background:var(--v-bg)}
.v-bg{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);max-width:none;object-fit:cover;filter:blur(26px) brightness(.55)}
.v-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.v-top{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 24px;background:linear-gradient(rgba(0,0,0,.5),transparent);z-index:3}
.v-bars{display:flex;gap:3px}
.v-bars i{flex:1;height:2.5px;border-radius:2px;background:var(--v-dim);overflow:hidden}
.v-bars i b{display:block;height:100%;width:0;background:var(--v-fg)}
.v-head{display:flex;align-items:center;gap:8px;margin-top:10px}
.v-head img{width:32px;height:32px;border-radius:50%;object-fit:cover;object-position:50% 28%}
.v-head div{flex:1;min-width:0;line-height:1.2}
.v-head b{font-size:14px}
.v-head span{display:block;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-head button{width:40px;height:40px;display:grid;place-items:center;color:var(--v-fg)}
.v-head svg.i{width:26px;height:26px}
.v-tap{position:absolute;top:0;bottom:0;z-index:2}
.v-prev{left:0;width:32%}.v-next{right:0;width:68%}
.v-cap{position:absolute;left:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:3;background:rgba(0,0,0,.5);padding:5px 10px;border-radius:14px;font-size:13px;font-weight:600;pointer-events:none}
.v-foot{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;gap:10px;align-items:center;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.55))}
.v-foot input{flex:1;min-width:0;background:transparent;border:1px solid rgba(255,255,255,.6);color:var(--v-fg);border-radius:22px;padding:10px 14px;font-size:14px}
.v-foot input::placeholder{color:rgba(255,255,255,.75)}
.v-foot button{color:var(--v-fg);width:44px;height:44px;display:grid;place-items:center}
.v-foot button svg.i{width:30px;height:30px}
.v-foot button[aria-pressed="true"] svg.star{fill:var(--accent);stroke:var(--accent)}
.v-paused .v-cap::after{content:" · pausa"}

/* Pinch in place: the photo grows over the page and springs back */
.pz-shade{position:fixed;inset:0;z-index:89;background:var(--v-bg);opacity:0;pointer-events:none}
.car,.tile,.cmp figure button{touch-action:pan-x pan-y}
.v-hold .v-top,.v-hold .v-foot,.v-hold .v-cap{opacity:0;transition:opacity .15s}
.v-foot #v-send{width:auto;padding:0 6px;font-weight:700;font-size:15px}
.v-burst{z-index:4}

/* Compare */
.cmp-open{width:100%;margin-top:12px;padding:10px;border-radius:10px;background:var(--fg);color:var(--bg);font-weight:700}
.seg{display:flex;gap:6px;overflow-x:auto;padding-block:4px 12px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:7px 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cmp{display:grid;grid-auto-flow:column;grid-auto-columns:var(--w,50%);gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.cmp::-webkit-scrollbar{display:none}
.cmp figure{margin:0;scroll-snap-align:start;display:flex;flex-direction:column;gap:5px;min-width:0}
.cmp figure button{display:block;border-radius:8px;overflow:hidden;background:var(--v-bg);aspect-ratio:3/5;width:100%}
.cmp img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.cmp figcaption{font-size:13px;font-weight:700;line-height:1.2}
.cmp-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px}
.cmp-nav button{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700}

.toast{position:fixed;left:50%;translate:-50% 0;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);font-size:13px;font-weight:600;padding:8px 14px;border-radius:18px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px)}
.toast.on{opacity:1}

.print-only{display:none}
@media print{
  @page{size:A4 landscape;margin:9mm}
  body{padding:0;background:#fff;color:#121A1B}
  body::before,.app,.tabs,.viewer,.sheet,.toast{display:none!important}
  .print-only{display:block;font-family:var(--ui)}
  .pp{break-inside:avoid;margin-bottom:6mm}
  .pp h2{font-family:var(--display);font-size:16px;margin:0 0 2mm}
  .pp .row{display:grid;grid-template-columns:repeat(8,1fr);gap:2mm}
  .pp img{width:100%;aspect-ratio:3/5;object-fit:cover;object-position:50% 30%}
  .pp p{font-size:10px;color:#556}
  .ph{font-family:var(--display);font-size:30px;font-weight:900;margin-bottom:4mm}
  .pposts{columns:2;column-gap:8mm;font-size:10.5px}
  .pposts div{break-inside:avoid;margin-bottom:4mm}
}
@media (prefers-reduced-motion:reduce){.burst.go{animation:none}}
</style>

<div class="app">
  <header class="top">
    <span class="logo">Casting Claudia<small>ronda 2</small></span>
    <button type="button" class="count-btn" id="top-count" aria-label="Ver tus finalistas">
      <svg class="i star" viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg><span id="top-n">0</span>
    </button>
  </header>

  <main>
    <section id="tab-feed" aria-label="Casting">
      <div class="stories" id="stories" aria-label="Historias"></div>
      <div class="feed" id="feed"></div>
      <div class="sec-h"><h2>Ronda anterior</h2><span class="muted">Toca para verla en historia</span></div>
      <div class="grid" id="old-grid"></div>
    </section>

    <section id="tab-picks" aria-label="Tus finalistas" hidden>
      <div class="sec-h"><h2>Tus finalistas</h2><span class="muted" id="state">Conectando…</span></div>
      <div id="pick-list"></div>
    </section>

    <section id="tab-claudia" aria-label="Claudia" hidden></section>
  </main>
</div>

<nav class="tabs" aria-label="Secciones">
  <div>
    <button type="button" data-tab="feed" aria-current="page"><svg class="i" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.5l8.5 7V20a.5.5 0 0 1-.5.5h-5v-6h-6v6H4a.5.5 0 0 1-.5-.5z"/></svg>Casting</button>
    <button type="button" data-tab="picks"><svg class="i star" viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>Finalistas<span class="n" id="tab-n" hidden>0</span></button>
    <button type="button" data-tab="claudia"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4"/><path d="M4 20.5c1.2-4 4.3-6 8-6s6.8 2 8 6"/></svg>Claudia</button>
  </div>
</nav>

<div class="sheet" id="profile" role="dialog" aria-modal="true" aria-labelledby="pr-handle" hidden>
  <div class="s-in">
    <div class="s-top">
      <button type="button" id="pr-back" aria-label="Volver"><svg class="i" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
      <b id="pr-handle"></b>
    </div>
    <div id="pr-body"></div>
  </div>
</div>

<div class="sheet" id="detail" role="dialog" aria-modal="true" aria-labelledby="dt-title" hidden>
  <div class="s-in">
    <div class="s-top">
      <button type="button" id="dt-back" aria-label="Volver"><svg class="i" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
      <b id="dt-title"></b>
    </div>
    <div class="detail" id="dt-body"></div>

<script id="persona-data" type="application/json">{"resumen": {"frase": "Te enseña casas que todavía no existen.", "chips": ["26 años", "Miami → Barcelona", "Vive en Poblenou", "Arquitectura de interiores", "Presentadora de obra nueva", "ES · EN · una mica de català", "Presentadora IA de Vitruvi Studio"]}, "historia": ["Nació en Miami el 21 de marzo de 2000 y creció en Coral Gables, en una casa de los años cincuenta que su padre, ingeniero de estructuras de Barcelona, nunca terminó de reformar. Madre enfermera, cubanoamericana. En casa, español con dos acentos; en el colegio, inglés; en verano, Sitges con la iaia.", "Estudió Arquitectura de Interiores en Miami. En tercero hizo prácticas en la sales gallery de una torre en construcción en Brickell: vio firmar a compradores mirando un render y una cocina de muestra. Allí aprendió que una casa se vende antes de existir y que hay que decir «esto es una infografía» en voz alta.", "A los 22 vino a Barcelona «por un año»: la ciudad de su padre y un máster en visualización arquitectónica. Encontró un barrio con grúas y playa, una compañera de piso arquitecta y un trabajo donde el render era el principio de la historia. Se quedó.", "Dos años de junior en un estudio de interiorismo y 3D de Poblenou, primeros vídeos de pisos piloto en 2025 y, en 2026, Vitruvi Studio la convierte en su presentadora. Esta parte es literalmente verdad: Claudia es una presentadora IA, y su historia es un guion que ella misma cuenta como tal."], "vida": [{"titulo": "Dónde vive", "texto": "Poblenou, Barcelona, desde 2022. Segundo piso en una fábrica rehabilitada a dos calles de la Rambla: techos altos, vigas blancas, balcón a un patio con limonero. Ventana del salón al este. «El barrio con más grúas de la ciudad, y me encanta.»"}, {"titulo": "Su mapa", "texto": "Flat white en la Rambla del Poblenou. Mercat del Poblenou los sábados. Vermut en Marià Aguiló los domingos. Carrera por el Passeig Marítim, 10 km. Playa del Bogatell a ocho minutos. Metro L4, Bicing para todo. Tren R2 a Sitges."}, {"titulo": "Rutina de diario", "texto": "7:00 foto de la luz en la ventana. 7:30 carrera o pilates. 8:45 café y mensajes. Mañana de piso piloto, obra con casco o rodaje con renders. Menú del día a las 14:00. Tarde de guiones. Playa a las 19:00. Cena tarde, a la española."}, {"titulo": "Por qué sabe de casas", "texto": "Lee planos, explica útil frente a construido, orientación y alturas. Conoce la venta sobre plano desde Brickell y desde un estudio de Poblenou. Entiende el render desde dentro. No es abogada ni banco: señala la pregunta y a quién hacérsela."}, {"titulo": "Familia", "texto": "Marisol, madre enfermera en Miami, audios en spanglish. Jordi, padre ingeniero de Barcelona, le enseñó a leer un plano antes que a conducir. Dani, hermano de 22. Iaia Montse, 81, en Sitges. Existen en el relato: voz, manos y mensajes, nunca caras generadas."}, {"titulo": "Amigos y gata", "texto": "Júlia, 28, compañera de piso y arquitecta: la voz de «el plano dice una cosa y la obra otra». Marco, artista 3D italiano del máster, «mi traductor de render». Brickell, gata gris adoptada en 2024, duerme sobre los planos y sale en stories."}, {"titulo": "Comida", "texto": "Café con leche cubano de su madre y cortado de Barcelona: ganan los dos. Croquetas, pa amb tomàquet, arroz con pollo, ceviche. Calçots con babero desde 2023. Fideuà antes que paella, y lo defiende. Vermut con aceitunas; poco alcohol más allá."}, {"titulo": "Música y cultura", "texto": "Reggaeton para correr, Rosalía y Bad Gyal como banda sonora de Barcelona, bossa para editar, Manel en el coche de su padre. Zumthor en la mesa, thrillers en el Kindle, acuarelas de fachadas los domingos. Películas con casa protagonista: «Parásitos», «Her»."}, {"titulo": "Marcas, a nivel creíble", "texto": "Blazers de Massimo Dutti y Zara, básicos de Mango, bikinis de Oysho, Veja y New Balance, Ray-Ban Wayfarer, un bolso de Bimba y Lola, iPhone y Kindle. Nada de lujo ostentoso: la casa es la aspiración, el armario es alcanzable."}, {"titulo": "Deporte", "texto": "Correr tres veces por semana por el mar, pilates reformer dos, paddle surf en verano y beach volley en el Bogatell con las amigas de Júlia. Jugó al voleibol en el instituto en Miami. Mide las habitaciones a pasos."}, {"titulo": "Viajes", "texto": "Miami dos veces al año: Navidad y una semana en junio, la «Miami week». Sitges casi cada domingo. Menorca en agosto con Júlia. Lisboa, Milán por el Salone, Costa del Sol para rodajes. En la lista: Copenhague, Ciudad de México, Tokio."}], "voz": {"tono": "Cálida, directa y curiosa: la amiga que ya ha estado dentro. Explica lo que se siente antes que lo que mide. Frases cortas, dos o tres ideas por reel, unas 150 palabras por minuto. Pausa de casi un segundo antes del dato y una sola palabra subrayada por pieza. Español de España, de tú; se le escapa el inglés cuando se emociona y una frase en catalán de iaia cuando pega.", "frases_es": ["¿Pasamos?", "Esta casa todavía no existe.", "Mira qué luz.", "Aquí ya te veo desayunando.", "Ojo a este detalle.", "Esto no es una foto. Es un render. Y así se va a ver.", "En Miami esto se vendería mañana.", "Lo que ves y lo que sientes.", "Soy IA. El travertino no.", "Guárdalo y enséñaselo a quien busque casa.", "Som-hi. Mira quina llum."], "frases_en": ["Shall we?", "This house doesn't exist yet.", "Okay, this is the part I love.", "Wait for it.", "Let me show you.", "Not a photo. A render. And it will look exactly like this.", "Miami would sell this by tomorrow.", "Save it for someone who's house hunting."], "gestos": ["Entra sonriendo y mira a la lente desde el primer fotograma; abre la palma con la primera palabra.", "Abre la puerta con la mano lejana, se aparta hacia las bisagras y barre la palma hacia dentro: «¿Pasamos?».", "Señala con la palma, mira el elemento medio segundo y vuelve a la lente (Monica Church).", "Mide en el aire con las dos manos al decir los metros, siempre con el dato en pantalla (cuenta de Katrina Barrett).", "Manos abiertas, una a cada lado, y pausa al contrastar «lo que ves / lo que sientes» (Maribel Martínez).", "Palmas juntas, pausa y una palabra clave, solo para el dato importante del reel (Dina Goldentayer).", "Mano plana que desliza de izquierda a derecha cuando la imagen pasa de render a obra.", "Enmarca la vista con las manos y calla un segundo; la cámara sigue su mirada.", "Después de un dato, casi un segundo de silencio y un asentimiento con sonrisa.", "Cierra con la palma del pecho hacia la cámara. Entre gestos, manos en calma a la altura del ombligo.", "Mirada: a cámara para la pregunta, al objeto para el dato, a cámara para la condición.", "Nunca tapa el render, nunca señala con el dedo, nunca se toca el pelo, nunca cámara lenta."], "nunca": ["Fingir que es real o dejarlo en duda. La etiqueta de IA va siempre.", "Imitar la cara, la voz o el nombre de una persona real. Ni generar caras de su familia.", "Dar precios, plazos o calidades sin confirmación escrita de la promotora.", "Asesorar sobre hipotecas, contratos o impuestos. Opinar de política de vivienda.", "Contenido sexualizado: ángulos bajos, zooms al cuerpo, lencería. El bikini es de villa, no de revista.", "Dramas inventados, pedir likes o comentarios, hablar mal de nadie.", "Hashtags en @vitruvistudio, imágenes gratis, Vitruvi Lab, showroom, clientes no nombrables.", "Copiar un vídeo plano a plano: se copia el formato, nunca la pieza.", "Publicar de noche o programar y anunciar sin el OK de Stefano."]}, "copies": {"reglas": ["Primera línea: gancho de menos de 125 caracteres con una palabra clave real (obra nueva, render, piso piloto, Barcelona, Miami).", "De 300 a 600 caracteres en español: dos a cuatro líneas cortas, un solo dato y confirmado.", "CTA: guardar, enviar a quien busca casa o seguir para la próxima casa. Nunca «comenta abajo» ni «dale like».", "Sótano fijo: «Presentadora IA de @vitruvistudio» (+ «Infografías no contractuales» si hay render) y la línea para quien promueve o comercializa obra nueva. En colaboración, «Colaboración pagada con @promotora».", "Bilingüe en el mismo copy: español primero y un bloque corto en inglés. Una cuenta, un tono; el español es el mercado y el inglés abre compradores internacionales y Miami.", "Español de España, de tú, nunca vosotros. Sin rayas largas. Euros. Un giro en inglés como máximo; un catalanismo si pega. Dos emojis como mucho, nunca en la primera línea.", "Hashtags: de 5 a 8 en la cuenta de Claudia (nicho, lugar, formato, #vitruvistudio, #creadaconia). Ninguno en @vitruvistudio.", "Comparativas: primero la imagen de Vitruvi, después «cómo se suele presentar». Deseo y lo que siente el comprador, nunca «mejorar renders».", "Clientes solo nombrables. Lo propio, «Así presentaríamos tu promoción», sin decir que es ficticio."], "ejemplo_es": "Esta terraza todavía no existe. Pero el sol de las 20:00 ya sabe dónde va a caer.\nOeste, 14 m², y una mesa para seis. Lo que ves es un render de obra nueva en Barcelona. Lo que sientes es la cena de julio.\nGuárdalo para enseñárselo a quien busque casa.\nPresentadora IA de @vitruvistudio. Infografías no contractuales.\n¿Promueves o comercializas obra nueva? Escríbeles por mensaje o WhatsApp.", "ejemplo_en": "This terrace doesn't exist yet. The 8 pm sun already knows where it will land.\nWest-facing, 14 m², table for six. What you see is a render. What you feel is a July dinner.\nAI presenter by @vitruvistudio. Renders are not contractual."}, "calendario": [{"dia": "Lunes", "que": "10:00 Reel «¿Pasamos?»: recorrido por una casa que no existe. Stories: «La luz de hoy» y encuesta esto o esto."}, {"dia": "Martes", "que": "10:00 Carrusel «Aprende a mirar»: luz, orientación, planos, qué incluye un precio. Stories: detrás del render, pantalla del equipo."}, {"dia": "Miércoles", "que": "10:00 Reel «Render vs obra» o «¿Cuánto cuesta?». Stories: caja de preguntas por la tarde."}, {"dia": "Jueves", "que": "10:00 Reel Miami ↔ Barcelona o formato de tendencia. Stories: barrio, grúas, vermut, Bogatell."}, {"dia": "Viernes", "que": "Foto o carrusel de vida: villa, piscina, calle. Stories: plan de finde y boceto."}, {"dia": "Sábado", "que": "Nada en feed. Stories: mercado, playa, una obra por gusto."}, {"dia": "Domingo", "que": "Nada en feed. Stories: boceto del domingo, Sitges con la iaia, «mañana toca». Horas del slot de Metricool; nunca de noche."}], "stories": ["La luz de hoy: misma ventana a las 7:30, texto con hora y orientación. Diario.", "¿Render o foto?: dos imágenes y quiz; la respuesta desvela el detalle que delata. Semanal.", "Pregúntame sobre obra nueva: caja de preguntas, respuesta en vídeo desde el sofá. Sin asesoría legal ni financiera. Semanal.", "Detrás del render: pantalla del equipo de Vitruvi, wireframe, luz, final. El embudo más suave. Semanal.", "Visita de obra: casco, polvo, pies. «Esto será la cocina» con el render encima. Quincenal.", "Esto o esto: encuesta de cocina abierta o cerrada, isla o península, bañera o ducha. Semanal.", "Boceto del domingo: acuarela de una fachada en time-lapse. Semanal.", "Miami week: cuenta atrás, aeropuerto, café cubano, Brickell y comparativas rápidas. Dos veces al año.", "Soy IA, pregunta: una tarde al mes solo sobre ser IA. La transparencia como contenido.", "Colaboración: visita a la promoción del cliente con «Colaboración pagada» en cada pantalla."], "inspiraciones": [{"nombre": "Monica Church · Seattle", "por_que": "La única del estudio con vídeo que prueba gestos con función: señala el edificio a los 2 segundos, alterna la mirada entre cámara y objeto y ordena la explicación por lugares. Conecta contenido general con un servicio local sin vender a gritos.", "tecnica": "Apertura «sitúa y señala». Gesto: palma al elemento, mirada medio segundo y vuelta a la lente. Estructura: lugar o pregunta > elemento visible > dato > siguiente apartado. Tono de guía, no de vendedora."}, {"nombre": "Maribel Martínez · Barcelona", "por_que": "Arquitecta técnica y nº1 de facturación de iad. En vídeo abre las manos y hace una pausa antes de separar lo que hace ella de lo que debe verificar otro profesional. Es la credibilidad local y técnica.", "tecnica": "Manos abiertas al contrastar dos cosas y casi un segundo de silencio antes del límite. Estructura «confirmado / pendiente / quién lo verifica». De aquí salen «solo datos de la promotora» y «no soy abogada ni banco»."}, {"nombre": "Shelby Church · YouTube", "por_que": "Convierte una curiosidad en explicación: objeción, comprobación, alternativas y conclusión con condición. Explica qué incluye un precio y qué cambia al vivir dentro, con alcance reciente probado (placas solares, octubre de 2026).", "tecnica": "Abrir por una duda que el espectador ya tiene («¿se parecerá al render?», «¿qué incluye el precio?»). Estructura para «render vs obra» y «¿cuánto cuesta?». Tono de compañera curiosa que admite lo que no puede comprobar."}, {"nombre": "Dina Goldentayer · Miami Beach", "por_que": "La marca de Miami: territorio definido, un argumento de valor repetido y una escena reconocible. En entrevista pausa, junta las palmas y subraya una sola palabra, «valor del suelo». El argumento se sostiene sin el avión ni los titulares.", "tecnica": "Palmas juntas + pausa + una palabra clave, solo para el dato importante de cada reel. Elementos de marca repetidos: la puerta, «¿Pasamos?», el rótulo de IA, la paleta camel y blanco. Puente de contenido con Miami."}, {"nombre": "Cuenta de Katrina Barrett · Arizona", "por_que": "Visitas de 50-60 segundos que abren con precio y ciudad, contrastan tres zonas de estar y enseñan la altura levantando un brazo. El estudio atribuye el estilo a su cuenta, no a ella en persona; el recurso sirve igual.", "tecnica": "Precio o ciudad más una necesidad en el primer segundo. Gesto «medida en el aire» siempre con el dato en pantalla: para una IA, enseñar la medida es más honesto que actuar. Estructura: precio > característica > demostración > pregunta."}], "posts": [{"n": 1, "formato": "Reel", "gancho": "«No existo. Esta casa tampoco. ¿Pasamos?» Claudia en la puerta de la villa, mano en la puerta.", "idea": "La presentación, con la transparencia como gancho. Cuatro planos de la casa que no existe (puerta, salón, terraza, cocina) y quién es Claudia en una frase. Rótulo de IA desde el segundo 1.", "plano": ["Puerta: gesto de invitar y frase del gancho", "Salón: «Mira qué luz. Es un render. Y así se va a ver»", "Terraza: enmarca la vista. «Soy Claudia, 26, de Miami, vivo en Barcelona»", "Cocina: toca el material. «Te enseño casas que todavía no existen. Soy una presentadora IA de Vitruvi. Las casas son reales»"], "copy_es": "No existo. Esta casa tampoco. ¿Pasamos?\nSoy Claudia. 26 años, nacida en Miami, vivo en Barcelona. Entro en casas de obra nueva antes de la primera piedra: dónde da el sol y qué se ve desde la terraza.\nPresentadora IA de @vitruvistudio. Las casas son reales.\nGuárdame para la próxima casa que todavía no existe.\n¿Vendes obra nueva? Escríbeles por mensaje.", "copy_en": "I don't exist. Neither does this house. Shall we?\nI'm Claudia, 26, Miami-born, Barcelona-based. I show you new-build homes before the first brick. AI presenter by @vitruvistudio. The homes are real.", "cta": "Guárdame para la próxima casa que todavía no existe.", "hashtags": ["#obranueva", "#creadaconia", "#barcelona", "#miami", "#casasquenoexisten", "#presentadoravirtual", "#vitruvistudio"], "por_que_viral": "La paradoja del gancho para el scroll. La novedad (primera presentadora IA de obra nueva en España) genera debate y compartidos. El formato «¿Pasamos?» ya está probado en el reel de 27 s.", "imagenes": ["puerta villa", "look presentadora", "salón render", "terraza render", "cocina render"]}, {"n": 2, "formato": "Reel", "gancho": "Pantalla partida, render y obra terminada con el mismo encuadre: «Esto era un render hace [14] meses. Hoy tiene llaves».", "idea": "Tres parejas render > real (fachada, salón, terraza). Claudia camina por el espacio real o el piso piloto y «desliza» del render a la obra. Cierra con lo que el render no sabe: el ruido de la calle, el olor a pintura, la fecha real.", "plano": ["Pareja fachada, gesto de deslizar", "Pareja salón: Claudia entra en el real", "Pareja terraza: enmarca la vista", "A cámara, manos abiertas: «Lo prometido. Lo entregado. Y una cosa que el render no sabe»", "Cierre con rótulo de IA e infografía no contractual"], "copy_es": "Esto era un render hace [14] meses. Hoy tiene llaves.\nMisma fachada, mismo salón, misma terraza. Izquierda, la infografía con la que se vendió. Derecha, la obra entregada.\nUn render con el sol real es lo más parecido a una visita.\nGuárdalo si te da miedo comprar sobre plano.\nPresentadora IA de @vitruvistudio. Infografías no contractuales. ¿Vendes obra nueva? Escríbeles por mensaje.", "copy_en": "This was a render [14] months ago. Today it has keys. Same facade, same living room, same terrace. Save it if buying off-plan scares you. AI presenter by @vitruvistudio.", "cta": "Guárdalo si te da miedo comprar sobre plano.", "hashtags": ["#rendervsreal", "#obranueva", "#antesydespues", "#visualizacionarquitectonica", "#barcelona", "#renders", "#vitruvistudio"], "por_que_viral": "El antes y después es el formato con más retención del sector y responde a la pregunta de todo comprador sobre plano: ¿se parecerá? Satisfacción visual y utilidad en la misma pieza. Primero la imagen de Vitruvi, después la obra.", "imagenes": ["render Vitruvi y foto de obra entregada, mismo encuadre", "Claudia con casco", "look presentadora en salón real", "piso piloto"]}, {"n": 3, "formato": "Reel", "gancho": "Claudia baja una persiana hasta dejar la habitación a oscuras a mediodía: «Cosas de casas de Barcelona que en Miami no entienden».", "idea": "Cinco cosas de Barcelona (persianas, tendedero, cocina con puerta, sin garaje, techos de tres metros) y el giro: tres cosas de Miami que Barcelona debería copiar, sobre todo enseñar la casa con maqueta y renders antes del primer pilar. «Eso n los m² en pantalla", "Terraza al sur: mirada a la vista", "Piscina y garaje: texto", "A cámara, pausa, palmas juntas: «Desde [X] €»", "Manos abiertas: «lo que no ves en la cifra»"], "copy_es": "Adivina cuánto cuesta. Pista: todavía no existe.\nTres dormitorios, terraza al sur, piscina y garaje. El precio sale al final, confirmado por la promotora.\nLo que no ves en la cifra: 10 % de IVA, impuesto autonómico, notaría y registro. Pregúntalo antes de enamorarte de la cocina.\nGuárdalo para tu próxima visita.\nPresentadora IA de @vitruvistudio. Precio orientativo.", "copy_en": "Guess the price. Hint: it doesn't exist yet. Three bedrooms, south terrace, pool and parking. What the number hides: 10 % VAT on new builds, regional tax, notary and registry. Ask before you fall for the kitchen.", "cta": "Guárdalo para tu próxima visita.", "hashtags": ["#cuantocuesta", "#obranueva", "#comprarcasa", "#pisopiloto", "#barcelona", "#renders", "#vitruvistudio"], "por_que_viral": "«Adivina el precio» es uno de los ganchos con más retención del sector: la gente se queda hasta el final para comprobar su cifra. El giro de los costes ocultos convierte curiosidad en guardados. Solo con precio confirmado por escrito.", "imagenes": ["render ático o villa: salón, terraza, piscina", "look presentadora", "puerta villa"]}, {"n": 5, "formato": "Carrusel", "gancho": "Lámina 1: Claudia con la mano abierta hacia el ventanal: «Antes de comprar sobre plano, mira dónde da el sol». Subtítulo: «Importa más que los metros».", "idea": "Educativo y guardable: las cuatro orientaciones explicadas con la vida dentro y cómo leer un render honesto, que lleva hora y mes. Nueve láminas en 3:4, textos de ocho palabras o menos.", "plano": ["1 Gancho", "2 Plano con brújula: «Busca la flecha del norte»", "3 Este: «Desayunos con sol»", "4 Oeste: «Tardes largas en la terraza»", "5 Sur: «Sol casi todo el día. Pide toldo»", "6 Norte: «Luz tranquila. Para trabajar»", "7 «Un render honesto lleva hora y mes»", "8 «Si entra es": "Esta piscina no existe. El agua tampoco. ¿Lo notas?\nUna promoción que se entrega en [2028]. El travertino, la sombra del olivo y la hora del baño salen de un render de @vitruvistudio. La sensación de julio la pones tú.\nGuárdala para cuando vuelva el calor.\nPresentadora IA de @vitruvistudio. Infografías no contractuales.\n¿Vendes obra nueva? Escríbeles.", "copy_en": "This pool doesn't exist. Neither does the water. Can you tell? A render by @vitruvistudio of a home delivered in [2028]. The July feeling is on you. Save it for when the heat comes back.", "cta": "Guárdala para cuando vuelva el calor.", "hashtags": ["#piscina", "#villa", "#obranueva", "#render", "#mediterraneo", "#creadaconia", "#vitruvistudio"], "por_que_viral": "Piscina, atardecer y presentadora son la combinación con más retención visual; el giro a wireframe la convierte en pieza de marca y evita que sea solo un cuerpo en bikini. Es la que más perfiles nuevos trae. Siempre el look elegante.", "imagenes": ["villa piscina, bikini elegante con camisa de lino", "wireframe del render", "atardecer en la villa"]}, {"n": 7, "formato": "Carrusel (desde @vitruvistudio, en colaboración con Claudia)", "gancho": "Lámina 1: Claudia en look presentadora, manos abiertas: «Promotor: tu comprador no compra planos».", "idea": "La pieza para promotoras y comercializadoras: deseo, no técnica. Qué ve el comprador y qué siente; por qué el sol real, la mesa puesta y alguien que abre la puerta convierten un render en una visita. Se publica desde Vitruvi sin hashtags y como PDF en el LinkedIn de Stefano.", "plano": ["1 Gancho", "2 «Compra la vida que imagina»", "3 Pareja exterior: «Lo que ve / Lo que siente»", "4 «Sol real de su orientación»", "5 Pareja salón vacío y salón con cena: «Vida dentro»", "6 Claudia en la puerta: «Alguien que abre la puerta»", "7 «27 segundos de vídeo frente a 30 fotos»", "8 «Infografía no contractual y etiqueta IA: confianza»", "9 «¿Promueves, comercializas o tienes que presentar un proyect egúntame lo que quieras.\nRespondo esta tarde desde el sofá. Lo que no hago: precios sin confirmar, asesoría y fingir que soy real.\nPresentadora IA de @vitruvistudio.", "copy_en": "I'm AI. Ask me anything. Answering tonight from the sofa. AI presenter by @vitruvistudio.", "cta": "Pregunta en la caja. Si vendes obra nueva, escribe a Vitruvi.", "hashtags": ["#creadaconia", "#ia", "#obranueva", "#barcelona", "#vitruvistudio"], "por_que_viral": "La honestidad desarma a los críticos y da a la prensa un titular limpio. Las respuestas alimentan reels y cumplen de forma visible el artículo 50 del Reglamento de IA.", "imagenes": ["look presentadora o calle, sentada en el sofá", "piso Poblenou con luz de tarde", "la gata en el plano"]}, {"n": 10, "formato": "Reel", "gancho": "Claudia en el balcón con una grúa detrás: «Vivo en el barrio con más grúas de Barcelona. Y me encanta».", "idea": "Día en mi vida en Poblenou: la luz de las 7:30, la carrera por el Bogatell, el flat white, una obra con casco, la pantalla con el render de esa obra terminada, el vermut. Cierra: «Mi barrio es un render en construcción».", "plano": ["Balcón: gancho", "Ventana con luz, texto «7:30, este»", "Carrera por el paseo marítimo", "Café en la Rambla del Poblenou", "Obra con casco, palma hacia el forjado", "Pantalla: render de la misma obra", "Vermut, manos y mesa", "Puerta: «Mañana, ¿pasamos?»"], "copy_es": "Vivo en el barrio con más grúas de Barcelona. Y me encanta.\nPoblenou: luz de las 7:30, carrera hasta el Bogatell, flat white, una obra con casco a mediodía y su render terminado por la tarde. Vermut al cerrar.\nMi barrio es un render en construcción.\nSígueme para la próxima casa que todavía no existe.\nPresentadora IA de @vitruvistudio.", "copy_en": "I live in the Barcelona neighbourhood with the most cranes. And I love it. Morning light, a run to Bogatell, a flat white, a building site at noon and its render finished by evening. My neighbourhood is a render under construction.", "cta": "Sígueme para la próxima casa que todavía no existe.", "hashtags": ["#poblenou", "#barcelona", "#diaenmivida", "#obranueva", "#22arroba", "#creadaconia", "#vitruvistudio"], "por_que_viral": "El «día en mi vida» convierte visitas en seguidores; el barrio lo comparte su propia comunidad y la frase final es memorable. Enseña que Claudia tiene vida, no solo casas. Caras reales fuera de plano.", "imagenes": ["piso Poblenou: ventana y balcón con grúa", "calle Barcelona, look calle", "playa Bogatell", "obra con casco", "pantalla con render", "vermut, manos y mesa"]}]}</script>

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {

const PZ = { on: false, clone: null, src: null, rect: null, p0x: 0, p0y: 0, d0: 1, s: 1, shade: null, end: null, wheelT: 0 };
function pzBegin(node, cx, cy, d0, end) {

  Object.assign(c.style, { position: "fixed", left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px", margin: "0",

  const cs = getComputedStyle(node);

  if (hd) { const fg = c.matches("img") ? c : c.querySelector("img.fg"); if (fg) { const im = new Image(); im.onload = () => { fg.src = hd; }; im.src = hd; } }
  const shade = el("div", { class: "pz-shade" });

function pzMove(cx, cy, s) {

  if (!PZ.on) return;

  if (!ids.length) list.append(el("p", { class: "empty", text: "Aún no hay finalistas. Toca ★ o haz doble toque en una foto." }));
  if (ids.length >= 2) {
    const cb = el("button", { type: "button", class: "cmp-open", text: `Comparar ${ids.length} finalistas foto a foto` });
    cb.addEventListener("click", () => openCompare(cb));
    list.append(cb);
  }
  for (const k of ids) {
    const s = setFor(k), old = OLD.find(o => o.id === k);
    const img = el("img", { src: old ? old.src : s.avatar, alt: "" });
    const view = el("button", { type: "button", class: "chip-btn", text: "Ver" });
    view.addEventListener("click", () => openStory(SETS.indexOf(s), old ? OLD.indexOf(old) : 0, view));
    list.append(el("div", { class: "pk" }, el("span", { class: "ring sm fin" }, img),
      el("div", {}, el("b", { text: old ? `${old.label} · ronda anterior` : `${s.n} · ${s.title}` }), el("span", { class: "muted", text: picks[k].note || "Sin nota" })),
      view, starBtn(k)));
  }
}

// ---------- Claudia (persona as her own profile) ----------
function renderClaudia() {
  const p = persona, box = document.getElementById("tab-claudia");
  if (!p || !p.resumen) { box.append(el("p", { class: "empty", text: "La personalidad de Claudia aparece aquí en cuanto esté escrita." })); return; }
  box.append(el("div", { class: "pr-head", style: "padding-top:16px" }, el("span", { class: "ring" }, el("span", { class: "mono", text: "C" })),
    el("div", { class: "pr-stats" },
      el("div", {}, el("b", { text: p.posts?.length || 0 }), el("span", { text: "posts listos" })),
      el("div", {}, el("b", { text: "0" }), el("span", { text: "publicados" })),
      el("div", {}, el("b", { text: "ES·EN" }), el("span", { text: "idiomas" })))));
  const chips = el("div", { class: "chips" });
  for (const x of p.resumen.chips || []) chips.append(el("span", { class: "chip", text: x }));
  box.append(el("div", { class: "pr-bio" }, el("b", { text: "Claudia · presentadora IA" }), el("p", { text: p.resumen.frase }), chips));

  const highs = [
    ["Quién es", "Q", () => [card("Su historia", ...(p.historia || []).map(t => el("p", { text: t })))]],
    ["Su vida", "V", () => (p.vida || []).map(v => card(v.titulo, el("p", { text: v.texto })))],
    ["Voz", "“", () => p.voz ? [card("Tono", el("p", { text: p.voz.tono })), card("Frases ES", list(p.voz.frases_es)), card("Frases EN", list(p.voz.frases_en)), card("Gestos", list(p.voz.gestos)), card("Nunca", list(p.voz.nunca))] : []],
    ["Copies", "Aa", () => p.copies ? [card("Reglas", list(p.copies.reglas)), card("Ejemplo ES", el("p", { class: "copy", text: p.copies.ejemplo_es })), card("Example EN", el("p", { class: "copy", text: p.copies.ejemplo_en }))] : []],
    ["Semana", "7", () => [...(p.calendario || []).map(d => card(d.dia, el("p", { text: d.que }))), card("Stories", list(p.stories))]],
    ["Inspiración", "5", () => (p.inspiraciones || []).map(x => card(x.nombre, el("p", { text: x.por_que }), el("p", { class: "muted", text: "Tomamos: " + x.tecnica })))],
  ];
  const hl = el("div", { class: "high" });
  for (const [name, glyph, build] of highs) {
    const b = el("button", { type: "button", class: "hl" }, el("i", { text: glyph }), el("span", { text: name }));
    b.addEventListener("click", () => openDetail(name, build(), b));
    hl.append(b);
  }
  box.append(hl);
  box.append(el("div", { class: "sec-h" }, el("h2", { text: "Sus 10 primeras publicaciones" }), el("span", { class: "muted", text: "Borrador · no se publica nada" })));
  const grid = el("div", { class: "grid" });
  (p.posts || []).forEach((x, i) => {
    const t = el("button", { type: "button", class: `ptile t${i % 3}`, "aria-label": `Publicación ${x.n}` }, el("span", { text: `${x.n} · ${x.formato}` }), document.createTextNode(shortHook(x.gancho)));
    t.addEventListener("click", () => openDetail(`Publicación ${x.n} · ${x.formato}`, [
      el("h3", { text: x.gancho }), el("p", { text: x.idea }),
      x.plano?.length ? card("Planos o láminas", list(x.plano)) : null,
      card("Copy ES", el("p", { class: "copy", text: x.copy_es })),
      card("Copy EN", el("p", { class: "copy", text: x.copy_en })),
      card("Por qué puede viralizar", el("p", { text: x.por_que_viral })),
      card("Fotos que necesita", el("p", { text: (x.imagenes || []).join(" · ") })),
      el("p", { class: "tagsline", text: (x.hashtags || []).join(" ") })], t));
    grid.append(t);
  });
  box.append(grid);
}
function shortHook(h) { const m = h.match(/«([^»]+)»/); const t = m ? m[1] : h; return t.length > 70 ? t.slice(0, 68) + "…" : t; }
function card(title, ...kids) { return el("div", { class: "card" }, el("h4", { text: title }), ...kids); }
function list(arr) { const u = el("ul"); for (const x of arr || []) u.append(el("li", { text: x })); return u; }
function openDetail(title, nodes, from) {
  document.getElementById("dt-title").textContent = title;
  document.getElementById("dt-body").replaceChildren(...nodes.filter(Boolean));
  openSheet("detail", from);
}

// ---------- Tabs ----------
document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => tab(b.dataset.tab)));
document.getElementById("top-count").addEventListener("click", () => tab("picks"));
function tab(name) {
  for (const t of ["feed", "picks", "claudia"]) document.getElementById("tab-" + t).hidden = t !== name;
  document.querySelectorAll("[data-tab]").forEach(b => b.dataset.tab === name ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  window.scrollTo(0, 0);
}

// ---------- Print (PDF) ----------
function renderPrint() {
  const pr = document.getElementById("print");
  pr.append(el("div", { class: "ph", text: "Casting Claudia · ronda 2" }));
  for (const s of SETS.filter(s => s.n)) {
    const row = el("div", { class: "row" });
    for (const f of s.frames) row.append(el("img", { src: f.src, alt: "" }));
    pr.append(el("div", { class: "pp" }, el("h2", { text: `${s.n} · ${s.title} · ${s.age} años` }), el("p", { text: `${s.chips.join(" · ")}${s.inspired ? " · Rasgos de " + s.inspired : ""}` }), row));
  }
  if (persona.posts?.length) {
    const box = el("div", { class: "pposts" });
    for (const x of persona.posts) box.append(el("div", {}, el("b", { text: `${x.n} · ${x.formato}. ` }), document.createTextNode(x.gancho)));
    pr.append(el("div", { class: "pp", style: "break-before:page" }, el("div", { class: "ph", text: "Claudia · 10 primeras publicaciones" }), el("p", { text: persona.resumen?.frase || "" }), box));
  }
}

renderFeed();
renderClaudia();
renderPrint();
refresh();

(async () => {
  try { db = window.claude?.use ? await window.claude.use("db") : null; } catch { db = null; }
  if (!db) { setState("Sin guardar: abre el enlace con tu cuenta"); return; }
  setState("Listo para elegir");
  db.collection("picks").onSnapshot(snap => {
    for (const d of snap.docs) if (d.exists) picks[d.id] = d.data();
    refresh();
  }, () => setState("Conexión perdida: recarga la página"));
})();
</script>
